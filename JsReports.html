<script>
  /* Reports Page - JsReports.html */

  (function () {
    'use strict';

    var S, E;
    var reportSearchDebounceId = 0;
    var REPORT_SEARCH_DEBOUNCE_MS = 140;

    function init() {
      S = window.AppState;
      E = window.AppShared;
    }

    function isCompactReportLayout_() {
      return !!(window.matchMedia && window.matchMedia('(max-width: 767px)').matches);
    }

    function scheduleReportSearchRerender_(inputId) {
      if (reportSearchDebounceId) window.clearTimeout(reportSearchDebounceId);
      reportSearchDebounceId = window.setTimeout(function () {
        reportSearchDebounceId = 0;
        rerenderAndRestoreFocus(inputId);
      }, REPORT_SEARCH_DEBOUNCE_MS);
    }

    function esc(str) {
      if (str === null || str === undefined) return '';
      var div = document.createElement('div'); div.textContent = String(str); return div.innerHTML;
    }

    function renderReportsIcon(kind) {
      if (kind === 'present') return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 12.2l2.3 2.3 4.7-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      if (kind === 'late') return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/><path d="M12 8.5v4l2.5 1.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      if (kind === 'absent') return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/><path d="M9.5 9.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
      if (kind === 'sick') return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="6" y="5" width="12" height="14" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M12 8.5v7M8.5 12h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
      if (kind === 'sick_leave') return renderReportsIcon('sick');
      if (kind === 'leave') return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 5.5h8a2 2 0 012 2v9a2 2 0 01-2 2H8a2 2 0 01-2-2v-9a2 2 0 012-2z" stroke="currentColor" stroke-width="1.8"/><path d="M9 9h6M9 12h6M9 15h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
      if (kind === 'personal_leave') return renderReportsIcon('leave');
      if (kind === 'percent') return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7.5 16.5l9-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="8.5" cy="8.5" r="1.6" stroke="currentColor" stroke-width="1.8"/><circle cx="15.5" cy="15.5" r="1.6" stroke="currentColor" stroke-width="1.8"/></svg>';
      if (kind === 'days') return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="6" width="14" height="13" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M8 4.5v3M16 4.5v3M5 10h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
      if (kind === 'students') return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 17a4.5 4.5 0 019 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="16.5" cy="10" r="2" stroke="currentColor" stroke-width="1.8"/><path d="M14.5 17a4 4 0 014-3.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
      if (kind === 'start') return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 6.5h10a2 2 0 012 2v9a2 2 0 01-2 2H7a2 2 0 01-2-2v-9a2 2 0 012-2z" stroke="currentColor" stroke-width="1.8"/><path d="M9 4.5v4m0 0l-2-2m2 2l2-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      if (kind === 'end') return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 6.5h10a2 2 0 012 2v9a2 2 0 01-2 2H7a2 2 0 01-2-2v-9a2 2 0 012-2z" stroke="currentColor" stroke-width="1.8"/><path d="M15 4.5v4m0 0l-2-2m2 2l2-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      if (kind === 'search') return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
      return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/></svg>';
    }

    function renderLoading() {
      init();
      var panel = document.getElementById('page-reports');
      if (!panel) return;
      panel.innerHTML = '<div class="skeleton-page">' +
        '<div class="skeleton-hero">' +
        '<div class="skeleton-line" style="width:130px"></div>' +
        '<div class="skeleton-line skeleton-line-xl" style="width:42%"></div>' +
        '<div class="skeleton-line skeleton-line-lg" style="width:76%"></div>' +
        '<div class="empty-next-step" data-page-loading-note="true" hidden><div class="empty-next-step-title">กำลังโหลด</div><div class="empty-next-step-text">กำลังเตรียมสรุปรายงานและช่วงวันที่ล่าสุด</div></div>' +
        '</div>' +
        '<div class="skeleton-grid">' +
        '<div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>' +
        '</div>' +
        '<div class="skeleton-grid">' +
        '<div class="skeleton-card skeleton-card-wide"></div><div class="skeleton-card skeleton-card-wide"></div><div class="skeleton-card skeleton-card-wide"></div>' +
        '</div>' +
        '</div>';
    }

    function render(state) {
      init();
      var d = S && S.reportTab === 'daily' ? (S.dailyGrid || {}) : (S.summary || {});
      var panel = document.getElementById('page-reports');
      if (!panel) return;
      var html = '';

      // Header + Tab Nav
      html += '<div class="reports-shell">';
      html += '<section class="reports-hero">';
      html += '<div class="reports-hero-copy">';
      html += '<p class="reports-kicker">รายงานประจำชั้น</p>';
      html += '<h1 class="reports-title">สรุปผลและรายงาน</h1>';
      html += '<p class="reports-subtitle">' + getHeroSubtitle() + '</p>';
      html += '<div class="reports-hero-meta">';
      if (S.activeSemester && S.activeSemester.name) {
        html += '<p class="reports-context">ภาคเรียน ' + esc(S.activeSemester.name) + '</p>';
      }
      html += '<p class="reports-role-badge">' + (S.reportTab === 'daily' ? 'ค้นหารายชื่อก่อน แล้วค่อยเปิดตารางเต็มเมื่อจำเป็น' : 'ดูภาพรวมก่อน แล้วค่อยพิมพ์หรือเตรียมข้อมูลสำหรับผู้ปกครองเมื่อจำเป็น') + '</p>';
      html += '</div>';
      html += '<div class="reports-tab-shell">';
      html += '<div class="rpt-tabs reports-tabs">';
      html += '<button class="rpt-tab' + (S.reportTab === 'summary' ? ' active' : '') + '" onclick="ReportsPage.switchTab(\'summary\')">สรุปภาพรวม</button>';
      html += '<button class="rpt-tab' + (S.reportTab === 'daily' ? ' active' : '') + '" onclick="ReportsPage.switchTab(\'daily\')">รายงานรายวัน</button>';
      html += '</div>';
      html += '</div>';

      html += '</div>';
      html += '<div class="reports-hero-side">';
      html += S.reportTab === 'summary' ? renderSummaryControls() : renderDailyControls();

      html += '</div>';

      html += '</section>';
      if (S.reportTab === 'summary') {
        html += renderSummaryTab();
      } else {
        html += renderDailyTab();
      }

      html += '</div>';
      panel.innerHTML = html;
    }

    // SUMMARY TAB

    function renderSummaryTab() {
      var d = S.summary;
      var summaryState = E.getPageDataStatus ? E.getPageDataStatus('reports', 'summary') : { status: 'idle', error: '' };
      if (!d) {
        if (summaryState.status === 'loading') {
          return buildReportEmptyState(
            renderReportsIcon('days'),
            'กำลังโหลดสรุปรายงานของห้องนี้',
            'ระบบกำลังเตรียมข้อมูลสรุปตามช่วงวันที่ที่เลือกไว้ คุณยังเปลี่ยนช่วงวันที่หรือกลับไปหน้าอื่นก่อนได้',
            '',
            '<div class="empty-next-step-title">สิ่งที่ควรทำต่อ</div><div class="empty-next-step-text">รอสักครู่ให้ระบบสรุปข้อมูลก่อน หากโหลดนานผิดปกติให้กดอัปเดตข้อมูลอีกครั้ง</div>'
          );
        }
        if (summaryState.status === 'error') {
          return buildReportEmptyState(
            renderReportsIcon('days'),
            'ยังโหลดสรุปรายงานไม่สำเร็จ',
            summaryState.error || 'ลองโหลดข้อมูลอีกครั้งในช่วงวันที่เดิม หรือเปลี่ยนช่วงวันที่แล้วลองใหม่',
            '<button class="btn btn-primary" type="button" onclick="ReportsPage.loadSummary(this)">ลองใหม่</button>',
            '<div class="empty-next-step-title">สิ่งที่ควรทำต่อ</div><div class="empty-next-step-text">ตรวจช่วงวันที่ก่อน ถ้ายังไม่ได้ให้กลับไปยืนยันวันเช็กชื่อแล้วค่อยเปิดรายงานอีกครั้ง</div>'
          );
        }
        return buildReportEmptyState(
          renderReportsIcon('days'),
          'ยังไม่มีสรุปผลให้แสดง',
          'เลือกช่วงวันที่แล้วกดโหลดข้อมูลเพื่อดูภาพรวมการมาเรียนของทั้งห้อง',
          '<button class="btn btn-primary" type="button" onclick="ReportsPage.loadSummary(this)">โหลดข้อมูล</button>',
          '<div class="empty-next-step-title">สิ่งที่ควรทำต่อ</div><div class="empty-next-step-text">เริ่มจากเลือกช่วงวันที่ในภาคเรียนที่ต้องการ แล้วกดโหลดข้อมูลเพื่อดูรายงานสรุปของห้องนี้</div>'
        );
      }

      var allRows = Array.isArray(d.rows) ? d.rows : [];
      var rows = getFilteredSummaryRows(allRows);
      var html = '';
      var totals = d.totals || {};
      var topAbsent = rows.slice().filter(function (row) {
        return Number(row.absent_count || 0) > 0;
      }).sort(function (a, b) {
        return Number(b.absent_count || 0) - Number(a.absent_count || 0);
      }).slice(0, 5);
      var topLate = rows.slice().filter(function (row) {
        return Number(row.late_count || 0) > 0;
      }).sort(function (a, b) {
        return Number(b.late_count || 0) - Number(a.late_count || 0);
      }).slice(0, 5);

        html += renderReportsSpotlight('summary', d);
        if (!hasSummaryMeasurementData(d)) {
          html += renderSummaryNoMeasurementState(d);
          html += renderHolidayConflictSection(d, 'summary');
          return html;
        }
      html += renderSummaryExecutiveBrief(d, allRows);
      html += '<section class="reports-section">';
      html += '<div class="reports-section-head">';
      html += '<div><h2 class="reports-section-title">ภาพรวมช่วงวันที่</h2><p class="reports-section-text">สรุปสถานะทั้งหมดในช่วง ' + esc(d.start_date_th) + ' - ' + esc(d.end_date_th) + '</p></div>';
      html += '</div>';
      if (d.calendar_warning && d.calendar_warning.has_mismatch && d.calendar_warning.message) {
        html += '<div class="alert alert-warning mb-3">' + renderReportsIcon('days') + '<span>' + esc(d.calendar_warning.message) + '</span></div>';
      }
      html += '<div class="reports-metric-grid">';
      html += reportMetric(renderReportsIcon('days'), d.school_days || 0, 'วันเรียนตามปฏิทิน', 'stone');
      html += reportMetric(renderReportsIcon('days'), d.confirmed_days_count || 0, 'วันที่ยืนยันแล้ว', 'stone');
      html += reportMetric(renderReportsIcon('present'), totals.present, 'มาเรียน', 'green');
      html += reportMetric(renderReportsIcon('late'), totals.late, 'สาย', 'amber');
      html += reportMetric(renderReportsIcon('absent'), totals.absent, 'ขาด', 'red');
      html += reportMetric(renderReportsIcon('sick'), totals.sick_leave, 'ลาป่วย', 'blue');
      html += reportMetric(renderReportsIcon('leave'), totals.personal_leave, 'ลากิจ', 'indigo');
      html += reportMetric(renderReportsIcon('percent'), formatPercentLabel(totals.attendance_percent), 'อัตรามาเรียน', 'stone');
      html += '</div>';
      html += '</section>';
      html += renderHolidayConflictSection(d, 'summary');
      html += renderSummaryComparisonSection(d);
      html += renderSummaryActionPlan(allRows, d);

      html += renderSummaryFilters(allRows, rows);

      html += '<section class="reports-section">';
      html += '<div class="reports-section-head">';
      html += '<div><h2 class="reports-section-title">สรุปรายคน</h2><p class="reports-section-text">ค้นหาและกรองนักเรียนที่ต้องติดตาม ก่อนเปิดดูรายละเอียดในตารางเต็ม</p></div>';
      html += '</div>';
      if (!rows.length) {
        html += buildReportEmptyState(
          renderReportsIcon('students'),
          'ไม่พบรายการที่ตรงกับตัวกรอง',
          'ลองล้างคำค้นหรือเปลี่ยน quick filter เพื่อดูนักเรียนทั้งหมดอีกครั้ง',
          '<button class="btn btn-ghost" type="button" onclick="ReportsPage.clearFilters()">ล้างตัวกรอง</button>',
          '<div class="empty-next-step-title">สิ่งที่ควรทำต่อ</div><div class="empty-next-step-text">ล้างตัวกรองก่อน แล้วค่อยค้นชื่อหรือเลือกกลุ่มนักเรียนใหม่อีกครั้ง</div>'
        );
      } else {
        if (isCompactReportLayout_()) {
          html += renderSummaryMobileCards(rows);
        } else {
          html += renderSummaryTable(rows);
        }
      }
      html += '</section>';

      html += renderSummaryWatchSection(topAbsent, topLate);

      if (d.leave_reasons && d.leave_reasons.length > 0) {
        html += '<section class="reports-section">';
        html += '<div class="reports-section-head">';
        html += '<div><h2 class="reports-section-title">เหตุผลที่พบบ่อย</h2><p class="reports-section-text">ใช้ดูบริบทของการลาและมาสาย เพื่อช่วยอธิบายตัวเลขในภาพรวมได้เร็วขึ้น</p></div>';
        html += '</div>';
        html += '<div class="card reports-surface">';
        html += '<div class="rpt-reasons">';
        d.leave_reasons.forEach(function (reason) {
          var statusInfo = { sick_leave: { label: 'ลาป่วย', color: 'blue' }, personal_leave: { label: 'ลากิจ', color: 'indigo' }, late: { label: 'มาสาย', color: 'amber' } };
          var info = statusInfo[reason.status_code] || { label: 'หมายเหตุ', color: 'stone' };
          html += '<span class="rpt-reason badge-' + info.color + '">' + info.label + ' · ' + esc(reason.note) + ' x' + esc(String(reason.count || 0)) + '</span>';
        });
        html += '</div></div></section>';
      }

      return html;
    }

    // DAILY GRID TAB

    function renderDailyTab() {
      var d = S.dailyGrid;
      var dailyState = E.getPageDataStatus ? E.getPageDataStatus('reports', 'daily') : { status: 'idle', error: '' };
      if (!d) {
        if (dailyState.status === 'loading') {
          return buildReportEmptyState(
            renderReportsIcon('days'),
            'กำลังโหลดรายงานรายวัน',
            'ระบบกำลังเตรียมตารางย้อนหลังตามช่วงวันที่ที่เลือกไว้ เมื่อพร้อมแล้วจะแสดงรายชื่อนักเรียนและสถานะแต่ละวันทันที',
            '',
            '<div class="empty-next-step-title">สิ่งที่ควรทำต่อ</div><div class="empty-next-step-text">รอสักครู่ให้ระบบเตรียมตารางย้อนหลัง หรือเปลี่ยนช่วงวันที่แล้วลองใหม่หากจำเป็น</div>'
          );
        }
        if (dailyState.status === 'error') {
          return buildReportEmptyState(
            renderReportsIcon('days'),
            'ยังโหลดรายงานรายวันไม่สำเร็จ',
            dailyState.error || 'ลองโหลดตารางรายวันอีกครั้ง หรือเปลี่ยนช่วงวันที่แล้วลองใหม่',
            '<button class="btn btn-primary" type="button" onclick="ReportsPage.loadDailyGrid(this)">ลองใหม่</button>',
            '<div class="empty-next-step-title">สิ่งที่ควรทำต่อ</div><div class="empty-next-step-text">ตรวจช่วงวันที่ก่อน แล้วกดโหลดข้อมูลอีกครั้ง หากยังไม่ได้ให้กลับไปยืนยันวันเช็กชื่อก่อน</div>'
          );
        }
        return buildReportEmptyState(
          renderReportsIcon('days'),
          'ยังไม่มีรายงานรายวัน',
          'เลือกช่วงวันที่แล้วกดโหลดข้อมูล เพื่อดูสถานะของนักเรียนแบบรายวัน',
          '<button class="btn btn-primary" type="button" onclick="ReportsPage.loadDailyGrid(this)">โหลดข้อมูล</button>',
          '<div class="empty-next-step-title">สิ่งที่ควรทำต่อ</div><div class="empty-next-step-text">เลือกช่วงวันที่ที่ต้องการตรวจย้อนหลัง แล้วกดโหลดข้อมูลเพื่อดูตารางรายวันของนักเรียนทั้งห้อง</div>'
        );
      }

      var filteredStudents = getFilteredDailyStudents(d.students || []);
      var html = '';
      html += renderReportsSpotlight('daily', d);
      html += '<section class="reports-section">';
      html += '<div class="reports-section-head">';
      html += '<div><h2 class="reports-section-title">ภาพรวมรายวัน</h2><p class="reports-section-text">ดูจำนวนวัน จำนวนคน และค้นหานักเรียนก่อนเปิดตารางเต็ม</p></div>';
      html += '</div>';
      html += '<div class="reports-metric-grid reports-daily-metrics">';
      html += reportMetric(renderReportsIcon('days'), d.school_days || 0, 'วันเรียนตามปฏิทิน', 'stone');
      html += reportMetric(renderReportsIcon('days'), d.confirmed_days_count || 0, 'วันที่ยืนยันแล้ว', 'stone');
      html += reportMetric(renderReportsIcon('students'), (d.students || []).length, 'จำนวนนักเรียน', 'blue');
      html += reportMetric(renderReportsIcon('start'), d.from_th || '', 'เริ่มต้น', 'amber');
      html += reportMetric(renderReportsIcon('end'), d.to_th || '', 'สิ้นสุด', 'green');
      html += '</div>';
      html += '</section>';

      html += renderHolidayConflictSection(d, 'daily');

      html += renderDailySearchToolbar(d, filteredStudents);

      html += '<section class="reports-section">';
      html += '<div class="reports-section-head">';
      html += '<div><h2 class="reports-section-title">รายงานรายวัน</h2><p class="reports-section-text">บนเดสก์ท็อปยังมีตารางเต็ม ส่วนบนมือถือเปลี่ยนเป็นการ์ดสรุปเพื่อให้ดูง่ายขึ้น</p></div>';
      html += '</div>';
      if (!filteredStudents.length) {
        html += buildReportEmptyState(
          renderReportsIcon('students'),
          'ไม่พบนักเรียนที่ตรงกับคำค้น',
          'ลองเปลี่ยนคำค้นหา หรือกดล้างตัวกรองเพื่อกลับไปดูทั้งหมด',
          '<button class="btn btn-ghost" type="button" onclick="ReportsPage.clearFilters()">ล้างตัวกรอง</button>',
          '<div class="empty-next-step-title">สิ่งที่ควรทำต่อ</div><div class="empty-next-step-text">ล้างคำค้นก่อน แล้วลองค้นจากเลขที่ ชื่อ หรือชื่อเล่นใหม่อีกครั้ง</div>'
        );
      } else {
        if (isCompactReportLayout_()) {
          html += renderDailyMobileCards(d, filteredStudents);
        } else {
          html += renderDailyGridTable(d, filteredStudents);
        }
      }
      html += '</section>';
      return html;
    }

    function renderDailyGridTable(d, students) {
      var html = '';
      html += '<div class="card reports-surface reports-daily-desktop">';
      html += '<div class="rpt-table-wrap rpt-daily-scroll"><table class="rpt-table rpt-daily-table">';
      html += '<thead><tr><th class="rpt-sticky-col">เลขที่</th><th class="rpt-sticky-col2">ชื่อ</th>';
      (d.dates || []).forEach(function (dt) {

        counts.late > 0

          : 'ช่วงนี้ยังไม่พบการมาสายที่ต้องยกขึ้นมาเตือนเป็นพิเศษ',

        counts.late > 0 ? 'amber' : 'green'
      );

        counts.excellent > 0

          : 'ถ้าต้องการยกตัวอย่างเชิงบวก ลองติดตามต่ออีกช่วงเพื่อให้เห็นกลุ่มเรียบร้อยชัดขึ้น',
        counts.excellent > 0 ? 'ดูเฉพาะคนที่เรียบร้อย' : 'ดูภาพรวมทั้งหมด',

      );

    function renderKv(label, value, modifier) {
      return '<div class="reports-kv' + (modifier ? ' reports-kv-' + modifier : '') + '"><div class="reports-kv-label">' + esc(label) + '</div><div class="reports-kv-value' + (modifier === 'accent' ? ' reports-kv-value-accent' : '') + '">' + esc(String(value || 0)) + '</div></div>';
    }

    function normalizeReportQuery(value) {
      return String(value || '').trim().toLowerCase();
    }

    function getPercentValue(value) {
      if (value === null || value === undefined || value === '') return null;
      var num = Number(value);
      return isFinite(num) ? num : null;
    }

    function formatPercentLabel(value) {
      var pct = getPercentValue(value);
      return pct === null ? '-' : String(pct) + '%';
    }

    function getPercentBarWidth(value) {
      var pct = getPercentValue(value);
      return pct === null ? 0 : Math.max(0, Math.min(100, pct));
    }

    function hasSummaryMeasurementData(data) {
      var totals = data && data.totals ? data.totals : {};
      return Number(totals.total_days || 0) > 0;
    }

    function getSummaryAlertPercent() {
      var summary = S && S.summary ? S.summary : {};
      var pct = Number(summary.attendance_alert_percent || 0);
      return pct > 0 ? pct : 80;
    }

    function matchesReportStudent(item, query) {
      if (!query) return true;
      var haystack = [item.student_number, item.full_name, item.nickname, item.group_name].join(' ').toLowerCase();
      return haystack.indexOf(query) >= 0;
    }

    function matchesSummaryQuickFilter(row, filter) {
      var attendancePercent = getPercentValue(row.attendance_percent);
      var absentCount = Number(row.absent_count || 0);
      var lateCount = Number(row.late_count || 0);
      if (filter === 'attention') return !!row.is_below_threshold || absentCount > 0 || lateCount > 1 || (attendancePercent !== null && attendancePercent < getSummaryAlertPercent());
      if (filter === 'absent') return absentCount > 0;
      if (filter === 'late') return lateCount > 0;
      if (filter === 'excellent') return attendancePercent !== null && attendancePercent >= 95 && absentCount === 0 && lateCount === 0;
      return true;
    }

    function getSummaryQuickFilterCounts(rows) {
      var counts = { all: rows.length, attention: 0, absent: 0, late: 0, excellent: 0 };
      rows.forEach(function (row) {
        if (matchesSummaryQuickFilter(row, 'attention')) counts.attention += 1;
        if (matchesSummaryQuickFilter(row, 'absent')) counts.absent += 1;
        if (matchesSummaryQuickFilter(row, 'late')) counts.late += 1;
        if (matchesSummaryQuickFilter(row, 'excellent')) counts.excellent += 1;
      });
      return counts;
    }

    function getFilteredSummaryRows(rows) {
      var query = normalizeReportQuery(S.reportSearchQuery);
      var filter = S.reportQuickFilter || 'all';
      return rows.filter(function (row) {
        return matchesReportStudent(row, query) && matchesSummaryQuickFilter(row, filter);
      });
    }

    function getSummaryStatusTone(row) {
      var attendancePercent = getPercentValue(row.attendance_percent);
      var absentCount = Number(row.absent_count || 0);
      var lateCount = Number(row.late_count || 0);
      if (!!row.is_below_threshold || absentCount >= 2 || (attendancePercent !== null && attendancePercent < getSummaryAlertPercent())) return 'red';
      if (attendancePercent === null && absentCount === 0 && lateCount === 0) return 'amber';
      if (absentCount > 0 || lateCount > 0 || (attendancePercent !== null && attendancePercent < 95)) return 'amber';
      return 'green';
    }

    function getSummaryStatusLabel(row) {
      var attendancePercent = getPercentValue(row.attendance_percent);
      var absentCount = Number(row.absent_count || 0);
      var lateCount = Number(row.late_count || 0);
      if (attendancePercent === null && absentCount === 0 && lateCount === 0) return 'ไม่มีวันวัดผล';
      var tone = getSummaryStatusTone(row);
      if (tone === 'red') return 'ต้องติดตาม';
      if (tone === 'amber') return 'ควรเช็กต่อ';
      return 'เรียบร้อย';
    }

    function getSummaryExecutiveTone_(data, counts) {
      var totals = data && data.totals ? data.totals : {};
      var pct = getPercentValue(totals.attendance_percent);
      if ((counts && counts.attention > 0) || Number(totals.absent || 0) > 0) return 'red';
      if (pct !== null && pct >= 95) return 'green';
      return 'amber';
    }

    function getSummaryExecutiveTitle_(data, counts) {
      var totals = data && data.totals ? data.totals : {};
      var pct = getPercentValue(totals.attendance_percent);
      if ((counts && counts.attention > 0) || Number(totals.absent || 0) > 0) return 'สรุปช่วงนี้ออกแล้ว และเห็นเลยว่าควรตามใครก่อน';
      if (pct !== null && pct >= 95) return 'ภาพรวมช่วงนี้เรียบร้อยและพร้อมใช้อ้างอิงในห้องเรียนได้ทันที';
      return 'ภาพรวมช่วงนี้อยู่ในเกณฑ์ดี และมีจุดเช็กต่อชัดเจน';
    }

    function buildSummarySnippet_(data, rows) {
      var totals = data && data.totals ? data.totals : {};
      var counts = getSummaryQuickFilterCounts(rows || []);
      var statusText = Number(totals.absent || 0) > 0 || Number(totals.late || 0) > 0
        ? 'พบขาด ' + String(totals.absent || 0) + ' ครั้ง และมาสาย ' + String(totals.late || 0) + ' ครั้ง'
        : 'ยังไม่พบการขาดหรือมาสายในช่วงนี้';
      return 'ช่วง ' + String(data && data.start_date_th || '') + ' - ' + String(data && data.end_date_th || '') + ' ห้องนี้มีอัตรามาเรียนเฉลี่ย ' + formatPercentLabel(totals.attendance_percent) + ' จากนักเรียน ' + String((rows || []).length) + ' คน มี ' + String(counts.attention || 0) + ' คนที่ควรติดตาม และ' + statusText;
    }

    function getSummaryDeltaDisplay_(deltaValue, deltaType, betterWhenLower) {
      var amount = Number(deltaValue);
      if (!isFinite(amount)) return { tone: 'stone', label: 'ยังไม่มีข้อมูลเทียบ' };
      if (amount === 0) return { tone: 'stone', label: 'เท่าเดิมจากช่วงก่อน' };
      var isBetter = betterWhenLower ? amount < 0 : amount > 0;
      var absoluteValue = Math.abs(amount);
      var unitLabel = deltaType === 'point' ? 'จุด' : 'ครั้ง';
      return {
        tone: isBetter ? 'green' : 'red',
        label: (isBetter ? 'ดีขึ้น ' : 'แย่ลง ') + String(absoluteValue) + ' ' + unitLabel
      };
    }

    function getFilteredDailyStudents(students) {
      var query = normalizeReportQuery(S.reportDailySearchQuery);
      return students.filter(function (student) {
        return matchesReportStudent(student, query);
      });
    }

    function summarizeDailyStudent(student, dates) {
      var schoolDates = (dates || []).filter(function (day) { return !day.is_holiday; });
      var summary = {
        present: 0,
        late: 0,
        absent: 0,
        sick: 0,
        personal: 0,
        leaveTotal: 0,
        recordedDays: 0,
        totalDates: schoolDates.length,
        events: [],
        tone: 'green',
        label: 'ครบถ้วน'
      };

      dates.forEach(function (day) {
        if (day.is_holiday) {
          if (student.statuses && student.statuses[day.date]) {
            summary.events.push({ dateLabel: day.label, label: 'มีข้อมูลในวันหยุด', tone: 'red' });
          }
          return;
        }
        var status = student.statuses && student.statuses[day.date];
        if (!status) return;
        summary.recordedDays += 1;
        if (status.status_code === 'present') summary.present += 1;
        if (status.status_code === 'late') {
          summary.late += 1;
          summary.events.push({ dateLabel: day.label, label: status.label || 'มาสาย', tone: 'amber' });
        }
        if (status.status_code === 'absent') {
          summary.absent += 1;
          summary.events.push({ dateLabel: day.label, label: status.label || 'ขาดเรียน', tone: 'red' });
        }
        if (status.status_code === 'sick_leave') {
          summary.sick += 1;
          summary.events.push({ dateLabel: day.label, label: status.label || 'ลาป่วย', tone: 'blue' });
        }
        if (status.status_code === 'personal_leave') {
          summary.personal += 1;
          summary.events.push({ dateLabel: day.label, label: status.label || 'ลากิจ', tone: 'indigo' });
        }
      });

      summary.leaveTotal = summary.sick + summary.personal;
      if (summary.absent > 0) {
        summary.tone = 'red';
        summary.label = 'มีวันขาด';
      } else if (summary.late > 0) {
        summary.tone = 'amber';
        summary.label = 'มีวันสาย';
      } else if (summary.leaveTotal > 0) {
        summary.tone = 'blue';
        summary.label = 'มีวันลา';
      }

      return summary;
    }

    function getHeroSubtitle() {
      if (S.reportTab === 'daily') {
        return 'ดูย้อนหลังแบบรายวัน ค้นหาง่าย และอ่านสะดวกทั้งบนมือถือและเดสก์ท็อป';

    }

        } else {
          title = pct === null
            ? 'ช่วงนี้ยังไม่มีวันวัดผลเพียงพอสำหรับสรุป % มาเรียน'
            : (pct >= 95 ? 'ภาพรวมช่วงนี้พร้อมสรุปผลได้ทันที' : (pct >= alertPct ? 'ภาพรวมช่วงนี้อยู่ในเกณฑ์ดี' : 'ช่วงนี้ควรติดตามการมาเรียนเพิ่มเติม'));
          text = 'อัตรามาเรียนเฉลี่ยอยู่ที่ ' + esc(formatPercentLabel(totals.attendance_percent)) + ' จากช่วง ' + esc(data.start_date_th || '') + ' - ' + esc(data.end_date_th || '');
          meta = Number(totals.absent || 0) > 0
            ? 'มีรายการขาด ' + esc(String(totals.absent || 0)) + ' ครั้ง และมาสาย ' + esc(String(totals.late || 0)) + ' ครั้งในช่วงนี้'
            : 'ยังไม่พบการขาดเรียนในช่วงนี้';
        }
      }

      return '<section class="reports-spotlight reports-spotlight-' + esc(mode) + '">' +
        '<div class="reports-spotlight-kicker">สิ่งที่ควรดูเป็นอันดับแรก</div>' +
        '<div class="reports-spotlight-title">' + title + '</div>' +
        '<div class="reports-spotlight-text">' + text + '</div>' +
        '<div class="reports-spotlight-meta">' + meta + '</div>' +
        '</section>';
    }

      html += '</div>';

    function getDefaultSummaryRange_() {
      if (S.summary && S.summary.start_date && S.summary.end_date) {
        return { from: S.summary.start_date, to: S.summary.end_date };
      }
      if (S.reportBootstrap && S.reportBootstrap.default_summary_range) {
        return {
          from: S.reportBootstrap.default_summary_range.from || '',
          to: S.reportBootstrap.default_summary_range.to || ''
        };
      }
      if (S.activeSemester && S.activeSemester.start_date && S.activeSemester.end_date) {
        return { from: S.activeSemester.start_date, to: S.activeSemester.end_date };
      }
      var today = E && typeof E.todayStr === 'function' ? E.todayStr() : '';
      return {
        from: today ? String(today).slice(0, 7) + '-01' : '',
        to: today || ''
      };
    }

    function getDefaultDailyRange_() {
      if (S.dailyGridFrom && S.dailyGridTo) {
        return { from: S.dailyGridFrom, to: S.dailyGridTo };
      }
      if (S.reportBootstrap && S.reportBootstrap.default_daily_range) {
        return {
          from: S.reportBootstrap.default_daily_range.from || '',
          to: S.reportBootstrap.default_daily_range.to || ''
        };
      }
      return getDefaultSummaryRange_();
    }

    function getDailyPrintDate_() {
      if (S.dailyPrintDate) return S.dailyPrintDate;
      if (S.dailyGridFrom) return S.dailyGridFrom;
      var range = getDefaultDailyRange_();
      return range.from || '';
    }

    function getPrintReadinessHints_(mode, data) {
      var hints = [];
      if (!data) return hints;
      if (data.out_of_semester) {
        hints.push({
          tone: 'warning',
          message: 'ช่วงวันที่นี้อยู่นอกภาคเรียนปัจจุบัน ให้กลับไปเลือกช่วงวันในภาคเรียนก่อนจึงจะพิมพ์รายงานทางการได้'
        });
        return hints;
      }
      if (mode === 'monthly') {
        var schoolDays = parseInt(data.school_days, 10) || 0;
        var confirmedDays = parseInt(data.confirmed_days_count, 10) || 0;
        if (schoolDays <= 0) {
          hints.push({
            tone: 'warning',
            message: 'ช่วงวันที่นี้ยังไม่มีวันเรียนตามปฏิทิน จึงยังพิมพ์รายงานสรุปแบบทางการไม่ได้'
          });
        } else if (confirmedDays <= 0) {
          hints.push({
            tone: 'warning',
            message: 'ช่วงวันที่นี้ยังไม่มีวันเช็คชื่อที่ยืนยันแล้ว หากต้องการพิมพ์ ปพ.6 ควรยืนยันข้อมูลก่อน'
          });
        } else if (confirmedDays < schoolDays) {
          hints.push({
            tone: 'info',
            message: 'ช่วงนี้ยืนยันข้อมูลแล้ว ' + confirmedDays + ' จากวันเรียนตามปฏิทิน ' + schoolDays + ' วัน รายงานที่พิมพ์จะสะท้อนเฉพาะวันที่ยืนยันแล้ว'
          });
        }
      } else if (mode === 'daily') {
        var printDate = getDailyPrintDate_();
        if (!printDate) {
          hints.push({
            tone: 'warning',
            message: 'เลือกวันที่ที่จะพิมพ์รายงานวันก่อน แล้วจึงเปิดหน้าพิมพ์ได้'
          });
        }
      }
      if (data.calendar_warning && data.calendar_warning.has_mismatch && data.calendar_warning.message) {
        hints.push({
          tone: 'warning',
          message: data.calendar_warning.message
        });
      }
      return hints;
    }

    function getPrintPreflightIssue_(type) {
      if (type === 'daily') {
        var dateEl = document.getElementById('rpt-daily-print-date');
        var printDate = dateEl && dateEl.value ? dateEl.value : getDailyPrintDate_();
        if (!printDate) return 'กรุณาเลือกวันที่ที่จะพิมพ์รายงานวัน';
        if (!S.dailyGrid) return 'กรุณาโหลดตารางรายวันก่อนพิมพ์รายงานวัน';
        if (S.dailyGrid.out_of_semester) return 'ช่วงวันที่ที่โหลดอยู่นอกภาคเรียน กรุณากลับไปเลือกวันในภาคเรียนก่อน';
        return '';
      }

      if (!S.summary) return 'กรุณาโหลดข้อมูลรายงานสรุปก่อนพิมพ์';
      if (S.summary.out_of_semester) return 'ช่วงวันที่นี้อยู่นอกภาคเรียนปัจจุบัน กรุณากลับไปเลือกช่วงวันที่ในภาคเรียนก่อน';
      if (!S.summary.start_date || !S.summary.end_date) return 'กรุณาเลือกช่วงวันที่ก่อนพิมพ์รายงาน';

      if (type === 'pp6') {
        var schoolDays = parseInt(S.summary.school_days, 10) || 0;
        var confirmedDays = parseInt(S.summary.confirmed_days_count, 10) || 0;
        if (schoolDays <= 0) return 'ช่วงวันที่นี้ยังไม่มีวันเรียนตามปฏิทิน ให้กลับไปสร้างปฏิทินวันเรียนก่อนจึงจะพิมพ์ ปพ.6 ได้';
        if (confirmedDays <= 0) return 'ช่วงวันที่นี้ยังไม่มีข้อมูลยืนยันแล้ว ให้กลับไปยืนยันวันเช็กชื่อก่อนอย่างน้อย 1 วันจึงจะพิมพ์ ปพ.6 ได้';
      }

      return '';
    }

    function loadSummary(buttonEl, options) {
      init();
      options = options || {};
      var startEl = document.getElementById('rpt-start');
      var endEl = document.getElementById('rpt-end');
      var fallbackRange = getDefaultSummaryRange_();
      var startDate = startEl ? startEl.value : fallbackRange.from;
      var endDate = endEl ? endEl.value : fallbackRange.to;

      if (!startDate || !endDate) {
        E.toast('กรุณาเลือกช่วงวันที่', 'error');
        return;
      }
      if (startDate > endDate) {
        E.toast('วันที่เริ่มต้นต้องไม่มากกว่าวันที่สิ้นสุด', 'error');
        return;
      }

      if (E.setPageDataStatus) E.setPageDataStatus('reports', 'summary', 'loading', '');
      if (!options.preserveView) render(S);
      if (E.setActionButtonState) E.setActionButtonState(buttonEl, true, 'กำลังโหลด...');
      if (!options.silent) E.toast('กำลังโหลดรายงาน...', 'info');
      var requestFn = options.quiet && E.serverCallQuiet ? E.serverCallQuiet : E.serverCall;
      requestFn('getSummaryTable', [startDate, endDate], function (data) {
        if (options.loadToken && E.isActivePageLoad && !E.isActivePageLoad(options.loadToken)) return;
        if (E.setActionButtonState) E.setActionButtonState(buttonEl, false);
        S.summary = data;
        S.reportMonth = data && data.start_date ? String(data.start_date).slice(0, 7) : '';
        S.reportTab = 'summary';
        if (E.setPageDataStatus) E.setPageDataStatus('reports', 'summary', 'ready', '');
        render(S);
      }, function (msg) {
        if (options.loadToken && E.isActivePageLoad && !E.isActivePageLoad(options.loadToken)) return;
        if (E.setActionButtonState) E.setActionButtonState(buttonEl, false);
        if (E.setPageDataStatus) E.setPageDataStatus('reports', 'summary', 'error', msg || 'ยังโหลดสรุปรายงานไม่สำเร็จ');
        render(S);
      });
    }

    function loadDailyGrid(buttonEl, options) {
      init();
      options = options || {};
      var fromEl = document.getElementById('rpt-grid-from');
      var toEl = document.getElementById('rpt-grid-to');
      var fallbackRange = getDefaultDailyRange_();
      var from = fromEl ? fromEl.value : fallbackRange.from;
      var to = toEl ? toEl.value : fallbackRange.to;

      S.dailyGridFrom = from;
      S.dailyGridTo = to;
      if (E.setPageDataStatus) E.setPageDataStatus('reports', 'daily', 'loading', '');

      if (E.setActionButtonState) E.setActionButtonState(buttonEl, true, 'กำลังโหลด...');
      if (!options.silent) E.toast('กำลังโหลดตารางรายวัน...', 'info');
      var requestFn = options.quiet && E.serverCallQuiet ? E.serverCallQuiet : E.serverCall;
      requestFn('getDailyGrid', [from, to], function (data) {
        if (options.loadToken && E.isActivePageLoad && !E.isActivePageLoad(options.loadToken)) return;
        if (E.setActionButtonState) E.setActionButtonState(buttonEl, false);

    function clearHolidayAttendance(date, buttonEl, sourceTab) {
      init();
      if (!date) {
        E.toast('ไม่พบวันที่ของรายการที่ต้องการล้าง', 'error');
        return;
      }
      var confirmFn = E.confirm_dialog || window.confirm_dialog;

        E.toast('ไม่สามารถเปิดกล่องยืนยันได้ กรุณารีโหลดหน้าแล้วลองอีกครั้ง', 'error');
        return;
      }
      confirmFn('ต้องการล้างข้อมูลเช็คชื่อที่อยู่ในวันหยุด ' + date + ' ใช่หรือไม่', function () {

        E.serverCall('clearHolidayAttendance', [date], function (result) {
          if (E.setActionButtonState) E.setActionButtonState(buttonEl, false);
          E.toast((result && result.message) || 'ล้างข้อมูลเรียบร้อย', result && result.success ? 'success' : 'error');
          if (!result || !result.success) return;

    function exportCSV(type, buttonEl) {
      init();
      var params = {};

      if (type === 'monthly') {
        var startEl = document.getElementById('rpt-start');
        var endEl = document.getElementById('rpt-end');
        params.start_date = startEl ? startEl.value : '';
        params.end_date = endEl ? endEl.value : '';

        if (!params.start_date || !params.end_date) {
          E.toast('กรุณาเลือกช่วงวันที่', 'error');
          return;
        }
        if (params.start_date > params.end_date) {
          E.toast('วันที่เริ่มต้นต้องไม่มากกว่าวันที่สิ้นสุด', 'error');
          return;
        }
      } else {
        var fromEl = document.getElementById('rpt-grid-from');
        var toEl = document.getElementById('rpt-grid-to');
        params.from = fromEl ? fromEl.value : '';
        params.to = toEl ? toEl.value : '';

        if (!params.from || !params.to) {
          E.toast('กรุณาเลือกช่วงวันที่', 'error');
          return;
        }
        if (params.from > params.to) {
          E.toast('วันที่เริ่มต้นต้องไม่มากกว่าวันที่สิ้นสุด', 'error');
          return;
        }
      }

      if (E.setActionButtonState) E.setActionButtonState(buttonEl, true, 'กำลังสร้างไฟล์...');
      E.toast('กำลังสร้างไฟล์ CSV...', 'info');
      E.serverCall('downloadCSV', [type, params], function (result) {
        if (E.setActionButtonState) E.setActionButtonState(buttonEl, false);
        if (!result || !result.success || !result.url) {
          E.toast((result && result.message) || 'ไม่สามารถสร้าง CSV ได้', 'error');
          return;
        }

        var downloadWindow = E.openDownloadWindow(result.url, 'เบราว์เซอร์บล็อกหน้าดาวน์โหลด กรุณาอนุญาต pop-up แล้วลองใหม่');
        if (!downloadWindow) {
          E.toast('เบราว์เซอร์บล็อกหน้าดาวน์โหลด กรุณาอนุญาต pop-up แล้วลองใหม่', 'error');
          return;
        }

        E.toast('ดาวน์โหลด ' + (result.filename || 'CSV') + ' สำเร็จ', 'success');
        if (result.file_id) {
          setTimeout(function () {
            E.serverCall('cleanupCSVFile', [result.file_id], function () {});
          }, 30000);
        }
      }, function () {
        if (E.setActionButtonState) E.setActionButtonState(buttonEl, false);
      });
    }

    function openPrint(type) {
      init();
      var preflightIssue = getPrintPreflightIssue_(type);
      if (preflightIssue) {
        E.toast(preflightIssue, 'error');
        return;
      }
      var url = SCRIPT_URL + '?page=print&type=' + type;
      var printContext = { type: type };
      var popupWindow = null;
      try {
        popupWindow = window.open('', '_blank');
      } catch (e) {
        popupWindow = null;
      }
      if (type === 'daily') {
        var dateEl = document.getElementById('rpt-daily-print-date');
        if (dateEl && dateEl.value) {
          url += '&date=' + dateEl.value;
          printContext.date = dateEl.value;
        }
        if (!printContext.date) {
          try {
            if (popupWindow && !popupWindow.closed) popupWindow.close();
          } catch (ignore) {}
          E.toast('กรุณาเลือกวันที่ที่จะพิมพ์รายงานวัน', 'error');
          return;
        }
      } else {
        var startEl = document.getElementById('rpt-start');
        var endEl = document.getElementById('rpt-end');
        if (startEl && startEl.value) {
          url += '&start=' + startEl.value;
          printContext.start_date = startEl.value;
        }
        if (endEl && endEl.value) {
          url += '&end=' + endEl.value;
          printContext.end_date = endEl.value;
        }
      }
      E.serverCall('createPrintSession', [printContext], function (result) {
        if (!result || !result.success || !result.token) {
          try {
            if (popupWindow && !popupWindow.closed) popupWindow.close();
          } catch (ignore) {}
          E.toast((result && result.message) || 'ไม่สามารถเปิดหน้าพิมพ์ได้', 'error');
          return;
        }
        try {
          localStorage.setItem('att_pending_print_launch', JSON.stringify({
            token: String(result.token || ''),
            type: String(type || ''),
            date: String(printContext.date || ''),
            start_date: String(printContext.start_date || ''),
            end_date: String(printContext.end_date || ''),
            created_at: Date.now()
          }));
        } catch (e) {}
        var finalUrl = url + '&print_token=' + encodeURIComponent(result.token);
        try {
          if (popupWindow && !popupWindow.closed) {
            popupWindow.location = finalUrl;
            return;
          }
        } catch (ignore) {}
        window.open(finalUrl, '_blank');
      });
    }

    function copySummarySnippet() {
      init();
      if (!S.summary || !hasSummaryMeasurementData(S.summary)) {
        E.toast('ยังไม่มีข้อมูลสรุปให้คัดลอก', 'error');
        return;
      }
      copyTextToClipboard_(buildSummarySnippet_(S.summary, S.summary.rows || []), function () {
        E.toast('คัดลอกข้อความสรุปแล้ว', 'success');
      }, function () {
        E.toast('คัดลอกข้อความไม่ได้ ลองอีกครั้ง', 'error');
      });
    }

    function copyTextToClipboard_(text, onSuccess, onError) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(onSuccess).catch(function () {
          fallbackCopyText_(text, onSuccess, onError);
        });
        return;
      }
      fallbackCopyText_(text, onSuccess, onError);
    }

    function fallbackCopyText_(text, onSuccess, onError) {
      try {
        var textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', 'readonly');
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        var copied = document.execCommand('copy');
        document.body.removeChild(textarea);
        if (copied) {
          onSuccess();
          return;
        }
      } catch (err) {}
      onError();
    }
    // Public API
    window.ReportsPage = {
      renderLoading: renderLoading,
      render: render,
      switchTab: switchTab,
      loadSummary: loadSummary,
      loadDailyGrid: loadDailyGrid,
      clearHolidayAttendance: clearHolidayAttendance,
      exportCSV: exportCSV,
      openPrint: openPrint,
      setSearch: setSearch,
      setQuickFilter: setQuickFilter,
      openSummaryFilter: openSummaryFilter,
      clearFilters: clearFilters,
      setDailySearch: setDailySearch,
      copySummarySnippet: copySummarySnippet
    };
  })();
</script>
