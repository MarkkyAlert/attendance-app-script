<script>
  /* ═══════════════════════════════════════════════════
     Dashboard Page — JsDashboard.html
     ═══════════════════════════════════════════════════ */

  (function () {
    'use strict';

    var lineChart = null;
    var doughnutChart = null;
    var chartJsLoadPromise = null;
    var dashboardRenderFrameId = 0;
    var CHART_JS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';
    /**
     * ★ SRI ของไฟล์ข้างบน — **ต้องเปลี่ยนคู่กับ `CHART_JS_URL` เสมอ**
     * นี่คือ dependency ภายนอกตัวเดียวของทั้งโปรเจกต์ และมันถูกโหลดเข้าหน้าที่แสดง
     * ข้อมูลนักเรียน ถ้า CDN ถูกแทรกโค้ด เบราว์เซอร์จะปฏิเสธไฟล์ที่ hash ไม่ตรง
     * แล้วตกไปที่ทางล้มเหลวเดิม (`script.onerror` → กราฟกลายเป็นการ์ดอธิบาย)
     * ซึ่ง**ปลอดภัยกว่ารันโค้ดที่ไม่รู้ว่าใครแก้**
     *
     * ค่านี้ยืนยัน 2 ทางเมื่อ 18 ส.ค. 2569: คำนวณจากไฟล์ที่ดาวน์โหลดจริง (200,807 ไบต์)
     * และตรงกับที่ cdnjs ประกาศผ่าน API ของตัวเอง
     * วิธีหาใหม่ถ้าอัปเวอร์ชัน:
     *   curl -fsSL <url> | openssl dgst -sha512 -binary | openssl base64 -A
     * ★ `crossOrigin = 'anonymous'` จำเป็นสำหรับ SRI ข้าม origin ถ้าไม่ใส่ เบราว์เซอร์
     *   จะบล็อกไฟล์ทิ้งทั้งที่ hash ถูก
     */
    var CHART_JS_SRI = 'sha512-CQBWl4fJHWbryGE+Pc7UAxWMUMNMWzWxF4SQo9CgkJIN1kx6djDQZjh3Y8SZ1d+6I+1zze6Z7kHXO7q3UyZAWw==';
    var S, E; // state, shared

    function init() {
      S = window.AppState;
      E = window.AppShared;
    }

    function renderDashboardIcon(kind) {
      if (kind === 'overview') return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 18.5V11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 18.5V6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M18 18.5V9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4 18.5h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
      if (kind === 'present') return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 12.2l2.3 2.3 4.7-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      if (kind === 'late') return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/><path d="M12 8.5v4l2.5 1.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      if (kind === 'absent') return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/><path d="M9.5 9.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
      if (kind === 'sick') return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="6" y="5" width="12" height="14" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M12 8.5v7M8.5 12h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
      if (kind === 'leave') return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 5.5h8a2 2 0 012 2v9a2 2 0 01-2 2H8a2 2 0 01-2-2v-9a2 2 0 012-2z" stroke="currentColor" stroke-width="1.8"/><path d="M9 9h6M9 12h6M9 15h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
      if (kind === 'unchecked') return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8" stroke-dasharray="2.5 2.5"/><path d="M12 9v3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="15.8" r=".9" fill="currentColor" stroke="none"/></svg>';
      return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/></svg>';
    }

    function renderLoading() {
      init();
      var panel = document.getElementById('page-dashboard');
      if (!panel) return;
      panel.innerHTML = '<div class="skeleton-page">' +
        '<div class="skeleton-hero">' +
        '<div class="skeleton-line" style="width:120px"></div>' +
        '<div class="skeleton-line skeleton-line-xl" style="width:48%"></div>' +
        '<div class="skeleton-line skeleton-line-lg" style="width:72%"></div>' +
        '<div class="empty-next-step" data-page-loading-note="true" hidden><div class="empty-next-step-title">กำลังโหลด</div><div class="empty-next-step-text">กำลังสรุปภาพรวมล่าสุดของห้องเรียน</div></div>' +
        '</div>' +
        '<div class="skeleton-grid">' +
        '<div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>' +
        '<div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>' +
        '</div>' +
        '<div class="skeleton-grid">' +
        '<div class="skeleton-card skeleton-card-wide"></div><div class="skeleton-card skeleton-card-wide"></div><div class="skeleton-card skeleton-card-wide"></div>' +
        '</div>' +
        '</div>';
    }

    function render(state) {
      init();
      var d = state.dashboard;
      var panel = document.getElementById('page-dashboard');
      if (!d) {
        panel.innerHTML = '<div class="empty-state">' +
          '<div class="empty-icon">' + renderDashboardIcon('overview') + '</div>' +
          '<div class="empty-title">ยังโหลดภาพรวมของห้องเรียนไม่สำเร็จ</div>' +
          '<div class="empty-desc">ระบบยังดึงสถานะเช็กชื่อ รายงาน และข้อมูลติดตามของห้องนี้ไม่สำเร็จในตอนนี้</div>' +
          '<div class="empty-next-step"><div class="empty-next-step-title">สิ่งที่ควรทำต่อ</div><div class="empty-next-step-text">ลองโหลดหน้าใหม่อีกครั้งก่อน ถ้ายังไม่ขึ้น ให้ไปตรวจภาคเรียนปัจจุบัน รายชื่อนักเรียน และปฏิทินวันเรียนในหน้าตั้งค่า</div></div>' +
          '<div class="students-empty-actions"><button class="btn btn-primary mt-3" onclick="window.AppShared.loadPage(\'dashboard\')">โหลดใหม่</button><button class="btn btn-ghost mt-3" onclick="window.AppShared.navigateTo(\'settings\')">ไปหน้าตั้งค่า</button></div></div>';
        return;
      }

      var panel = document.getElementById('page-dashboard');
      var html = '';
      var ts = d.today_summary || {};
      var cov = d.coverage || { today: {}, month: {}, active_students: 0 };
      var mom = d.mom_delta || { current_month_th: d.month_th || '', previous_month_th: '', metrics: [] };
      var wa = d.weekday_analysis || { insight: {}, rows: [] };
      var hof = d.hall_of_fame || { level: 'empty', items: [] };
      var wl = d.watchlist || { most_absent: [], most_late: [] };
      var att = d.attention_list || [];
      var summaryCards = Array.isArray(d.summary_cards) ? d.summary_cards : [];
      var calendarSummary = d.school_calendar_summary || { school_days: 0, holidays: 0, total_entries: 0 };
      var productName = 'ระบบเช็คชื่อนักเรียน';
      var schoolName = d.school_name || '';
      var brandContext = schoolName && schoolName !== 'ระบบเช็คชื่อ' && schoolName !== productName ? schoolName : '';
      var activeStudents = parseInt(cov.active_students || 0, 10) || 0;
      var setupGuide = getSetupGuide(d, ts, activeStudents, calendarSummary);
      var hasSetupGuide = setupGuide.some(function (item) { return !item.done; });
      var currentSetupIndex = getCurrentSetupStepIndex(setupGuide);
      var nextSetupStep = currentSetupIndex >= 0 ? setupGuide[currentSetupIndex] : null;
      var setupOnboarding = state.setupOnboarding || null;
      if (setupOnboarding) state.setupOnboarding = null;
      var todayChecked = getTodayMarkedCount(ts);
        var confirmedDaysCount = Number(cov.month.confirmed_days || 0);
        var hasMonthlyData = confirmedDaysCount > 0 || summaryCards.some(function (card) {
          return Number(card && card.count || 0) > 0;
        });
      var hasTrendData = hasTrendDatasetData(d.daily_trend);
      var hasDoughnutData = d.doughnut_chart && hasNonZeroArray(d.doughnut_chart.values);
      var hasWeekdayData = hasWeekdayRows(wa.rows);
      var heroPriority = getDashboardPriority(setupGuide, hasMonthlyData, todayChecked, ts, att);
      var sales = getDashboardSalesContext_(d, ts, cov, mom, wa, hof, wl, att, summaryCards, setupGuide, hasSetupGuide, hasMonthlyData, todayChecked);
      var readinessSummary = d.readiness_summary || state.readinessSummary || null;
      var readinessMeta = readinessSummary && readinessSummary.summary ? readinessSummary.summary : {};
      var readinessReady = !!readinessMeta.is_ready_for_uat;
      var dashboardLoadState = (state.pageDataStatus && state.pageDataStatus.dashboard) ? state.pageDataStatus.dashboard : {};
      var dashboardFullStatus = String(dashboardLoadState.full || 'idle');
      var dashboardFullError = String(dashboardLoadState.full_error || '');
      var bootstrapOnly = !!d.bootstrap_only && dashboardFullStatus !== 'ready';
      var heroChip = hasSetupGuide
        ? 'เริ่มต้นใช้งาน'
        : (!hasMonthlyData ? 'เริ่มบันทึกวันแรก' : (ts.unchecked > 0 ? 'เช็คชื่อกำลังดำเนินอยู่' : 'พร้อมใช้งาน'));
      var heroKicker = hasSetupGuide || !hasMonthlyData ? 'เริ่มจากขั้นถัดไป' : 'ภาพรวมห้องเรียน';
      var heroHeading = hasSetupGuide
        ? 'เตรียมห้องเรียนให้พร้อมใช้งาน'
        : (d.class_name ? ('ภาพรวม ' + d.class_name + ' วันนี้') : 'ภาพรวมห้องเรียนวันนี้');
      var heroLine = hasSetupGuide
        ? 'เริ่มจากงานที่ยังค้าง แล้วระบบจะพร้อมใช้จริงตั้งแต่เช็คชื่อไปจนถึงรายงาน'
        : !hasMonthlyData
          ? 'เริ่มเช็คชื่อวันแรก แล้วรายงานจะเริ่มมีข้อมูล'
        : ts.unchecked > 0
          ? 'วันนี้ยังเหลือ ' + (parseInt(ts.unchecked || 0, 10) || 0) + ' คน'
          : 'วันนี้เช็คชื่อครบแล้ว พร้อมดูสรุปต่อ';
      var heroStoryText = hasSetupGuide
        ? 'กดทำขั้นที่ยังค้างจากการ์ดด้านขวา แล้วค่อยกลับมาดูภาพรวมอีกครั้ง'
        : !hasMonthlyData
          ? 'เมื่อมีข้อมูลวันแรก ระบบจะอัปเดตภาพรวมเดือน กราฟ และรายชื่อที่ต้องติดตามให้อัตโนมัติ'
        : ts.unchecked > 0
          ? 'เช็คชื่อให้ครบ แล้วรายงานจะอัปเดตทันที'
          : 'เดือนนี้บันทึกข้อมูลแล้วเฉลี่ย ' + (parseInt(cov.month.avg_coverage_percent || 0, 10) || 0) + '%';
      var context = [];

      if (d.class_name) context.push('ชั้น ' + esc(d.class_name));
      if (d.teacher_name) context.push('ครู ' + esc(d.teacher_name));
      if (d.active_semester && d.active_semester.name) context.push('ภาคเรียน ' + esc(d.active_semester.name));

      html += '<div class="dashboard-shell">';
      if (!readinessReady) {
        html += renderDashboardReadinessBanner(readinessSummary);
      }

      // ─── Header ───────────────────────────
      html += '<section class="dashboard-hero">';
      html += '<div class="dashboard-hero-copy">';
      html += '<div class="dashboard-brand-lockup">';
      html += '<span class="dashboard-brand-chip">' + heroChip + '</span>';
      html += '<p class="dashboard-kicker">' + heroKicker + '</p>';
      html += '<h1 class="dashboard-brand">' + esc(heroHeading) + '</h1>';
      if (brandContext) {
        html += '<p class="dashboard-instance">' + esc(brandContext) + '</p>';
      }
      html += '</div>';
      html += '<p class="dashboard-subtitle">' + heroLine + '</p>';
      if (context.length > 0) {
        html += '<p class="dashboard-context">' + context.join(' · ') + '</p>';
      }
      html += '<div class="dashboard-story"><span class="dashboard-story-kicker">ภาพรวมวันนี้</span><span class="dashboard-story-text">' + esc(heroStoryText) + '</span></div>';

      html += '<div class="dashboard-actions">';
      if (hasSetupGuide) {
        html += '<button class="btn btn-primary" onclick="AppShared.navigateTo(\'' + esc(nextSetupStep && nextSetupStep.actionPage || 'settings') + '\')">' + esc(nextSetupStep && nextSetupStep.actionLabel || 'ทำขั้นถัดไป') + '</button>';
        if (nextSetupStep && nextSetupStep.secondaryLabel && nextSetupStep.secondaryPage) {
          html += '<button class="btn btn-ghost" onclick="AppShared.navigateTo(\'' + esc(nextSetupStep.secondaryPage) + '\')">' + esc(nextSetupStep.secondaryLabel) + '</button>';
        } else {
          html += '<button class="btn btn-ghost" onclick="AppShared.navigateTo(\'settings\')">ดูหน้าตั้งค่า</button>';
        }
      } else {
        html += '<button class="btn btn-primary" onclick="AppShared.navigateTo(\'attendance\')">' + (ts.unchecked > 0 ? 'ไปเช็คชื่อวันนี้' : 'ดูการเช็คชื่อวันนี้') + '</button>';
        html += '<button class="btn btn-ghost" onclick="AppShared.navigateTo(\'reports\')">ดูรายงานสรุป</button>';
      }
      html += '</div>';
      html += '<div class="dashboard-month-row">';
      html += '<span class="dashboard-month-label">ภาพรวมเดือน</span>';
      html += '<div class="date-nav dashboard-month-nav">';
      html += '<button class="date-btn" onclick="DashboardPage.shiftMonth(-1)">◀</button>';
      html += '<span class="dashboard-month-value">' + esc(d.month_th) + '</span>';
      html += '<button class="date-btn" onclick="DashboardPage.shiftMonth(1)">▶</button>';
      html += '</div>';
      html += '</div>';
      html += '</div>';
      html += '<div class="dashboard-hero-visual">';
      if (hasSetupGuide || !hasMonthlyData) {
        html += renderDashboardHeroPriority(heroPriority, cov, ts);
      } else {
        html += renderDashboardTodayHero_(cov, ts);
      }
      html += '</div>';
      html += '</section>';

      if (readinessReady) {
        html += renderDashboardReadinessCompact(readinessSummary);
      }

      if (d.out_of_semester) {
        html += '<section class="dashboard-section">';
        html += '<div class="alert alert-warning">';
        html += '<strong>เดือนนี้อยู่นอกภาคเรียนที่กำลังใช้งาน</strong> จึงยังสรุปภาพรวมหน้าแรกตามช่วงเดือนนี้ไม่ได้';
        html += '<div class="empty-next-step" style="margin-top:.75rem"><div class="empty-next-step-title">สิ่งที่ควรทำต่อ</div><div class="empty-next-step-text">กลับไปเลือกภาคเรียนที่ใช้อยู่จริง หรือสร้างภาคเรียนใหม่ก่อน แล้วข้อมูลหน้าแรกจะกลับมาแสดงตามช่วงวันที่ถูกต้อง</div></div>';
        html += '<div style="margin-top:.75rem"><button class="btn btn-primary btn-sm" onclick="AppShared.navigateTo(\'settings\')">ไปหน้าตั้งค่า</button></div>';
        html += '</div>';
        html += '</section>';
      }

      if (setupOnboarding) {
        html += renderSetupOnboardingBanner_(setupOnboarding, nextSetupStep, hasSetupGuide, activeStudents);
      }

      if (hasSetupGuide) {
        html += renderSetupGuide(setupGuide, currentSetupIndex);
      }

      if (bootstrapOnly) {
        html += renderDashboardDeferredState_(dashboardFullStatus, dashboardFullError, d.month_th || '');
        html += '</div>';
        panel.innerHTML = html;
        return;
      }

      // ─── Today Summary ────────────────────
      html += '<section id="dashboard-today-section" class="dashboard-section">';
      html += '<div class="dashboard-section-head">';
      html += '<div><h2 class="dashboard-section-title">สถานะวันนี้</h2><p class="dashboard-section-text">ดูการเช็คชื่อประจำวันและสิ่งที่ยังต้องทำต่อ</p></div>';
      html += '</div>';
      html += '<div class="dashboard-overview-grid">';
      html += '<div class="dashboard-panel">';
      html += '<div class="dashboard-stat-grid">';
      html += sc('present', ts.present, 'มาเรียน', 'green');
      html += sc('late', ts.late, 'สาย', 'amber');
      html += sc('absent', ts.absent, 'ขาด', 'red');
      html += sc('sick', ts.sick_leave, 'ลาป่วย', 'blue');
      html += sc('leave', ts.personal_leave, 'ลากิจ', 'indigo');
      html += sc('unchecked', ts.unchecked, 'ยังไม่เช็ค', 'stone');
      html += '</div>';
      if (ts.unchecked > 0) {
        html += '<div class="dashboard-panel-footer"><button class="btn btn-primary btn-sm" onclick="AppShared.navigateTo(\'attendance\')">เช็คชื่อที่ค้างอยู่</button></div>';
      }
      html += '</div>';

      // ─── Coverage ─────────────────────────
      html += '<div class="dashboard-side-stack">';
      html += '<div class="dashboard-metric-panel dashboard-metric-good">';
      html += '<p class="dashboard-metric-kicker">ความครอบคลุมวันนี้</p>';
      html += '<p class="dashboard-metric-value">' + esc(String(cov.today.percent || 0)) + '%</p>';
      html += '<div class="progress-wrap"><div class="progress-fill" style="width:' + clampPercent(cov.today.percent) + '%"></div></div>';
      html += '<p class="dashboard-metric-text">เช็คแล้ว ' + esc(String(cov.today.checked || 0)) + '/' + esc(String(cov.active_students || 0)) + ' คน</p>';
      html += '</div>';
      html += '<div class="dashboard-metric-panel">';
      html += '<p class="dashboard-metric-kicker">ค่าเฉลี่ยของเดือน</p>';
      html += '<p class="dashboard-metric-value">' + esc(String(cov.month.avg_coverage_percent || 0)) + '%</p>';
        html += '<p class="dashboard-metric-text">ยืนยันแล้ว ' + esc(String(cov.month.confirmed_days || 0)) + ' วัน · เฉลี่ย ' + esc(String(cov.month.avg_checked_per_day || 0)) + ' คน/วัน</p>';
      html += '</div>';
      html += '</div>';
      html += '</div>';
      html += '</section>';

      html += renderDashboardActionPlan(sales);

      // ─── Summary Cards (Monthly) ──────────
      html += '<section id="dashboard-month-section" class="dashboard-section">';
      html += '<div class="dashboard-section-head">';
      html += '<div><h2 class="dashboard-section-title">ภาพรวมเดือน ' + esc(d.month_th) + '</h2><p class="dashboard-section-text">สรุปจำนวนเหตุการณ์และการเปลี่ยนแปลงเมื่อเทียบกับเดือนก่อน</p></div>';
      html += '</div>';
      if (!hasMonthlyData) {
        html += '<div class="dashboard-zero-grid">';
        html += renderDashboardZeroPanel(
          'ภาพรวมเดือน',
          'ส่วนนี้จะเริ่มมีข้อมูลหลังจากเช็คชื่อวันแรก',
          'เมื่อบันทึกวันแรกแล้ว ระบบจะรวมยอดรายวัน เปรียบเทียบเดือน และอัปเดตให้เองอัตโนมัติ',
          'overview',
          'ไปเช็คชื่อวันนี้',
          'attendance'
        );
        html += renderDashboardZeroPanel(
          'เทียบกับเดือนก่อน',
          'เมื่อมีข้อมูลสะสมหลายวัน ระบบจะช่วยเล่าแนวโน้มให้ทันที',
          'ถ้ามีข้อมูลของเดือนนี้แล้ว การ์ดเปรียบเทียบจะช่วยเห็นว่าจุดไหนดีขึ้นหรือควรติดตามต่อ',
          'present',
          'ดูรายงานสรุป',
          'reports'
        );
        html += '</div>';
      } else {
        html += '<div class="dashboard-month-layout">';
        html += '<div class="dashboard-kpi-grid">';
        summaryCards.forEach(function (c) {
          html += buildSummaryCard(c);
        });
        html += '</div>';

        // ─── MoM Delta ────────────────────────
        html += '<div class="dashboard-mom-panel">';
        html += '<p class="dashboard-metric-kicker">เทียบ ' + esc(mom.current_month_th || '') + ' กับ ' + esc(mom.previous_month_th || '') + '</p>';
        html += '<div class="dashboard-mom-grid">';
        (mom.metrics || []).forEach(function (m) {
          html += buildMomMetric(m);

    function ensureChartJs_(onReady, onFailure) {
      if (typeof window.Chart !== 'undefined') {
        if (typeof onReady === 'function') onReady();
        return;
      }
      if (!chartJsLoadPromise) {
        chartJsLoadPromise = new Promise(function (resolve, reject) {
          var existing = document.querySelector('script[data-chartjs-dashboard="1"]');
          if (existing) {
            existing.addEventListener('load', function () { resolve(window.Chart); }, { once: true });
            existing.addEventListener('error', reject, { once: true });
            return;
          }
          var script = document.createElement('script');
          script.src = CHART_JS_URL;
          script.integrity = CHART_JS_SRI;
          script.crossOrigin = 'anonymous';
          script.async = true;
          script.dataset.chartjsDashboard = '1';
          script.onload = function () { resolve(window.Chart); };
          script.onerror = reject;
          document.head.appendChild(script);
        }).catch(function (error) {
          chartJsLoadPromise = null;
          throw error;
        });
      }
      chartJsLoadPromise.then(function () {
        if (typeof onReady === 'function') onReady();
      }).catch(function () {
        if (typeof onFailure === 'function') onFailure();
      });
    }

    function renderCharts(d) {

        ));

          'present',
          'ยังไม่สามารถโหลดกราฟสัดส่วนได้ตอนนี้',

        ));

          actionLabel: 'ดูรายงานสรุป',
          actionPage: 'reports',
          secondaryLabel: 'เปิดหน้าวิเคราะห์',
          secondaryPage: 'analytics'
        };
      }

      return {
        kicker: 'พร้อมดูผล',
        title: 'ภาพรวมห้องเริ่มพร้อมใช้งานแล้ว',
        text: 'ตอนนี้สามารถเปิดดูสรุปผลย้อนหลังหรือหน้าวิเคราะห์เพื่อเช็กภาพรวมของห้องเรียนได้ทันที',
        actionLabel: 'ดูรายงานสรุป',
        actionPage: 'reports',
        secondaryLabel: 'เปิดหน้าวิเคราะห์',
        secondaryPage: 'analytics'
      };
    }

    function getDashboardSalesContext_(d, ts, cov, mom, wa, hof, wl, att, summaryCards, setupGuide, hasSetupGuide, hasMonthlyData, todayChecked) {
      var remainingSetup = setupGuide.filter(function (item) { return !item.done; }).length;
      var nextSetupStep = setupGuide.filter(function (item) { return !item.done; })[0] || null;
      var absentCard = getSummaryCardByCode(summaryCards, 'absent');
      var lateCard = getSummaryCardByCode(summaryCards, 'late');
      var presentCard = getSummaryCardByCode(summaryCards, 'present');
      var topAttention = Array.isArray(att) && att.length ? att[0] : null;
      var topAbsent = wl && Array.isArray(wl.most_absent) && wl.most_absent.length ? wl.most_absent[0] : null;
      var topLate = wl && Array.isArray(wl.most_late) && wl.most_late.length ? wl.most_late[0] : null;
      var topChampion = hof && Array.isArray(hof.items) && hof.items.length ? hof.items[0] : null;
      var worstDay = wa && wa.insight && wa.insight.worst_absent_pct > 0 ? wa.insight : null;
      var primaryAction = { type: 'section', value: 'dashboard-month-section', label: 'ดูภาพรวมเดือนนี้' };

      if (hasSetupGuide && nextSetupStep) {
        primaryAction = { type: 'page', value: nextSetupStep.actionPage || 'settings', label: nextSetupStep.actionLabel || 'ทำขั้นถัดไป' };
      } else if (Number(ts.unchecked || 0) > 0 || !hasMonthlyData || todayChecked === 0) {
        primaryAction = { type: 'page', value: 'attendance', label: 'ไปเช็คชื่อวันนี้' };
      } else if (Array.isArray(att) && att.length > 0) {
        primaryAction = { type: 'section', value: 'dashboard-attention-section', label: 'ดูรายชื่อที่ขาด/สายบ่อย' };
      } else if (topAbsent || topLate) {
        primaryAction = { type: 'section', value: 'dashboard-insights-section', label: 'ดูรายชื่อที่ต้องจับตา' };
      }

      return {
        monthLabel: d.month_th || '',
        hasSetupGuide: hasSetupGuide,
        remainingSetup: remainingSetup,
        nextSetupStep: nextSetupStep,
        hasMonthlyData: hasMonthlyData,
        todayChecked: todayChecked,
        todayUnchecked: Number(ts.unchecked || 0),
        todayPercent: Number(cov && cov.today && cov.today.percent || 0),
        activeStudents: Number(cov && cov.active_students || 0),
        attentionCount: Array.isArray(att) ? att.length : 0,
        topAttention: topAttention,
        topAbsent: topAbsent,
        topLate: topLate,
        topChampion: topChampion,
        worstDay: worstDay,
        absentCard: absentCard,
        lateCard: lateCard,
        presentCard: presentCard,
        primaryAction: primaryAction
      };
    }

    function buildDashboardSummarySnippet_(sales) {
      var parts = [];
      if (sales.hasSetupGuide) {
        parts.push('ตอนนี้ระบบยังอยู่ในช่วงตั้งต้น');
        parts.push('เหลืออีก ' + String(sales.remainingSetup) + ' ขั้นก่อนเริ่มใช้งานได้ครบ');
        if (sales.nextSetupStep) parts.push('ขั้นถัดไปคือ ' + String(sales.nextSetupStep.title || 'ตั้งค่าระบบ'));
        return parts.join(' · ');
      }

      parts.push('วันนี้เช็คชื่อแล้ว ' + String(sales.todayChecked) + '/' + String(sales.activeStudents) + ' คน');
      if (sales.todayUnchecked > 0) {
        parts.push('เหลืออีก ' + String(sales.todayUnchecked) + ' คน');
      } else {
        parts.push('เช็คชื่อครบแล้ว');
      }
      if (sales.attentionCount > 0) {
        parts.push('มีนักเรียนที่ควรติดตาม ' + String(sales.attentionCount) + ' คน');
      } else if (sales.topChampion) {
        parts.push('มีกลุ่มมาเรียนดีเด่นที่พร้อมใช้เป็นแรงบวก');
      }
      if (sales.worstDay) {
        parts.push('วันขาดสูงสุดคือ ' + String(sales.worstDay.worst_absent_day || '-') + ' ที่ ' + String(sales.worstDay.worst_absent_pct || 0) + '%');
      } else if (sales.absentCard || sales.lateCard) {
        parts.push('เดือนนี้ขาด ' + String(sales.absentCard && sales.absentCard.count || 0) + ' ครั้ง และสาย ' + String(sales.lateCard && sales.lateCard.count || 0) + ' ครั้ง');
      }
      return parts.join(' · ');
    }

    function getDashboardSalesTitle_(sales) {
      if (sales.hasSetupGuide) return 'เริ่มต้นอีกไม่กี่ขั้น ห้องนี้ก็พร้อมใช้งานแล้ว';
      if (sales.todayUnchecked > 0) return 'วันนี้ยังมีงานค้าง และระบบบอกได้ทันทีว่าควรทำต่ออะไร';
      if (sales.attentionCount > 0) return 'วันนี้เช็คครบแล้ว และเห็นกลุ่มที่ควรติดตามต่อชัดเจน';
      if (sales.topChampion) return 'วันนี้เช็คครบแล้ว และมีทั้งภาพรวมกับแรงเสริมเชิงบวกพร้อมใช้';
      return 'ภาพรวมวันนี้พร้อมใช้ต่อ ทั้งติดตาม สรุป และส่งต่อ';
    }

          : (sales.todayUnchecked > 0

        text: sales.attentionCount > 0

          : ((sales.topAbsent || sales.topLate)

            : 'ยังไม่พบรายชื่อที่ขาดหรือสายสะสมเด่นมากเป็นพิเศษในตอนนี้'),
        buttonLabel: sales.attentionCount > 0 ? 'ดูรายชื่อที่ขาด/สายบ่อย' : 'ดูรายชื่อที่ต้องจับตา',

        buttonLabel: sales.topChampion ? 'ดูนักเรียนมาเรียนดีเด่น' : 'ดูภาพรวมเดือนนี้',

      });

    function buildDashboardShareMessage_(type, sales) {

      }
      var attendanceLine = 'วันนี้เช็คชื่อแล้ว ' + String(sales.todayChecked) + '/' + String(sales.activeStudents) + ' คน';
      var followLine = sales.todayUnchecked > 0
        ? 'ยังเหลืออีก ' + String(sales.todayUnchecked) + ' คนที่ยังไม่เช็คชื่อ'
        : (sales.attentionCount > 0
          ? 'มีนักเรียนที่ขาดหรือสายบ่อยช่วงนี้ ' + String(sales.attentionCount) + ' คน'

    /**
     * ตัวเลขใหญ่บนหน้าแรก เปลี่ยนตามคำถามที่ครูกำลังถามอยู่จริงในจังหวะนั้น
     *
     * ยังเช็คไม่ครบ  → ความคืบหน้า (วงแหวน) เพราะคำถามคือ "เหลืออีกกี่คน"
     * เช็คครบแล้ว    → จำนวนที่ขาด เพราะคำถามเปลี่ยนเป็น "วันนี้ใครไม่มา ต้องโทรหาใคร"
     *
     * เดิมโชว์ "100% เช็คชื่อแล้ววันนี้" ค้างไว้ทั้งวันหลังเช็คเสร็จ ซึ่งบอกแค่ว่า
     * ครูทำงานเสร็จแล้ว ไม่ได้บอกอะไรเกี่ยวกับห้องเรียนอีกเลย
     *
     * นับเฉพาะ "ขาด" เป็นตัวเลขใหญ่ ไม่รวมลาป่วย/ลากิจ เพราะขาดคือสิ่งเดียวที่ต้องลงมือทำต่อวันนี้
     * ส่วนคนที่ลา ครูรู้อยู่แล้ว จึงยกไปไว้บรรทัดรองแทนเพื่อไม่ให้ตกหล่น
     */
    function renderDashboardTodayHero_(cov, ts) {
      var dateLabel = esc(ts.date_th || cov.today.date_th || '');
      var unchecked = Number(ts.unchecked || 0);
      var html = '';

      if (unchecked > 0) {
        html += '<div class="dashboard-ring" style="background:conic-gradient(var(--green-500) ' + clampPercent(cov.today.percent) + '%, rgba(255,255,255,.22) 0)">';
        html += '<div class="dashboard-ring-core">';
        html += '<div class="dashboard-ring-value">' + esc(String(cov.today.percent || 0)) + '%</div>';
        html += '<div class="dashboard-ring-label">เช็คชื่อแล้ววันนี้</div>';
        html += '<div class="dashboard-ring-meta">' + esc(String(cov.today.checked || 0)) + '/' + esc(String(cov.active_students || 0)) + ' คน</div>';
        html += '</div>';
        html += '</div>';
        html += '<p class="dashboard-hero-note">' + dateLabel + ' · เหลือ ' + esc(String(unchecked)) + ' คน</p>';
        return html;
      }

      var absent = Number(ts.absent || 0);
      var late = Number(ts.late || 0);
      var sick = Number(ts.sick_leave || 0);
      var personal = Number(ts.personal_leave || 0);

      html += '<div class="dashboard-today-hero' + (absent > 0 ? ' dashboard-today-hero-alert' : '') + '">';
      if (absent > 0) {
        html += '<div class="dashboard-today-hero-value">' + esc(String(absent)) + '</div>';
        html += '<div class="dashboard-today-hero-label">คนขาดวันนี้</div>';
      } else {
        html += '<div class="dashboard-today-hero-value">' + esc(String(cov.today.checked || 0)) + '</div>';
        html += '<div class="dashboard-today-hero-label">มาครบทุกคน</div>';
      }

      // บรรทัดรอง แสดงเฉพาะประเภทที่มีจริง จะได้ไม่รกด้วยเลข 0
      var extras = [];
      if (late > 0) extras.push('สาย ' + late);
      if (sick > 0) extras.push('ลาป่วย ' + sick);

    // และต้อง escape " กับ ' ด้วย เพราะทุกที่ในโปรเจกต์ยัดค่าลง attribute ด้วย string concat
    function esc(str) {
    if (str === null || str === undefined) return '';

    div.textContent = String(str);

    function copyTextToClipboard_(text, onSuccess, onError) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(onSuccess).catch(function () {
          fallbackCopyText_(text, onSuccess, onError);
        });
        return;
      }
      fallbackCopyText_(text, onSuccess, onError);
    }

    function fallbackCopyText_(text, onSuccess, onError) {
      try {
        var textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', 'readonly');
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        var copied = document.execCommand('copy');
        document.body.removeChild(textarea);
        if (copied) {
          onSuccess();
          return;
        }
      } catch (err) {}
      onError();
    }

    // ─── Count-up animation for metric values ──────
  function animateCountUps() {
    var elements = document.querySelectorAll('.dashboard-metric-value, .attendance-summary-count, .attendance-progress-value');
    elements.forEach(function(el) {
      var text = el.textContent.trim();
      var match = text.match(/^(\d+)/);
      if (!match) return;
      var target = parseInt(match[1], 10);
      if (target <= 0 || target > 9999) return;
      var suffix = text.replace(/^\d+/, '');
      var duration = Math.min(600, target * 15 + 200);
      var start = performance.now();
      el.textContent = '0' + suffix;
      function step(now) {
        var elapsed = now - start;
        var progress = Math.min(elapsed / duration, 1);
        var eased = 1 - Math.pow(1 - progress, 3);
        el.textContent = Math.round(target * eased) + suffix;
        if (progress < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }

    // Public API
    window.DashboardPage = {
      renderLoading: renderLoading,
      render: render,
      shiftMonth: shiftMonth,
      scrollToSection: scrollToSection,
      copySummarySnippet: copySummarySnippet,
      copyShareText: copyShareText
    };
  })();
</script>
