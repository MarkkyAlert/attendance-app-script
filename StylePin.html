<style>
/* ═══════════════════════════════════════════════════
   PIN Styles — Global
   ═══════════════════════════════════════════════════ */

.pin-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: linear-gradient(135deg, #3d322b, #5b4a3f);
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn .2s;
}
.pin-box {
  text-align: center; padding: 2rem; width: 100%; max-width: 320px;
}
.pin-logo {
  width: 4rem; height: 4rem; margin: 0 auto 1rem;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,.1); border-radius: 1.25rem;
  font-size: 2rem; backdrop-filter: blur(8px);
}
.pin-logo .inline-ui-icon svg {
  width: 2rem;
  height: 2rem;
  color: #fff;
}
.pin-title { color: #fff; font-size: 1.25rem; font-weight: 700; margin-bottom: .25rem; }
.pin-subtitle {

  font-size: .84rem;
  font-weight: 400;
  line-height: 1.55;
  margin-bottom: 1.5rem;
}
.pin-dots {
  display: flex; gap: .75rem; justify-content: center; margin-bottom: 1.5rem;
}
.pin-dot {

  border: 2px solid rgba(255,255,255,.4); transition: all .15s;
}
.pin-dot.filled { background: #fff; border-color: #fff; }
.pin-dot.error { border-color: #ef4444; background: #ef4444; }

  max-width: 240px; margin: 0 auto;
}

.pin-key-special .inline-ui-icon svg {
  width: 1rem;
  height: 1rem;
}
.pin-error {
  color: #fca5a5; font-size: .8rem; font-weight: 500;
  min-height: 1.5rem; margin-top: .75rem;
}

}
