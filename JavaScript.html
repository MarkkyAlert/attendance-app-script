<script>
  /* ระบบเช็คชื่อนักเรียน — Client-side JavaScript */

  (function () {
    'use strict';

    // State

    var state = {
      page: INITIAL_PAGE || 'dashboard',
      pageDataStatus: buildDefaultPageDataStatus_(),
      attendance: null,
      students: null,
      settings: null,
      schoolCalendar: null,
      readinessSummary: null,
      dashboard: null,
      reportBootstrap: null,
      setupOnboarding: null,
      currentUser: null,
      auth: null,
      studentPhotos: null,
      dashboardMonth: '',
      analyticsMonth: '',
      summary: null,
      reportTab: 'summary',
      reportMonth: '',
      reportSearchQuery: '',
      reportQuickFilter: 'all',
      reportDailySearchQuery: '',
      dailyGrid: null,
      dailyGridFrom: '',
      dailyGridTo: '',
      currentDate: '',
      filterGroup: '',   // ค่าพิเศษ NO_GROUP_FILTER_ = เลือกเฉพาะคนที่ยังไม่ระบุกลุ่ม
      filterUnchecked: false,
      searchQuery: '',
      studentsSearchQuery: '',
      studentsFilterGroup: '',
      studentsFilterFlagged: false,
      loading: false,
      pinInitialized: false,
      viewMode: 'list',
      showAdvancedSettings: false,
      showInitialSetupWizard: false,
      pendingReadinessAction: null
    };
    var AUTH_STORAGE_KEY = 'att_teacher_auth';
    var TEACHER_DEVICE_STORAGE_KEY = 'att_teacher_device_id';
    var BACKUP_META_STORAGE_KEY = 'att_last_backup_meta';
    var SETUP_ONBOARDING_STORAGE_KEY = 'att_setup_onboarding';
    // ★ มีแค่ `global` เพราะเป็นฟิลด์เดียวที่โค้ดอ่านจริง
    // เดิมมี `page` อยู่ 4 ตัวแต่**ไม่มีใครอ่านเลย** ตัวที่ตัดสินว่าหน้าไหนใช้โมดูลไหน
    // คือ `PAGE_MODULE_MAP` ข้างล่าง · หลักฐานว่ามันตายแล้วคือ `profile` กับ `photoGrid`
    // ไม่เคยมี `page` แต่ทำงานได้ปกติมาตลอด — เป็นเอกสารที่ปลอมตัวเป็นโค้ด แก้แล้วไม่มีผล
    var CLIENT_MODULE_REGISTRY = {
      dashboard: { global: 'DashboardPage' },
      reports: { global: 'ReportsPage' },
      analytics: { global: 'AnalyticsPage' },
      import: { global: 'ImportPage' },
      profile: { global: 'ProfilePage' },
      photoGrid: { global: 'PhotoGrid' }
    };
    var PAGE_MODULE_MAP = {
      dashboard: 'dashboard',
      reports: 'reports',
      analytics: 'analytics',
      import: 'import'
    };
    var clientModulePromises = {};
    var teacherAuth = null;
    var teacherLoginOptions = null;
    var teacherLoginDraft = '';

    var VALID_PAGES = {
      dashboard: true,
      attendance: true,
      reports: true,
      analytics: true,
      students: true,
      import: true,
      settings: true
    };
    var PAGE_IDENTITY_LABELS = {
      dashboard: 'หน้าหลัก',
      attendance: 'เช็คชื่อวันนี้',
      reports: 'รายงานประจำชั้น',
      analytics: 'ติดตามนักเรียน',
      students: 'รายชื่อนักเรียน',
      import: 'นำเข้ารายชื่อ',
      settings: 'ตั้งค่าระบบ',
      not_found: 'ลิงก์ไม่ถูกต้อง'
    };
    var defaultPageLoadingHtml = '';
    var pageLoadTimeoutId = 0;
    var activeOverlayState = null;
    var activePageLoadId = 0;
    var activePageLoadPage = '';
    var attendanceSearchDebounceId = 0;
    var studentsSearchDebounceId = 0;
    var ATTENDANCE_SEARCH_DEBOUNCE_MS = 120;
    var STUDENTS_SEARCH_DEBOUNCE_MS = 120;
    // ยาวกว่าช่องค้นหาเพราะช่องวันที่ต้องพิมพ์หลายช่อง (วัน/เดือน/ปี) กว่าจะครบ
    var ATTENDANCE_DATE_TYPING_DEBOUNCE_MS = 800;

    // ★ เผื่อนาฬิกาเครื่องครูไม่ตรงกับ server — ดู isStoredTeacherAuthExpired_
    var TEACHER_AUTH_CLOCK_SKEW_MS = 60 * 1000;

    /**
     * session ที่เก็บไว้หมดอายุแล้วหรือยัง
     *
     * ★ เดิมเก็บ `expires_at` ไว้แต่**ไม่มีใครเทียบเลย** ผลคือเปิดหน้าใหม่หลังทิ้งไว้นาน
     * ครูเห็น **จอกำลังโหลดค้างหลายวินาที แล้วค่อยเด้งไปหน้าเข้าสู่ระบบ**
     * เพราะต้องยิง request ให้ server ตอบ `AUTH_EXPIRED` กลับมาก่อนถึงจะรู้
     * (`ParentView.html` เช็คตั้งแต่ตอนอ่านกลับอยู่แล้ว — ยกวิธีเดียวกันมาใช้)
     *
     * ⚠️ **ไม่มี `expires_at` ให้ถือว่ายังไม่หมดอายุ** ไม่ใช่หมดอายุ
     * เพราะ session ที่เก็บไว้ก่อนหน้านี้ไม่มีฟิลด์นี้ ถ้าตีเป็นหมดอายุ
     * ครูทุกคนจะถูกเตะออกหนึ่งครั้งตอนอัปเดตโค้ดโดยไม่มีเหตุผล
     *
     * ⚠️ เทียบกับ `Date.now()` ของเครื่องครูซึ่งอาจเพี้ยน จึงเผื่อ skew ไว้
     * และ**ใช้เฉพาะตอนอ่านกลับ ไม่เอาไปตัดสินทุก request** — ถ้านาฬิกาเพี้ยนมาก
     * อาการที่แย่ที่สุดคือต้องล็อกอินใหม่หนึ่งครั้ง (การล็อกอินเขียน `expires_at` ชุดใหม่ทับ)
     * ไม่ใช่ใช้งานไม่ได้ · ส่วนกรณีหมดอายุระหว่างใช้งาน `handleTeacherSessionExpired_`
     * รับไว้อยู่แล้วจาก `AUTH_EXPIRED` ของ server ซึ่งเชื่อถือได้กว่านาฬิกาเครื่อง
     */
    function isStoredTeacherAuthExpired_(auth) {
      var expiresAt = parseInt(auth && auth.expires_at, 10) || 0;
      if (!expiresAt) return false;
      return (expiresAt + TEACHER_AUTH_CLOCK_SKEW_MS) <= Date.now();
    }

    function loadStoredTeacherAuth_() {
      var raw = '';
      try {
        raw = sessionStorage.getItem(AUTH_STORAGE_KEY) || '';
      } catch (e) {
        raw = '';
      }
      if (!raw) return null;
      try {
        return JSON.parse(raw);
      } catch (e) {
        try { sessionStorage.removeItem(AUTH_STORAGE_KEY); } catch (ignore) {}
        return null;
      }
    }

    function generateClientDeviceId_() {
      var alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-';
      var bytes = [];
      if (window.crypto && window.crypto.getRandomValues) {
        bytes = new Uint8Array(24);
        window.crypto.getRandomValues(bytes);
      } else {
        for (var i = 0; i < 24; i++) bytes.push(Math.floor(Math.random() * 256));
      }
      var token = '';
      for (var j = 0; j < bytes.length; j++) {
        token += alphabet.charAt(bytes[j] % alphabet.length);
      }
      return token;
    }

    function getTeacherDeviceId_() {
      var deviceId = '';
      try {
        deviceId = localStorage.getItem(TEACHER_DEVICE_STORAGE_KEY) || '';
      } catch (e) {
        deviceId = '';
      }
      if (!/^[A-Za-z0-9_-]{24,128}$/.test(String(deviceId || '').trim())) {
        deviceId = generateClientDeviceId_();
        try { localStorage.setItem(TEACHER_DEVICE_STORAGE_KEY, deviceId); } catch (ignore) {}
      }
      return String(deviceId || '');
    }

    function readBackupMeta_() {
      var raw = '';
      try {
        raw = localStorage.getItem(BACKUP_META_STORAGE_KEY) || '';
      } catch (e) {
        raw = '';
      }
      if (!raw) return null;
      try {
        var meta = JSON.parse(raw);
        if (!meta || !meta.created_at) return null;
        return {
          filename: String(meta.filename || ''),
          created_at: parseInt(meta.created_at, 10) || 0
        };
      } catch (e) {
        return null;
      }
    }

    function writeBackupMeta_(filename) {
      var meta = {
        filename: String(filename || 'ไฟล์สำรอง'),
        created_at: Date.now()
      };
      try {
        localStorage.setItem(BACKUP_META_STORAGE_KEY, JSON.stringify(meta));
      } catch (e) {}
      return meta;
    }

    function rememberSetupOnboarding_(meta) {
      if (!meta || typeof meta !== 'object') return null;
      var payload = {
        completed_at: String(meta.completed_at || todayStr()),
        school_name: normalizeTextInput(meta.school_name || ''),
        class_name: normalizeTextInput(meta.class_name || ''),
        teacher_name: normalizeTextInput(meta.teacher_name || '')
      };
      try {
        localStorage.setItem(SETUP_ONBOARDING_STORAGE_KEY, JSON.stringify(payload));
      } catch (e) {}
      return payload;
    }

    function consumeSetupOnboarding_() {
      var raw = '';
      try {
        raw = localStorage.getItem(SETUP_ONBOARDING_STORAGE_KEY) || '';
      } catch (e) {
        raw = '';
      }
      if (!raw) return null;
      try {
        return JSON.parse(raw);
      } catch (e2) {
        return null;
      } finally {
        try { localStorage.removeItem(SETUP_ONBOARDING_STORAGE_KEY); } catch (ignore) {}
      }
    }

    function formatBackupMetaLabel_(meta) {
      if (!meta || !meta.created_at) return 'ยังไม่พบการสำรองบนอุปกรณ์นี้';
      try {
        return new Intl.DateTimeFormat('th-TH', {
          dateStyle: 'medium',
          timeStyle: 'short'
        }).format(new Date(meta.created_at));
      } catch (e) {
        return String(meta.created_at || '');
      }
    }

    function persistTeacherAuth_(auth) {
      if (!auth || !auth.session_token) {
        clearTeacherAuth_();
        return null;
      }
      teacherAuth = {
        session_token: String(auth.session_token || ''),
        csrf_token: String(auth.csrf_token || ''),
        expires_at: parseInt(auth.expires_at, 10) || 0,
        teacher_device_id: String(auth.teacher_device_id || getTeacherDeviceId_())
      };
      state.auth = teacherAuth;
      try {
        sessionStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(teacherAuth));
      } catch (e) {}
      return teacherAuth;
    }

    function clearTeacherAuth_() {
      teacherAuth = null;
      state.auth = null;
      state.pinInitialized = false;
      teacherLoginDraft = '';
      try { sessionStorage.removeItem(AUTH_STORAGE_KEY); } catch (e) {}
      try { sessionStorage.removeItem('att_pin_locked'); } catch (e) {}
      var pinOverlay = document.getElementById('pin-overlay');
      if (pinOverlay) pinOverlay.style.display = 'none';
      updateNavBrandContext('');
    }

    function refreshTeacherAuth_(auth) {
      if (auth && auth.session_token) {
        persistTeacherAuth_(auth);
      }
    }

    function getTeacherAuth() {
      return teacherAuth ? {
        session_token: String(teacherAuth.session_token || ''),
        csrf_token: String(teacherAuth.csrf_token || ''),
        expires_at: parseInt(teacherAuth.expires_at, 10) || 0,
        teacher_device_id: String(teacherAuth.teacher_device_id || getTeacherDeviceId_())
      } : null;
    }

    function isTeacherAuthenticated_() {
      return !!(teacherAuth && teacherAuth.session_token);
    }

    function removeSensitiveQueryParams_() {
      if (!window.history || !window.history.replaceState || !window.URLSearchParams) return;
      var params = new URLSearchParams(window.location.search || '');
      var changed = false;
      ['key', 'session'].forEach(function (key) {
        if (params.has(key)) {
          params.delete(key);
          changed = true;
        }
      });
      if (!changed) return;
      var next = window.location.pathname + (params.toString() ? ('?' + params.toString()) : '');
      window.history.replaceState({}, document.title, next);
    }

    function readRequestedPageFromUrl_() {
      if (!window.URLSearchParams) return isValidPage(INITIAL_PAGE) ? INITIAL_PAGE : 'dashboard';
      var params = new URLSearchParams(window.location.search || '');
      var requested = params.get('page') || INITIAL_PAGE || 'dashboard';
      return isValidPage(requested) ? requested : 'dashboard';
    }

    function getPageDocumentTitle_(page) {
      var label = getNavPageIdentity(page);
      return (label && label !== 'หน้าหลัก' ? (label + ' | ระบบเช็คชื่อนักเรียน') : 'ระบบเช็คชื่อนักเรียน');
    }

    function syncPageUrl_(page, replaceHistory) {
      if (!window.history || !window.URLSearchParams) return;
      var params = new URLSearchParams(window.location.search || '');
      ['key', 'session'].forEach(function (key) { params.delete(key); });
      if (page && page !== 'dashboard') {
        params.set('page', page);
      } else {
        params.delete('page');
      }
      var next = window.location.pathname + (params.toString() ? ('?' + params.toString()) : '');
      var title = getPageDocumentTitle_(page);
      if (replaceHistory) {
        window.history.replaceState({ page: page }, title, next);
      } else {
        window.history.pushState({ page: page }, title, next);
      }
      document.title = title;
    }

    function showTeacherLoginBusy_(message) {
      updateNavBrandContext('');
      renderPageState(
        renderUiIcon('shield'),
        'กำลังยืนยันสิทธิ์',
        message || 'กรุณารอสักครู่'
      );
    }

    function loadTeacherLoginOptions_(callback) {
      if (teacherLoginOptions) {
        callback(teacherLoginOptions);
        return;
      }

      google.script.run
        .withSuccessHandler(function (result) {
          teacherLoginOptions = result || {};
          callback(teacherLoginOptions);
        })
        .withFailureHandler(function () {
          teacherLoginOptions = {
            key_login_enabled: true,
            teacher_key_configured: false
          };
          callback(teacherLoginOptions);
        })
        .getTeacherLoginOptions();
    }

    function renderTeacherLoginState(message) {
      clearPageLoadTimeout_();
      updateNavBrandContext('');
      var options = teacherLoginOptions || {};
      var currentInput = document.getElementById('teacher-login-key');
      if (currentInput) teacherLoginDraft = normalizeTextInput(currentInput.value);
      var inlineMessage = String(message || '').trim();
      var isDeviceBindingConflict = false;
      var isConfigured = !!options.teacher_key_configured;
      var actionsHtml = '<div style="display:grid;gap:.75rem;min-width:min(100%,360px)">';
      if (!isConfigured) {
        var setupDefaults = getInitialSetupWizardDefaults_();
        actionsHtml += '<div class="settings-note settings-note-warning"><span>ระบบนี้ยังไม่พร้อมให้ครูเข้าใช้งาน เพราะยังไม่ได้ตั้งค่ารหัสครูครั้งแรก</span></div>';
        actionsHtml += '<div class="card" style="padding:1rem;text-align:left;border:1px solid var(--amber-100);background:var(--amber-50);box-shadow:none">';
        actionsHtml += '<div style="font-weight:700;color:var(--amber-900);margin-bottom:.4rem">เริ่มตั้งค่าระบบครั้งแรกได้จากหน้านี้</div>';
        actionsHtml += '<div style="font-size:.88rem;line-height:1.65;color:var(--amber-900)">ใช้บัญชี Google ของครูที่ต้องการเป็นเจ้าของระบบในเครื่องนี้ แล้วกดเริ่มตั้งค่าระบบครั้งแรกเพื่อกำหนดชื่อโรงเรียน ชื่อชั้น ภาคเรียนแรก และรหัสครู</div>';
        actionsHtml += '</div>';
        actionsHtml += '<div class="card" style="padding:1rem;text-align:left;border:1px solid var(--stone-200);background:#fff;box-shadow:none">';
        actionsHtml += '<div style="font-weight:700;color:var(--stone-800);margin-bottom:.4rem">ถ้ายังไม่พร้อมตั้งค่าทันที</div>';
        actionsHtml += '<div style="font-size:.88rem;line-height:1.65;color:var(--stone-600)">คุณยังสามารถใช้เมนูใน Google Sheets เพื่อติดตั้งระบบครั้งแรกได้เช่นเดิม แต่ไม่จำเป็นต้องกลับไปตั้งค่าที่ชีตแล้ว</div>';
        actionsHtml += '</div>';
        actionsHtml += '<button class="btn btn-primary" type="button" onclick="App.showInitialSetupWizard()">' + (state.showInitialSetupWizard ? 'ซ่อนฟอร์มตั้งค่า' : 'เริ่มตั้งค่าระบบครั้งแรก') + '</button>';
        if (state.showInitialSetupWizard) {
          actionsHtml += '<div class="card" style="padding:1rem;text-align:left;border:1px solid var(--brown-200);background:#fff;box-shadow:none">';
          actionsHtml += '<div style="font-weight:700;color:var(--stone-900);margin-bottom:.35rem">แบบฟอร์มตั้งค่าครั้งแรก</div>';
          actionsHtml += '<div style="font-size:.84rem;line-height:1.6;color:var(--stone-600);margin-bottom:.9rem">กรอกข้อมูลพื้นฐานของห้องเรียนครั้งแรก แล้วระบบจะเข้าสู่ระบบให้ทันทีบนเครื่องนี้</div>';
          actionsHtml += '<div class="input-group" style="text-align:left;margin:0 0 .7rem 0"><label class="input-label">ชื่อครู *</label><input class="input" id="setup-wizard-teacher" autocomplete="name" placeholder="เช่น ครูสมหญิง ใจดี"></div>';
          actionsHtml += '<div class="input-group" style="text-align:left;margin:0 0 .7rem 0"><label class="input-label">ชื่อโรงเรียน *</label><input class="input" id="setup-wizard-school" autocomplete="organization" placeholder="เช่น โรงเรียนตัวอย่าง"></div>';
          actionsHtml += '<div class="input-group" style="text-align:left;margin:0 0 .7rem 0"><label class="input-label">ชั้นเรียน *</label><input class="input" id="setup-wizard-class" autocomplete="off" placeholder="เช่น ป.3/1"></div>';
          actionsHtml += '<div class="input-group" style="text-align:left;margin:0 0 .7rem 0"><label class="input-label">ชื่อภาคเรียนแรก *</label><input class="input" id="setup-wizard-semester-name" autocomplete="off" value="' + escAttr(setupDefaults.semesterName) + '" placeholder="เช่น 1/2569"></div>';
          actionsHtml += '<div class="input-group" style="text-align:left;margin:0 0 .7rem 0"><label class="input-label">วันเริ่มภาคเรียน *</label><input class="input" id="setup-wizard-semester-start" type="date" value="' + escAttr(setupDefaults.semesterStart) + '"></div>';
          actionsHtml += '<div class="input-group" style="text-align:left;margin:0 0 .7rem 0"><label class="input-label">วันสิ้นสุดภาคเรียน *</label><input class="input" id="setup-wizard-semester-end" type="date" value="' + escAttr(setupDefaults.semesterEnd) + '"></div>';
          actionsHtml += '<div class="input-group" style="text-align:left;margin:0 0 .75rem 0"><label class="input-label">รหัสครูครั้งแรก *</label><input class="input" id="setup-wizard-teacher-key" type="password" autocomplete="new-password" placeholder="อย่างน้อย 12 ตัวอักษร และมีตัวอักษรกับตัวเลข"></div>';
          actionsHtml += '<div class="settings-note settings-note-stone" style="margin-bottom:.85rem"><span>เมื่อบันทึกแล้ว ระบบจะอนุญาตให้เครื่องนี้ใช้งานได้ทันที และครูยังสามารถเข้าสู่ระบบจากอุปกรณ์อื่นด้วยรหัสเดียวกันได้</span></div>';
          actionsHtml += '<div style="display:flex;gap:.6rem;flex-wrap:wrap"><button class="btn btn-primary" type="button" onclick="App.submitInitialSetupWizard(this)">เริ่มใช้งาน</button><button class="btn btn-ghost" type="button" onclick="App.hideInitialSetupWizard()">ยกเลิก</button></div>';
          actionsHtml += '</div>';
        }
        actionsHtml += '<button class="btn btn-ghost" type="button" onclick="location.reload()">โหลดใหม่หลังติดตั้งเสร็จ</button>';
      } else {
        if (inlineMessage) {
          actionsHtml += '<div class="settings-note settings-note-warning"><span>' + esc(inlineMessage) + '</span></div>';
        }
        actionsHtml +=
          '<div class="card" style="padding:.75rem 1rem;text-align:left;border:1px solid var(--brown-200);background:var(--brown-50);box-shadow:none;margin-bottom:.25rem">' +
          '<div style="font-size:.82rem;line-height:1.55;color:var(--brown-900)">ใช้รหัสครูของห้องนี้เพื่อเข้าสู่หน้าเช็กชื่อได้จากทั้งมือถือและคอมพิวเตอร์ ถ้าลืมรหัส ให้เปิด Google Sheets ต้นทางแล้วใช้เมนู <strong>🔑 รีเซ็ตรหัสครู</strong> และถ้าต้องการให้อุปกรณ์ทุกเครื่องออกจากระบบพร้อมกัน ให้ใช้เมนู <strong>📱 รีเซ็ตอุปกรณ์ครูทั้งหมด</strong></div>' +
          '</div>' +
          '<div class="input-group" style="text-align:left;margin:0">' +
          '<label class="input-label" for="teacher-login-key">รหัสเข้าใช้งานครู</label>' +
          '<input class="input" id="teacher-login-key" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" placeholder="กรอกรหัสเข้าใช้งาน" value="' + escAttr(teacherLoginDraft) + '" oninput="App.handleTeacherLoginInput(this.value)" onkeydown="App.handleTeacherLoginKeydown(event)">' +
          '</div>' +
          '<button class="btn btn-primary" type="button" onclick="App.submitTeacherLogin(this)">เข้าสู่ระบบ</button>';
      }
      actionsHtml += '</div>';

      var description = isConfigured
        ? 'กรอกรหัสครูเพื่อเข้าสู่หน้าเช็กชื่อและรายงานของห้องนี้'
        : 'ระบบนี้ต้องมีผู้ติดตั้งเตรียมรหัสครูก่อน ครูผู้ใช้จึงจะเข้าใช้งานได้';

        renderPageState(
          renderUiIcon('shield'),
          isConfigured ? 'เข้าสู่ระบบก่อนใช้งาน' : 'เตรียมระบบครั้งแรกก่อนใช้งาน',
          description,
          actionsHtml
        );

        setTimeout(function () {
          if (!isConfigured && state.showInitialSetupWizard) {
            var setupInput = document.getElementById('setup-wizard-teacher');
            if (setupInput) {
              setupInput.focus();
              return;
            }
          }
          var input = document.getElementById('teacher-login-key');
          if (input) input.focus();

    function getInitialSetupWizardDefaults_() {
      var nowParts = getBangkokDateParts(new Date());
      var ceYear = parseInt(nowParts.year, 10) || new Date().getFullYear();
      return {
        semesterStart: String(ceYear) + '-05-01',
        semesterEnd: String(ceYear) + '-10-31',
        semesterName: '1/' + String(ceYear + 543)
      };
    }

    function handleTeacherAuthSuccess_(result, options) {
      options = options || {};
      if (!result || !result.success || !result.auth) {
        renderTeacherLoginState((result && result.message) || 'ไม่สามารถเข้าสู่ระบบได้');
        return;
      }

      teacherLoginDraft = '';
      persistTeacherAuth_(result.auth);
      state.currentUser = result.user || null;
      removeSensitiveQueryParams_();
      if (options.setup_complete) {
        rememberSetupOnboarding_({
          completed_at: todayStr(),
          school_name: result.user && result.user.schoolName,
          class_name: result.user && result.user.className,
          teacher_name: result.user && result.user.teacherName
        });
      }

      if (options.success_message) {
        toast(options.success_message, 'success');
      }
      navigateTo(isValidPage(options.target_page) ? options.target_page : state.page, { replaceHistory: true });
    }

    function initializeTeacherAuth_() {
      teacherAuth = loadStoredTeacherAuth_();

      // ★ รู้ว่าหมดอายุตั้งแต่ตอนนี้ ไม่ต้องรอ server ปฏิเสธ = ไม่มีจอโหลดค้างก่อนเด้ง
      var expiredOnRestore = isStoredTeacherAuthExpired_(teacherAuth);
      if (expiredOnRestore) clearTeacherAuth_();
      state.auth = teacherAuth;

      if (teacherAuth && teacherAuth.session_token) {
        navigateTo(state.page, { replaceHistory: true });
        return;
      }

      loadTeacherLoginOptions_(function () {
        // บอกเหตุผลด้วย ไม่ใช่โยนฟอร์มเปล่าให้ครูเดาว่าทำไมต้องล็อกอินอีก
        renderTeacherLoginState(expiredOnRestore ? 'เซสชันหมดอายุแล้ว กรุณาใส่รหัสครูเพื่อเข้าใช้งานอีกครั้ง' : '');
      });
    }

    function bootstrapTeacherSession_(teacherKey, silent) {
      teacherKey = normalizeTextInput(teacherKey);
      var deviceId = getTeacherDeviceId_();
      if (!teacherKey) {
        renderTeacherLoginState('กรุณากรอกรหัสเข้าใช้งาน');
        return;
      }
      if (!silent) {
        showTeacherLoginBusy_('กำลังยืนยันรหัสเข้าใช้งาน');
      }

      google.script.run
        .withSuccessHandler(function (result) {
          if (result && result.success) {
            handleTeacherAuthSuccess_(result, {
              success_message: silent ? '' : 'เข้าสู่ระบบสำเร็จ'
            });
            return;
          }
          renderTeacherLoginState((result && result.message) || 'เข้าสู่ระบบไม่สำเร็จ');
        })
        .withFailureHandler(function (err) {
          var loginCopy = getTeacherFacingErrorCopy_(String(err && err.message ? err.message : err || ''), 'login');
          renderTeacherLoginState(loginCopy.title + ': ' + loginCopy.nextStep);
        })
        .bootstrapTeacherSession(teacherKey, deviceId);
    }

    function submitTeacherLogin(buttonEl) {
      var input = document.getElementById('teacher-login-key');
      var teacherKey = normalizeTextInput(input && input.value);
      teacherLoginDraft = teacherKey;
      if (!teacherKey) {
        renderTeacherLoginState('กรุณากรอกรหัสเข้าใช้งาน');
        if (input) input.focus();
        return;
      }
      if (buttonEl) setActionButtonState(buttonEl, true, 'กำลังเข้าสู่ระบบ...');
      bootstrapTeacherSession_(teacherKey, false);
    }

    function handleTeacherLoginKeydown(event) {
      if (event && event.key === 'Enter') {
        event.preventDefault();
        submitTeacherLogin();
      }
    }

    function handleTeacherLoginInput(value) {
      teacherLoginDraft = normalizeTextInput(value);
    }

    function logout(buttonEl) {
      if (!isTeacherAuthenticated_()) {
        clearTeacherAuth_();
        renderTeacherLoginState('ออกจากระบบแล้ว');
        return;
      }

      setActionButtonState(buttonEl, true, 'กำลังออกจากระบบ...');
      serverCall('logoutTeacherSession', [], function (result) {
        setActionButtonState(buttonEl, false);
        clearTeacherAuth_();
        state.currentUser = null;
        toast((result && result.message) || 'ออกจากระบบแล้ว', 'success');
        renderTeacherLoginState('ออกจากระบบแล้ว');
      }, function () {
        setActionButtonState(buttonEl, false);
        clearTeacherAuth_();
        state.currentUser = null;
        renderTeacherLoginState('ออกจากระบบแล้ว');
      });
    }

    // Init

    document.addEventListener('DOMContentLoaded', function () {
      defaultPageLoadingHtml = document.getElementById('page-loading').innerHTML;
      state.page = readRequestedPageFromUrl_();
      setupNavigation();
      setupReadinessActionDelegation_();
      document.title = getPageDocumentTitle_(state.page);
      window.addEventListener('popstate', function () {
        navigateTo(readRequestedPageFromUrl_(), { skipHistory: true, replaceHistory: true });
      });
      initializeTeacherAuth_();

    // Navigation

    function setupNavigation() {
      document.querySelectorAll('[data-page]').forEach(function (el) {
        el.addEventListener('click', function (e) {
          e.preventDefault();
          navigateTo(this.getAttribute('data-page'));
        });
      });

      var drawerEl = document.getElementById('nav-drawer');
      var backdropEl = document.getElementById('nav-drawer-backdrop');

      function openDrawer() {
        if (!drawerEl || !backdropEl) return;
        backdropEl.classList.add('open');
        drawerEl.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function closeDrawer() {
        if (!drawerEl || !backdropEl) return;
        drawerEl.classList.remove('open');
        backdropEl.classList.remove('open');
        document.body.style.overflow = '';
      }

      document.getElementById('nav-menu-btn').addEventListener('click', openDrawer);
      var mobileMoreBtn = document.getElementById('mobile-nav-more-btn');
      if (mobileMoreBtn) mobileMoreBtn.addEventListener('click', openDrawer);
      if (backdropEl) backdropEl.addEventListener('click', closeDrawer);
      var drawerCloseBtn = document.getElementById('nav-drawer-close');
      if (drawerCloseBtn) drawerCloseBtn.addEventListener('click', closeDrawer);

      document.querySelectorAll('#nav-drawer-links [data-page]').forEach(function (el) {
        el.addEventListener('click', function () { closeDrawer(); });
      });
    }

    function setupReadinessActionDelegation_() {
      document.addEventListener('click', function (e) {
        var trigger = e.target && e.target.closest ? e.target.closest('[data-readiness-page]') : null;
        if (!trigger) return;
        e.preventDefault();
        openReadinessAction(trigger.getAttribute('data-readiness-page'), trigger.getAttribute('data-readiness-target'));
      });
    }

      var steps = [
        {
          id: 'settings',

        },
        {

          text: 'เพิ่มรายชื่อทีละคนหรือนำเข้าด้วย CSV เพื่อให้เริ่มเช็คชื่อได้ทันที'
        },
        {

        },
        {

        },
        {
          id: 'analytics',

          text: 'ใช้แนวโน้มและกลุ่มที่ควรเฝ้าดู เพื่อวางแผนติดตามนักเรียนได้เร็วขึ้น'

        html += '<div class="page-journey-step-text">' + esc(step.text) + '</div>';

    function isValidPage(page) {

    function buildDefaultPageDataStatus_() {
      return {
        dashboard: { full: 'idle', full_error: '' },
        reports: { summary: 'idle', summary_error: '', daily: 'idle', daily_error: '' },
        settings: { details: 'idle', details_error: '' }
      };
    }

    function ensurePageDataStatusBranch_(page) {
      if (!state.pageDataStatus) state.pageDataStatus = buildDefaultPageDataStatus_();
      if (!state.pageDataStatus[page]) state.pageDataStatus[page] = {};
      return state.pageDataStatus[page];
    }

    function setPageDataStatus_(page, key, status, errorMessage) {
      var branch = ensurePageDataStatusBranch_(page);
      branch[key] = String(status || 'idle');
      branch[key + '_error'] = String(errorMessage || '');
      return { status: branch[key], error: branch[key + '_error'] };
    }

    function getPageDataStatus_(page, key) {
      var branch = ensurePageDataStatusBranch_(page);
      return {
        status: String(branch[key] || 'idle'),
        error: String(branch[key + '_error'] || '')
      };
    }

    function resetPageLoadingState() {
      var loading = document.getElementById('page-loading');
      if (!loading) return;
      loading.classList.remove('page-loading-state');
      loading.style.display = 'none';
      loading.style.position = '';
      loading.style.inset = '';
      loading.style.zIndex = '';
      loading.style.background = '';
      loading.style.padding = '';
      if (defaultPageLoadingHtml) loading.innerHTML = defaultPageLoadingHtml;
    }

    function clearPageLoadTimeout_() {
      if (pageLoadTimeoutId) {
        window.clearTimeout(pageLoadTimeoutId);
        pageLoadTimeoutId = 0;
      }
    }

    function getPagePanelEl_(page) {
      return document.getElementById('page-' + String(page || ''));
    }

    // ★★ จำว่า panel ของแต่ละหน้ากำลังแสดงอะไรอยู่ ('loading' | 'content' | 'error')
    // ใช้ตัดสินว่าการโหลดรอบนี้ควร "ล้างจอแล้ววาดใหม่" หรือ "อัปเดตทับของเดิม"
    //
    // ก่อนหน้านี้การบันทึกค่าเดียวในหน้าตั้งค่าเรียก loadPage('settings') ซึ่งล้างจอ 2 รอบ
    // (renderPagePanelLoading จาก loadPage แล้ว renderPagePanelSkeleton หลังโมดูลโหลดเสร็จ)
    // ครูเห็น เนื้อหา → จอเปล่า → จอเปล่า → เนื้อหา ทั้งที่แก้ไปแค่ค่าเดียว
    // มีผู้เรียกแบบนี้ 22 จุด (ตั้งค่า 16 · นักเรียน 5 · เช็คชื่อ 1)
    var pagePanelState = {};

    function setPagePanelState_(page, value) {
      pagePanelState[String(page || '')] = String(value || '');
    }

    function isPagePanelShowingContent_(page) {
      return pagePanelState[String(page || '')] === 'content';
    }

    /** หรี่ของเดิมไว้ระหว่างรอข้อมูลใหม่ แทนการล้างจอทิ้ง */
    function setPageSoftReloading_(page, isReloading) {
      var panel = getPagePanelEl_(page);
      if (!panel) return;
      if (isReloading) panel.classList.add('is-soft-reloading');
      else panel.classList.remove('is-soft-reloading');
    }

    /**
     * ★ ล้างสถานะหรี่ของทุกหน้า — ต้องเรียกทุกครั้งที่เริ่มโหลดหน้าใหม่
     * ถ้าครูเปลี่ยนหน้าระหว่าง soft reload คำขอเดิมจะถูกทิ้งที่ isActivePageLoad_
     * แล้วไม่มีใครล้างคลาสให้ = หน้านั้นค้างหรี่และกดไม่ได้ตลอดไป
     */
    function clearAllPageSoftReloading_() {
      document.querySelectorAll('.page-panel.is-soft-reloading').forEach(function (el) {
        el.classList.remove('is-soft-reloading');
      });
    }

    function showPagePanel_(page) {
      var panel = getPagePanelEl_(page);
      hideAllPagePanels();
      hidePageLoadingOverlay_();
      if (panel) panel.style.display = 'block';
      return panel;
    }

    function beginPageLoad_(page) {
      activePageLoadId += 1;
      clearAllPageSoftReloading_();
      activePageLoadPage = String(page || '');
      return {
        id: activePageLoadId,
        page: activePageLoadPage
      };
    }

    function isActivePageLoad_(token) {
      return !!token &&
        token.id === activePageLoadId &&
        token.page === activePageLoadPage &&
        token.page === String(state.page || '');
    }

    function buildPageLoadingNoteHtml_(text, visible) {
      var noteText = text || 'กำลังเตรียมข้อมูลล่าสุดของหน้านี้';
      return '<div class="empty-next-step"' + (visible ? '' : ' hidden') + ' data-page-loading-note="true">' +
        '<div class="empty-next-step-title">กำลังโหลด</div>' +
        '<div class="empty-next-step-text">' + esc(noteText) + '</div>' +
        '</div>';
    }

    function ensurePageLoadingNoteElement_(panel) {
      if (!panel) return null;
      var note = panel.querySelector('[data-page-loading-note="true"]');
      if (note) return note;
      var host = panel.querySelector('.skeleton-page') || panel;
      var wrapper = document.createElement('div');
      wrapper.innerHTML = buildPageLoadingNoteHtml_('', false);
      note = wrapper.firstElementChild;
      if (note) host.appendChild(note);
      return note;
    }

    function updatePageLoadingNote_(page, text) {
      var panel = getPagePanelEl_(page);
      if (!panel) return;
      var note = ensurePageLoadingNoteElement_(panel);
      if (!note) return;
      note.hidden = false;
      var textEl = note.querySelector('.empty-next-step-text');
      if (textEl) textEl.textContent = text || 'กำลังโหลดนานกว่าปกติ';
    }

    function schedulePageLoadTimeout_(page, token) {
      clearPageLoadTimeout_();
      pageLoadTimeoutId = window.setTimeout(function () {
        if (isActivePageLoad_(token)) {
          updatePageLoadingNote_(page, 'กำลังโหลดนานกว่าปกติ เครือข่ายอาจช้า หรือระบบกำลังเตรียมข้อมูลอยู่');
        }
      }, 30000);
    }

    function hideAllPagePanels() {
      document.querySelectorAll('.page-panel').forEach(function (el) {
        el.style.display = 'none';
      });
    }

    function renderPageState(icon, title, description, primaryActionHtml, secondaryActionHtml, kicker, tone, nextStepHtml) {
      var loading = document.getElementById('page-loading');
      if (!loading) return;
      clearPageLoadTimeout_();

      hideAllPagePanels();
      resetPageLoadingState();
      loading.style.display = 'block';
      loading.classList.add('page-loading-state');
      loading.innerHTML = buildPageStateHtml(icon, title, description, primaryActionHtml, secondaryActionHtml, kicker, tone, nextStepHtml);
    }

    function buildPageStateHtml(icon, title, description, primaryActionHtml, secondaryActionHtml, kicker, tone, nextStepHtml) {
      var actionsHtml = (primaryActionHtml || secondaryActionHtml)
        ? '<div class="page-state-actions">' + (primaryActionHtml || '') + (secondaryActionHtml || '') + '</div>'
        : '';
      var kickerHtml = kicker ? '<div class="page-state-kicker">' + kicker + '</div>' : '';
      var nextHtml = nextStepHtml ? '<div class="page-state-next"><div class="page-state-next-title">สิ่งที่ควรทำต่อ</div><div class="page-state-next-text">' + nextStepHtml + '</div></div>' : '';
      return '<div class="page-state' + (tone ? ' page-state-' + tone : '') + '">' +
        '<div class="page-state-icon-wrap"><div class="page-state-icon">' + icon + '</div></div>' +
        kickerHtml +
        '<div class="page-state-title">' + title + '</div>' +
        '<div class="page-state-text">' + description + '</div>' +
        nextHtml +
        actionsHtml +
        '</div>';
    }

    function buildEmptyNextStepHtml(text) {
      if (!text) return '';
      return '<div class="empty-next-step"><div class="empty-next-step-title">สิ่งที่ควรทำต่อ</div><div class="empty-next-step-text">' + text + '</div></div>';

    function renderStudentsLoadingShell_() {

    function getReadinessScrollContainer_(target) {
      var node = target;
      while (node && node !== document.body && node !== document.documentElement) {
        try {
          var style = window.getComputedStyle(node);
          var overflowY = String(style.overflowY || '');
          if ((overflowY === 'auto' || overflowY === 'scroll') && node.scrollHeight > node.clientHeight + 8) {
            return node;
          }
        } catch (ignore) {
        }
        node = node.parentElement;
      }
      var mainContent = document.getElementById('main-content');
      if (mainContent) {
        try {
          var mainStyle = window.getComputedStyle(mainContent);
          var mainOverflowY = String(mainStyle.overflowY || '');
          if ((mainOverflowY === 'auto' || mainOverflowY === 'scroll') && mainContent.scrollHeight > mainContent.clientHeight + 8) {
            return mainContent;
          }
        } catch (ignoreMain) {
        }
      }
      return null;
    }

    function focusReadinessTarget_(targetId) {
      var target = document.getElementById(String(targetId || ''));
      if (!target) return false;
      var headerOffset = 118;
      var scrollContainer = getReadinessScrollContainer_(target);
      try {
        if (scrollContainer && scrollContainer !== document.body && scrollContainer !== document.documentElement) {
          var targetRect = target.getBoundingClientRect();
          var containerRect = scrollContainer.getBoundingClientRect();
          var containerTop = targetRect.top - containerRect.top + scrollContainer.scrollTop - 24;
          scrollContainer.scrollTo({ top: Math.max(0, containerTop), behavior: 'smooth' });
        } else {
          var top = target.getBoundingClientRect().top + window.pageYOffset - headerOffset;
          window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
        }
      } catch (e) {
        try {
          target.scrollIntoView({ block: 'start' });
        } catch (e2) {
          target.scrollIntoView();
        }
      }
      try {
        target.classList.remove('readiness-target-flash');
        // force reflow so repeated clicks retrigger the animation
        void target.offsetWidth;
        target.classList.add('readiness-target-flash');
        setTimeout(function () {
          try { target.classList.remove('readiness-target-flash'); } catch (flashErr) {}
        }, 1600);
      } catch (flashError) {
      }
      if (/^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(target.tagName || '')) {
        setTimeout(function () {
          try { target.focus({ preventScroll: true }); } catch (e) {
            try { target.focus(); } catch (e2) {}
          }
        }, 180);
      }
      return true;
    }

    //     ทำให้แก้ CSS แล้วเห็นของใหม่แวบหนึ่งก่อนโดนของเก่าทับ
    // ตัดเส้นทาง lazy ทิ้งทั้งหมด เหลือ inline ทางเดียว → **แก้ CSS แล้วเห็นผลทันที ไม่ติด cache**
    // เก็บฟังก์ชันเป็นเปลือกที่ resolve ทันทีไว้ เพราะยังมีจุดเรียกอยู่หลายที่
    function ensureClientStyleLoaded(name) {
      return Promise.resolve(String(name || ''));
    }

    function ensurePageStylesLoaded(page) {
      return Promise.resolve([]);
    }

    function isClientModuleLoaded_(name) {
      var meta = CLIENT_MODULE_REGISTRY[String(name || '')];
      if (!(meta && meta.global && window[meta.global])) return false;
      return !window[meta.global].__isLazyStub;
    }

    function injectClientModuleScript_(name, scriptText) {
      var existingEl = document.getElementById('client-module-' + name);
      if (existingEl) return;
      var scriptEl = document.createElement('script');
      scriptEl.id = 'client-module-' + name;
      scriptEl.type = 'text/javascript';
      scriptEl.text = String(scriptText || '') + '\n//# sourceURL=' + String(name || 'client-module') + '.module.js';
      document.body.appendChild(scriptEl);
    }

    /**
     * ★ ติดธง __source = 'deps' ที่จุดโยนทุกจุด ไม่ใช่ให้ปลายทางไปค้นคำไทยในข้อความ
     * เดิม loadPage แยกประเภทด้วย indexOf('โมดูล') / indexOf('โค้ดของหน้า') / indexOf('สไตล์')
     * = แก้ถ้อยคำ error แล้วหน้าจอเปลี่ยนพฤติกรรมโดยไม่มีอะไรเตือน
     */
    function moduleLoadError_(message) {
      var err = new Error(String(message || 'ยังโหลดส่วนของหน้านี้ไม่สำเร็จ'));
      err.__source = 'deps';
      return err;
    }

    function ensureClientModuleLoaded(name) {
      name = String(name || '').trim();
      if (!CLIENT_MODULE_REGISTRY[name]) {
        return Promise.reject(moduleLoadError_('ไม่พบโมดูลที่ต้องใช้สำหรับหน้านี้'));
      }
      if (isClientModuleLoaded_(name)) {
        return Promise.resolve(window[CLIENT_MODULE_REGISTRY[name].global]);
      }
      if (clientModulePromises[name]) return clientModulePromises[name];

      clientModulePromises[name] = new Promise(function (resolve, reject) {
        serverCall('getClientModuleContent', [name], function (scriptText) {
          try {
            if (!String(scriptText || '').trim()) {
              throw moduleLoadError_('ยังโหลดโค้ดของหน้าที่ต้องใช้ไม่สำเร็จ');
            }
            injectClientModuleScript_(name, scriptText);
            if (!isClientModuleLoaded_(name)) {
              throw moduleLoadError_('โมดูลของหน้าถูกโหลดไม่ครบ');
            }
            resolve(window[CLIENT_MODULE_REGISTRY[name].global]);
          } catch (e) {
            clientModulePromises[name] = null;
            reject(e);
          }
        }, function (message) {
          clientModulePromises[name] = null;
          reject(moduleLoadError_(message));
        });
      });

      return clientModulePromises[name];
    }

    function ensurePageModuleLoaded(page) {
      var moduleName = PAGE_MODULE_MAP[String(page || '')];
      if (!moduleName) return Promise.resolve(null);
      return ensureClientModuleLoaded(moduleName);
    }

    function getModuleLoadErrorCopy_(page, err) {
      var pageLabel = PAGE_IDENTITY_LABELS[String(page || '')] || 'หน้านี้';
      var description = 'ระบบยังโหลดส่วนแสดงผลของ' + pageLabel + 'ไม่สำเร็จในตอนนี้';
      var nextStep = 'ลองโหลดหน้านี้ใหม่อีกครั้ง ถ้ายังไม่ได้ ให้กลับไปหน้าหลักก่อนแล้วค่อยเปิดใหม่';
      var text = String(err && err.message || '').trim();
      if (/auth|เข้าสู่ระบบ/i.test(text)) {
        description = 'สิทธิ์การใช้งานของคุณอาจหมดอายุระหว่างโหลดหน้า';
        nextStep = 'กลับไปเข้าสู่ระบบใหม่ แล้วลองเปิดหน้านี้อีกครั้ง';
      } else if (/not found|ไม่พบ/i.test(text)) {
        description = 'ระบบยังหาไฟล์ของหน้านี้ไม่เจอหรือยังไม่ได้อัปเดตครบ';
        nextStep = 'ลองรีโหลดหน้าใหม่แบบเต็ม ถ้ายังไม่ได้ให้ redeploy เวอร์ชันล่าสุดก่อนใช้งาน';
      }
      return {
        title: 'ยังโหลด' + pageLabel + 'ไม่สำเร็จ',
        description: description,
        nextStep: nextStep
      };
    }

    function fetchPageInitialData_(page, params) {
      return new Promise(function (resolve, reject) {
        var runner = google.script.run
          .withSuccessHandler(function (result) {
            resolve(result || {});
          })
          .withFailureHandler(function (err) {
            var rawMsg = String(err && err.message ? err.message : err || '');
            var parsedError = parseServerError_(rawMsg);
            if (isTeacherSessionExpiredCode_(parsedError.code)) {
              handleTeacherSessionExpired_(parsedError);
              var authErr = new Error(parsedError.message || rawMsg || 'กรุณาเข้าสู่ระบบใหม่');
              authErr.__handled = true;
              reject(authErr);
              return;
            }
            if (parsedError.code === 'CSRF_INVALID') {
              toast(parsedError.message || 'คำขอไม่ถูกต้อง กรุณารีโหลดหน้าแล้วลองใหม่', 'error');
              window.location.reload();
              var csrfErr = new Error(parsedError.message || rawMsg || 'คำขอไม่ถูกต้อง');
              csrfErr.__handled = true;
              reject(csrfErr);
              return;
            }

            var message = humanizeServerError_(parsedError, rawMsg);

            // ★ พา code ไปกับ error ด้วย เพราะ message ถูกถอด CODE| และแปลงเป็น
            // ภาษาคนไปแล้ว ผู้รับปลายทางจึงแยกประเภทเองไม่ได้ถ้าไม่มี code
            var initialDataError = new Error(message || 'โหลดข้อมูลไม่สำเร็จ');
            initialDataError.__code = parsedError.code || '';
            reject(initialDataError);
          });

        runner.getInitialData(page, params || {}, getTeacherAuth() || {});
      });
    }

    function hidePageLoadingOverlay_() {
      var loadingEl = document.getElementById('page-loading');
      if (!loadingEl) return;
      loadingEl.style.display = 'none';
      loadingEl.classList.remove('page-loading-state');
    }

    function normalizeBootstrapDateRange_(range) {
      range = range || {};
      return {
        from: String(range.from || ''),
        to: String(range.to || '')
      };
    }

    /**
     * ★★ ยิง getDashboardData ขนานไปกับ bootstrap ตั้งแต่ต้น แทนการรอ bootstrap ตอบก่อน
     * ทั้งสองตัวอ่านชีตชุดเดียวกัน (settings · รายชื่อ · ปฏิทิน · บันทึกของวันนี้) และ
     * ตัวที่สองไม่ได้พึ่งผลของตัวแรกเลย การรอจึงเป็นการต่อแถวเปล่าๆ 1 รอบเต็ม
     *
     * เดือนที่ใช้เดาจากฝั่ง client (เดือนปัจจุบัน) ซึ่งตรงกับที่ server ใช้เกือบทุกครั้ง
     * ถ้าไม่ตรง (เช่นวันนี้อยู่นอกภาคเรียน server จะเลื่อนไปเดือนที่มีผล) จะทิ้งผลนี้
     * แล้วยิงใหม่ด้วยเดือนที่ถูก = แย่สุดเท่าเดิมบวกคำขอที่เสียไป 1 ครั้ง
     * โควตาคือ 120 ครั้ง/นาที จึงรับได้
     */
    function prefetchDashboardFullData_(month) {
      var targetMonth = String(month || todayMonthStr());
      var promise = new Promise(function (resolve) {
        // resolve เสมอ ไม่ reject เพื่อไม่ให้กลายเป็น unhandled rejection ระหว่างที่ flow หลักเดินอยู่
        serverCallQuiet('getDashboardData', [targetMonth], function (data) {
          resolve({ ok: true, data: data });
        }, function (msg) {
          resolve({ ok: false, message: msg });
        });
      });
      return { month: targetMonth, promise: promise };
    }

    function loadDashboardFullData_(token, month, prefetched) {
      var targetMonth = String(month || state.dashboardMonth || todayMonthStr());
      setPageDataStatus_('dashboard', 'full', 'loading', '');
      if (state.page === 'dashboard' && window.DashboardPage) window.DashboardPage.render(state);

      function applyDashboardFull_(data) {
        if (!isActivePageLoad_(token) || state.page !== 'dashboard') return;
        state.dashboard = data || null;
        state.readinessSummary = data && data.readiness_summary ? data.readiness_summary : state.readinessSummary;
        state.dashboardMonth = data && data.month ? data.month : targetMonth;
        setPageDataStatus_('dashboard', 'full', 'ready', '');
        if (window.DashboardPage) window.DashboardPage.render(state);
      }

      function failDashboardFull_(msg) {
        if (!isActivePageLoad_(token) || state.page !== 'dashboard') return;
        setPageDataStatus_('dashboard', 'full', 'error', msg || 'ยังโหลดภาพรวมเพิ่มเติมไม่สำเร็จ');
        if (window.DashboardPage) window.DashboardPage.render(state);
      }

      if (prefetched && prefetched.month === targetMonth && prefetched.promise) {
        prefetched.promise.then(function (result) {
          if (result && result.ok) applyDashboardFull_(result.data);
          else failDashboardFull_(result && result.message);
        });
        return;
      }

      serverCallQuiet('getDashboardData', [targetMonth], applyDashboardFull_, failDashboardFull_);
    }

    function loadReportsSummaryAfterBootstrap_(token) {
      if (!window.ReportsPage || typeof window.ReportsPage.loadSummary !== 'function') return;
      setPageDataStatus_('reports', 'summary', 'loading', '');
      if (state.page === 'reports') window.ReportsPage.render(state);
      window.ReportsPage.loadSummary(null, {
        silent: true,
        quiet: true,
        preserveView: true,
        loadToken: token,
        isBootstrapHydrate: true
      });
    }

    function loadSettingsDetails_(token) {
      // ★ ผู้เรียกมีตัวเดียว (applyPageDataAndRender_) ซึ่งเพิ่งตั้งสถานะเดียวกันนี้แล้ววาดไปบรรทัดก่อนหน้า
      // การวาดซ้ำตรงนี้จึงใช้ state เดิมเป๊ะ = วาดหน้าตั้งค่า (~480 บรรทัด) ทิ้งเปล่า 1 รอบ
      // ต่อการเปิดหน้า 1 ครั้ง · เทียบสถานะก่อน เผื่อวันหน้ามีผู้เรียกใหม่ที่ยังไม่ได้ตั้ง
      var wasAlreadyLoading = getPageDataStatus_('settings', 'details').status === 'loading';
      setPageDataStatus_('settings', 'details', 'loading', '');
      if (!wasAlreadyLoading && state.page === 'settings') renderSettingsPage();

      serverCallQuiet('getSettingsDetails', [], function (result) {
        if (!isActivePageLoad_(token) || state.page !== 'settings') return;
        state.semesters = result && result.semesters ? result.semesters : [];
        state.activeSemester = result && result.activeSemester ? result.activeSemester : state.activeSemester;
        state.schoolCalendar = result && result.schoolCalendar
          ? result.schoolCalendar
          : { entries: [], summary: { school_days: 0, holidays: 0 } };
        setPageDataStatus_('settings', 'details', 'ready', '');
        renderSettingsPage();
      }, function (msg) {
        if (!isActivePageLoad_(token) || state.page !== 'settings') return;
        setPageDataStatus_('settings', 'details', 'error', msg || 'ยังโหลดรายละเอียดภาคเรียนและปฏิทินไม่สำเร็จ');
        renderSettingsPage();
      });
    }

    function applyPageDataAndRender_(page, data, token, prefetched) {
      if (!isActivePageLoad_(token)) return;
      refreshTeacherAuth_(data && data.auth);
      state.currentUser = data && data.user ? data.user : null;
      updateNavBrandContext(data && data.user && data.user.schoolName);

      if (data && data.user && data.user.pinState && window.PinLock && !state.pinInitialized) {
        state.pinInitialized = true;
        window.PinLock.init(data.user.pinState);
      }

      switch (page) {
        case 'dashboard':
          state.dashboard = data.dashboard || null;
          state.readinessSummary = data.dashboard && data.dashboard.readiness_summary ? data.dashboard.readiness_summary : state.readinessSummary;
          state.dashboardMonth = data.dashboard && data.dashboard.month ? data.dashboard.month : '';
          state.setupOnboarding = consumeSetupOnboarding_();
          setPageDataStatus_('dashboard', 'full', 'loading', '');
          if (window.DashboardPage) window.DashboardPage.render(state);
          loadDashboardFullData_(token, state.dashboardMonth, prefetched);
          break;
        case 'attendance':
          state.attendance = data.attendance;
          state.currentDate = data.attendance ? data.attendance.date : todayStr();
          renderAttendancePage();
          break;
        case 'reports':
          var reportsBootstrap = data.reportsBootstrap || {};
          var summaryRange = normalizeBootstrapDateRange_(reportsBootstrap.default_summary_range);
          var dailyRange = normalizeBootstrapDateRange_(reportsBootstrap.default_daily_range || reportsBootstrap.default_summary_range);
          state.reportBootstrap = reportsBootstrap;
          state.summary = null;
          state.dailyGrid = null;
          state.reportMonth = summaryRange.from ? String(summaryRange.from).slice(0, 7) : '';
          state.dailyGridFrom = dailyRange.from || '';
          state.dailyGridTo = dailyRange.to || '';
          state.activeSemester = reportsBootstrap.activeSemester || null;
          state.reportTab = reportsBootstrap.initial_report_tab === 'daily' ? 'daily' : 'summary';
          setPageDataStatus_('reports', 'summary', 'loading', '');
          setPageDataStatus_('reports', 'daily', 'idle', '');
          if (window.ReportsPage) window.ReportsPage.render(state);
          loadReportsSummaryAfterBootstrap_(token);
          break;
        case 'analytics':
          if (data && data.month) state.analyticsMonth = data.month;
          if (window.AnalyticsPage) window.AnalyticsPage.render(state);
          break;
        case 'students':
          state.students = data.students;
          renderStudentsPage();
          break;
        case 'import':
          state.activeSemester = data.importBootstrap && data.importBootstrap.activeSemester
            ? data.importBootstrap.activeSemester
            : (state.activeSemester || null);
          if (window.ImportPage) window.ImportPage.render(state);
          break;
        case 'settings':
          var settingsBootstrap = data.settingsBootstrap || {};
          state.settings = settingsBootstrap.settings || {};
          state.pinState = settingsBootstrap.pinState || (data.user && data.user.pinState) || null;
          state.semesters = [];
          state.activeSemester = settingsBootstrap.activeSemester || null;
          state.schoolCalendar = {
            entries: [],
            summary: settingsBootstrap.schoolCalendarSummary || { school_days: 0, holidays: 0 }
          };
          state.studentSummary = settingsBootstrap.studentSummary || { active_total: 0, trashed_total: 0, flagged_total: 0 };
          state.readinessSummary = settingsBootstrap.readinessSummary || state.readinessSummary || null;
          setPageDataStatus_('settings', 'details', 'loading', '');
          renderSettingsPage();
          loadSettingsDetails_(token);
          break;
        default:
          renderPageNotFound(page);
          return;
      }

      setPagePanelState_(page, 'content');
      setPageSoftReloading_(page, false);
      showPagePanel_(page);
      runPendingReadinessActionForPage_(page);
    }

    function loadPage(page) {
      if (!isValidPage(page)) {
        renderPageNotFound(page);
        return;
      }

      if (!isTeacherAuthenticated_()) {
        clearPageLoadTimeout_();
        renderTeacherLoginState('กรุณาเข้าสู่ระบบก่อนใช้งาน');
        return;
      }

      clearPageLoadTimeout_();
      resetPageLoadingState();
      var token = beginPageLoad_(page);

      // ★ 3 ทาง ไม่ใช่ 2
      // 'content' = โหลดซ้ำหน้าที่เปิดอยู่ (เช่นบันทึกค่าในหน้าตั้งค่าแล้วโหลดใหม่) → หรี่ของเดิมไว้
      // 'loading' = navigateTo วาด shell ไปแล้ว → ไม่ต้องวาดซ้ำ (เดิมวาด 2 รอบด้วย state เดียวกัน)
      // อื่นๆ (error / ยังไม่เคยเปิด) → วาด shell ตามปกติ
      var isSoftReload = isPagePanelShowingContent_(page);
      if (isSoftReload) {
        setPageSoftReloading_(page, true);
      } else if (pagePanelState[String(page || '')] !== 'loading') {
        renderPagePanelLoading(page);
      }
      schedulePageLoadTimeout_(page, token);

      // ★ หน้าแรกต้องยิง 2 คำขอเสมอ ตัวที่สองไม่พึ่งตัวแรก จึงยิงพร้อมกันได้
      var dashboardPrefetch = (page === 'dashboard') ? prefetchDashboardFullData_(todayMonthStr()) : null;

      var dataPromise = fetchPageInitialData_(page, {});
      var depsPromise = Promise.all([
        ensurePageStylesLoaded(page),
        ensurePageModuleLoaded(page)
      ]).then(function () {
        if (!isActivePageLoad_(token)) return null;
        // ระหว่าง soft reload ห้ามวาด skeleton ทับ ไม่งั้นของเดิมที่ตั้งใจคงไว้จะหายอยู่ดี
        if (!isSoftReload) renderPagePanelSkeleton(page);
        return true;
      }).catch(function (err) {
        if (err) err.__source = 'deps';
        throw err;
      });

      Promise.all([depsPromise, dataPromise]).then(function (results) {
        var data = results[1] || {};
        if (!isActivePageLoad_(token)) return;
        clearPageLoadTimeout_();

        if (data.error) {
          renderPagePanelError(page, {
            title: 'โหลดข้อมูลไม่สำเร็จ',
            description: data.error,
            nextStep: page === 'settings'
              ? 'ลองโหลดใหม่อีกครั้ง ถ้ายังไม่ได้ให้ตรวจภาคเรียน รายชื่อนักเรียน และปฏิทินวันเรียนในหน้าตั้งค่า'
              : 'ลองโหลดหน้าใหม่อีกครั้ง ถ้ายังไม่ได้ให้กลับไปหน้าหลักก่อนแล้วค่อยเปิดหน้านี้ใหม่'
          }, {
            kicker: page === 'settings' ? 'ตั้งค่าห้องเรียน' : 'กำลังโหลดข้อมูล'
          });
          return;
        }

        applyPageDataAndRender_(page, data, token, dashboardPrefetch);
      }).catch(function (err) {
        clearPageLoadTimeout_();
        if (!isActivePageLoad_(token)) return;
        if (!isTeacherAuthenticated_()) return;
        if (err && err.__handled) return;

        // ★ ธงเดียวพอ — moduleLoadError_ ติดให้ทุกจุดที่โยน และ depsPromise ติดซ้ำอีกชั้น
        // (คำว่า 'สไตล์' ที่เคยค้นหาไม่มีใครโยนอีกแล้วตั้งแต่ตัดเส้นทาง lazy CSS ในรอบ 4)
        var isModuleError = !!(err && err.__source === 'deps');
        if (isModuleError) {
          renderPagePanelError(page, getModuleLoadErrorCopy_(page, err), {
            kicker: 'กำลังเตรียมส่วนแสดงผล'
          });
          return;
        }

        renderPagePanelError(page, getTeacherFacingErrorCopy_(err && err.message, page === 'settings' ? 'settings' : '', err && err.__code), {
          kicker: page === 'settings' ? 'ตั้งค่าห้องเรียน' : 'กำลังโหลดข้อมูล'
        });
      });
    }

    function getCompactAttendanceLabel(code, fallbackLabel) {
      var map = {
        present: 'มา',
        late: 'สาย',
        absent: 'ขาด',
        sick_leave: 'ป่วย',
        personal_leave: 'กิจ'
      };
      return map[String(code || '')] || String(fallbackLabel || '');
    }

    // Attendance Page

    function buildAttendanceViewState_(att) {
      var s = att && att.summary ? att.summary : {};
      var totalCount = parseInt(s.total, 10) || 0;
      var uncheckedCount = parseInt(s.unchecked, 10) || 0;
      var checkedCount = Math.max(0, totalCount - uncheckedCount);
      return {
        summary: s,
        isConfirmed: !!(att && att.day_status && att.day_status.status === 'confirmed'),
        totalCount: totalCount,
        uncheckedCount: uncheckedCount,
        checkedCount: checkedCount
      };
    }

    function getAttendanceHeroText_(viewState) {
      if (viewState.isConfirmed) {
        return 'บันทึกวันนี้ยืนยันแล้ว พร้อมตรวจทานผลลัพธ์และแจ้งผู้ปกครอง';
      }
      if (viewState.uncheckedCount > 0) {
        return 'เหลืออีก ' + viewState.uncheckedCount + ' คน เลือกสถานะต่อจากรายการด้านล่างได้เลย';
      }
      return 'เช็คครบแล้ว ตรวจทานอีกครั้งแล้วกดยืนยันวันนี้';
    }

    function getAttendanceViewHint_(viewState) {
      if (viewState.isConfirmed) {
        return 'วันนี้ยืนยันแล้ว ตรวจดูผลลัพธ์ของแต่ละคนได้ทันที';
      }
      return state.viewMode === 'grid'
        ? 'แตะรูปเพื่อวนสถานะ หรือกดค้างเพื่อเลือกได้เร็วขึ้น'
        : 'เลือกสถานะใต้ชื่อนักเรียนได้ทันที';

    // ★ ค่าพิเศษสำหรับชิป "ยังไม่ระบุกลุ่ม" — ตัวกรองกลุ่มเทียบชื่อกลุ่มแบบตรงตัว
    // จึงต้องมีค่าที่ไม่มีวันชนกับชื่อกลุ่มจริงที่ครูตั้งเอง
    var NO_GROUP_FILTER_ = '\u0000none';

    function hasNoGroup_(student) {
      return !String((student && student.group_name) || '').trim();
    }

    function matchesGroupFilter_(student, filterValue) {
      if (!filterValue) return true;
      if (filterValue === NO_GROUP_FILTER_) return hasNoGroup_(student);
      return String((student && student.group_name) || '') === filterValue;
    }

    function getFilteredAttendanceStudents_(students) {
      students = Array.isArray(students) ? students : [];
      return students.filter(function (s) {
        if (!matchesGroupFilter_(s, state.filterGroup)) return false;
        if (state.filterUnchecked && s.attendance) return false;
        if (state.searchQuery) {

          var q = state.searchQuery.toLowerCase();
          var match = String(s.student_number).indexOf(q) >= 0 ||
            s.full_name.toLowerCase().indexOf(q) >= 0 ||
            (s.nickname && s.nickname.toLowerCase().indexOf(q) >= 0);
          if (!match) return false;
        }
        return true;
      });
    }

    function attendanceListCountText_(filteredCount, totalCount) {
      if (filteredCount === totalCount) return 'ทั้งหมด ' + totalCount + ' คน';
      return 'แสดง ' + filteredCount + '/' + totalCount + ' คน';
    }

    function hasAttendanceFilters_() {
      return !!(state.searchQuery || state.filterGroup || state.filterUnchecked);
    }

      var title = 'ไม่พบนักเรียนตามที่เลือก';
