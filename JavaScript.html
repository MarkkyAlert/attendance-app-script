      var actions = '';

      if (!state.searchQuery && !state.filterGroup && !state.filterUnchecked) {
        title = 'ยังไม่มีรายชื่อนักเรียน';
        text = 'วันนี้ยังไม่มีนักเรียนที่พร้อมให้เช็กชื่อในห้องนี้';
        actions = buildEmptyNextStepHtml('เริ่มจากเพิ่มรายชื่อนักเรียนเอง หรือใช้หน้านำเข้า CSV เพื่อใส่รายชื่อทั้งห้อง แล้วกลับมาเช็กชื่ออีกครั้ง');
        actions += '<div class="attendance-empty-actions"><button class="btn btn-primary btn-sm" onclick="window.AppShared.loadPage(\'students\')">ไปเพิ่มนักเรียน</button><button class="btn btn-ghost btn-sm" onclick="window.AppShared.loadPage(\'import\')">ไปนำเข้า CSV</button></div>';
      } else {
        title = 'ยังไม่พบนักเรียนที่ตรงกับตัวกรองนี้';
        text = 'ไม่มีรายชื่อที่ตรงกับคำค้นหา กลุ่ม หรือเงื่อนไขเฉพาะคนที่ยังไม่เช็ก';
        actions = '<div class="attendance-empty-actions"><button class="btn btn-ghost btn-sm" onclick="App.clearAttendanceFilters()">ล้างตัวกรอง</button></div>';
      }

      return '<div class="empty-state"><div class="empty-icon">' + renderUiIcon('search') + '</div><div class="empty-title">' + title + '</div><div class="empty-desc">' + text + '</div>' + actions + '</div>';
    }

    function renderAttendanceListContent_(students, isConfirmed) {
      if (!students.length) return renderAttendanceEmptyState_();
      if (state.viewMode === 'grid' && window.PhotoGrid) {
        return window.PhotoGrid.renderGrid(students, isConfirmed);
      }
      return renderStudentRows(students, isConfirmed);
    }

    function hydrateAttendanceGridPhotos_(root) {
      if (state.viewMode !== 'grid') return;
      if (!window.PhotoGrid || typeof window.PhotoGrid.afterRender !== 'function') return;
      try {
        window.PhotoGrid.afterRender(root || document.getElementById('attendance-list') || document);
      } catch (e) {}
    }

    function ensureAttendancePhotosLoaded_(onReady) {
      if (state.studentPhotos) {
        if (typeof onReady === 'function') onReady(state.studentPhotos);
        return;
      }
      if (state.studentPhotosLoading) return;

      state.studentPhotosLoading = true;
      serverCallQuiet('getStudentPhotos', [], function (photos) {
        state.studentPhotosLoading = false;
        state.studentPhotos = photos || {};
        if (typeof onReady === 'function') onReady(state.studentPhotos);
      }, function () {
        state.studentPhotosLoading = false;
        if (typeof onReady === 'function') onReady(null);
      });
    }

    function scheduleAttendanceSearchRefresh_() {
      if (attendanceSearchDebounceId) window.clearTimeout(attendanceSearchDebounceId);
      attendanceSearchDebounceId = window.setTimeout(function () {
        attendanceSearchDebounceId = 0;
        refreshAttendanceList_();
      }, ATTENDANCE_SEARCH_DEBOUNCE_MS);
    }

    var attendanceDateDebounceId = 0;

    // ★★ ปุ่ม ◀ ▶ ยิงคำขอทุกครั้งที่กด และก่อนหน้านี้ไม่มีอะไรกันคำขอซ้อนเลย
    // ผลคือกดรัวๆ 3 ครั้ง = คำตอบที่มาถึง "ช้าที่สุด" เป็นตัวชนะ ไม่ใช่วันที่ครูกดล่าสุด
    // เป็นบั๊กความถูกต้อง ไม่ใช่แค่ความช้า จึงใช้ token แบบเดียวกับ isActivePageLoad_
    var activeAttendanceLoadId = 0;
    // วันที่ที่ "ขอไปแล้วแต่ยังไม่กลับมา" — ต้องแยกจาก state.currentDate ซึ่งอัปเดตเมื่อสำเร็จเท่านั้น
    // ไม่งั้นกด ◀ สามครั้งเร็วๆ จะคำนวณ "เมื่อวาน" จากวันเดิมทั้งสามครั้ง แล้วถอยหลังได้แค่วันเดียว
    var pendingAttendanceDate = '';

    function beginAttendanceLoad_(date) {
      activeAttendanceLoadId += 1;
      pendingAttendanceDate = String(date || '');
      return { id: activeAttendanceLoadId, date: pendingAttendanceDate };
    }

    function isActiveAttendanceLoad_(token) {
      return !!token &&
        token.id === activeAttendanceLoadId &&
        String(state.page || '') === 'attendance';
    }

    function endAttendanceLoad_() {
      pendingAttendanceDate = '';
      setAttendanceDateLoading_(false, '');
    }

    /** วันที่ที่ครูคาดว่ากำลังดูอยู่ ณ ตอนนี้ — ใช้เป็นฐานคำนวณของปุ่ม ◀ ▶ */
    function currentAttendanceDateForNav_() {
      return pendingAttendanceDate || state.currentDate;
    }

    /**
     * ★ ก่อนหน้านี้ setLoading() คือ `state.loading = show;` เฉยๆ ไม่วาดอะไรเลย
     * ครูกด ◀ แล้วจอค้างวันเดิมตลอด round-trip จึงกดซ้ำเพราะคิดว่ากดไม่ติด
     * ตรงนี้ทำให้เห็นจริงว่าระบบรับคำสั่งแล้ว
     *
     * ⚠️ **ห้าม disable ปุ่ม ◀ ▶ และช่องวันที่**
     * - ปุ่ม: เคย disable แล้วทดสอบบนของจริงพบว่า **กดรัวๆ 3 ครั้งถอยได้วันเดียว**
     *   เพราะปุ่มที่ disabled ไม่ยิง onclick · ทำให้ token กับ pendingAttendanceDate
     *   ที่สร้างมาเพื่อรองรับการกดรัวๆ ไม่มีโอกาสทำงานเลย (ดู DECISIONS.md ข้อ 39)
     * - ช่องวันที่: เส้นทางพิมพ์มี debounce 800ms ถ้า disable กลางคัน โฟกัสจะหลุด
     *   แล้วครูพิมพ์ต่อไม่ได้
     */
    function setAttendanceDateLoading_(isLoading, requestedDate) {
      var page = document.getElementById('page-attendance');
      if (!page) return;

      if (isLoading) page.classList.add('is-date-loading');
      else page.classList.remove('is-date-loading');

      // ตอบสนองทันทีที่ตัวควบคุมที่ครูเพิ่งใช้ — input[type=date] จัดรูปแบบวันที่ให้เอง
      var input = page.querySelector('.attendance-date-nav .date-input');
      if (input && isLoading && requestedDate && input.value !== requestedDate) {
        input.value = requestedDate;
      }
    }

    function goAttendanceDate_(date) {
      if (attendanceDateDebounceId) {
        window.clearTimeout(attendanceDateDebounceId);
        attendanceDateDebounceId = 0;
      }
      if (!date) return;
      if (date > todayStr()) date = todayStr();
      // input[type=date] ยิงทั้ง input และ change กันโหลดซ้ำและกันกดเลือกวันเดิม
      // ★ เทียบกับวันที่ที่กำลังโหลดอยู่ด้วย ไม่งั้นเลือกวันเดิมซ้ำระหว่างรอจะยิงคำขอเพิ่มเปล่าๆ
      if (date === currentAttendanceDateForNav_()) return;
      loadAttendance(date);
    }

    /**
     * ใช้ตอนพิมพ์วันที่ในช่อง (oninput)
     *
     * ช่อง date เป็นแบบแยกช่อง วัน/เดือน/ปี พอพิมพ์เลขวันตัวแรกก็ได้วันที่ที่สมบูรณ์แล้ว
     * ถ้าเปลี่ยนหน้าทันทีจะเด้งไปวันที่ 1 ตั้งแต่ยังพิมพ์ไม่จบ แล้วเลขที่เหลือหายไปกับการ re-render
     * จึงรอให้พิมพ์นิ่งก่อนค่อยโหลด ส่วน onchange (blur/Enter) ยังเปลี่ยนทันทีเหมือนเดิม
     */
    function goAttendanceDateTyped_(date) {
      if (attendanceDateDebounceId) window.clearTimeout(attendanceDateDebounceId);
      attendanceDateDebounceId = window.setTimeout(function () {
        attendanceDateDebounceId = 0;
        goAttendanceDate_(date);
      }, ATTENDANCE_DATE_TYPING_DEBOUNCE_MS);
    }

    function scheduleStudentsPageRender_() {
      if (studentsSearchDebounceId) window.clearTimeout(studentsSearchDebounceId);
      studentsSearchDebounceId = window.setTimeout(function () {
        studentsSearchDebounceId = 0;
        renderStudentsPage();
      }, STUDENTS_SEARCH_DEBOUNCE_MS);
    }

    function renderStudentRows(students, isConfirmed) {
      if (!students.length) {
        return renderAttendanceEmptyState_();
      }

      var html = '';
      students.forEach(function (s) {
        var hasAtt = !!s.attendance;
        var needsNote = hasAtt && ['late', 'absent', 'sick_leave', 'personal_leave'].indexOf(s.attendance.status_code) >= 0;
        var rowClass = 'student-row attendance-student-row';
        if (hasAtt) rowClass += ' checked';
        if (hasAtt && s.attendance.status_color) rowClass += ' attendance-row-' + s.attendance.status_color;
        if (s.is_flagged) rowClass += ' flagged';

        html += '<div class="' + rowClass + '" id="srow-' + s.student_number + '">';
        html += '<div class="attendance-student-top">';
        html += '<div class="student-num">' + s.student_number + '</div>';
        html += '<div class="attendance-student-body">';
        html += '<div class="student-info">';
        html += '<div class="student-name"><a href="#" onclick="ProfilePage.open(' + s.student_number + ');return false" style="text-decoration:none;color:inherit">' + esc(s.full_name) + '</a>';
        if (s.nickname) html += ' <span class="student-nick">(' + esc(s.nickname) + ')</span>';
        if (s.is_flagged) html += ' <span class="student-inline-icon" title="จับตา">' + renderUiIcon('flag') + '</span>';
        html += '</div>';
        if (hasNoGroup_(s)) {
          // หน้านักเรียนบอกไว้ชัดอยู่แล้ว หน้านี้เคยเงียบ ทำให้การ์ดเตี้ยกว่าคนอื่นโดยไม่มีคำอธิบาย
          html += '<div class="attendance-student-meta">ยังไม่ระบุกลุ่ม</div>';
        } else if (s.group_name) {
          html += '<div class="attendance-student-meta">กลุ่ม ' + esc(s.group_name) + '</div>';
        }
        if (hasAtt && s.attendance.note && (isConfirmed || !needsNote)) {
          html += '<div class="text-xs" style="color:var(--stone-500);margin-top:.125rem">' + renderUiIcon('note') + ' ' + esc(s.attendance.note) + '</div>';
        }
        html += '</div>';

        // วันที่ยังไม่ยืนยัน แสดงปุ่มสถานะไว้เสมอ แม้เช็คไปแล้ว
        // ครูจะได้กดทับได้เลยในจังหวะเดียว ไม่ต้องกด "ล้างสถานะ" ก่อนแล้วค่อยเลือกใหม่
        // และประวัติแก้ไขจะได้ 1 บรรทัด (update เดิม→ใหม่) แทนที่จะเป็น 2 บรรทัด
        html += '<div class="student-status attendance-student-status' + (hasAtt && isConfirmed ? ' attendance-student-status-static' : '') + '">';
        if (!isConfirmed) {
          var statuses = state.attendance.statuses || [];
          statuses.forEach(function (st) {
            var isActive = hasAtt && s.attendance.status_code === st.code;
            html += '<button class="status-btn attendance-status-btn' + (isActive ? ' active-' + st.color : '') + '" onclick="App.markStatus(' + s.student_number + ',\'' + st.code + '\')" title="' + esc(st.label) + '" aria-label="' + esc(st.label) + '"' + (isActive ? ' aria-pressed="true"' : '') + '>';
            html += '<span class="attendance-status-icon">' + renderUiIcon(st.code) + '</span>';
            html += '<span class="show-mobile-inline">' + esc(getCompactAttendanceLabel(st.code, st.label)) + '</span>';
            html += '<span class="hide-mobile">' + esc(st.label) + '</span>';
            html += '</button>';
          });
          if (hasAtt) {
            html += '<button class="attendance-status-reset" onclick="App.undoStatus(' + s.student_number + ')" title="ล้างสถานะ" aria-label="ล้างสถานะ">';
            html += '<span class="attendance-status-icon">' + renderUiIcon('undo') + '</span>';
            html += '<span>ล้างสถานะ</span>';
            html += '</button>';
          }
        } else if (hasAtt) {
          html += '<div class="attendance-selected-status">';
          html += '<span class="student-badge badge-' + s.attendance.status_color + '">';
          html += renderUiIcon(s.attendance.status_code) + ' ' + esc(s.attendance.status_label || '');
          html += '</span>';
          html += '</div>';
        } else {
          html += '<span class="student-badge badge-stone">' + renderUiIcon('unchecked') + ' ยังไม่เช็ค</span>';
        }
        html += '</div>';

        if (!isConfirmed && needsNote) {
          html += '<div class="note-row attendance-note-row">';
          html += '<input class="note-input" placeholder="หมายเหตุ (ถ้ามี)" value="' + esc(s.attendance.note || '') + '" ';
          html += 'onchange="App.saveNote(' + s.student_number + ', this.value)">';
          html += '</div>';
        }

        html += '</div>';
        html += '</div>';
        html += '</div>'; // Added this line to close the outer row container
      });

      return html;
    }

    function summaryCard(icon, count, label, color) {
      return '<div class="attendance-summary-item attendance-summary-' + color + '">' +
        '<div class="attendance-summary-icon">' + icon + '</div>' +
        '<div><div class="attendance-summary-count">' + esc(String(count || 0)) + '</div>' +
        '<div class="attendance-summary-label">' + label + '</div></div></div>';
    }

    function summaryGridHtml_(s) {
      s = s || {};

      var total = parseInt(s.total, 10) || 0;
      var present = parseInt(s.present, 10) || 0;
      var late = parseInt(s.late, 10) || 0;
      var absent = parseInt(s.absent, 10) || 0;
      var sickLeave = parseInt(s.sick_leave, 10) || 0;
      var personalLeave = parseInt(s.personal_leave, 10) || 0;
      var unchecked = parseInt(s.unchecked, 10) || 0;

      var checked = Math.max(0, total - unchecked);
      var pct = total > 0 ? Math.round((checked / total) * 100) : 0;

      var html = '';
      html += '<div class="attendance-progress-head">';
      html += '<div>';
      html += '<p class="attendance-progress-kicker">ความคืบหน้าวันนี้</p>';
      html += '<p class="attendance-progress-meta">เช็คแล้ว ' + checked + '/' + total + ' คน</p>';
      html += '</div>';
      html += '<div class="attendance-progress-value">' + pct + '%</div>';
      html += '</div>';

      html += '<div class="progress-wrap attendance-progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
      html += '<div class="attendance-summary-grid">';
      html += summaryCard(renderUiIcon('present'), present, 'มาเรียน', 'green');
      html += summaryCard(renderUiIcon('late'), late, 'สาย', 'amber');
      html += summaryCard(renderUiIcon('absent'), absent, 'ขาด', 'red');
      html += summaryCard(renderUiIcon('sick_leave'), sickLeave, 'ลาป่วย', 'blue');
      html += summaryCard(renderUiIcon('personal_leave'), personalLeave, 'ลากิจ', 'indigo');

      html += summaryCard(renderUiIcon('unchecked'), unchecked, 'ยังไม่เช็ค', 'stone');
      html += '</div>';

      return html;
    }

    // Attendance Actions

    function loadAttendance(date) {
      // ★ ตัวกรองผูกกับ "วันนี้ยังเช็คไม่เสร็จ" พอเปลี่ยนวันแล้วไม่ล้าง วันที่เช็คครบแล้ว
      // จะขึ้น "แสดง 0/39 คน" ว่างเปล่า ดูเหมือนวันนั้นไม่มีข้อมูล
      // (คำค้นหากับชิปกลุ่มไม่ล้าง เพราะครูตั้งใจใช้ข้ามวันได้)
      if (date && date !== state.currentDate) state.filterUnchecked = false;
      var token = beginAttendanceLoad_(date || state.currentDate);
      setLoading(true);
      setAttendanceDateLoading_(true, token.date);
      serverCall('getAttendanceDaily', [date], function (data) {
        // ★ ล้างสถานะ "กำลังโหลด" ก่อนเสมอถ้านี่คือคำขอล่าสุด แม้ครูจะเปลี่ยนหน้าไปแล้ว
        // ไม่งั้น pendingAttendanceDate ค้าง แล้วปุ่ม ◀ ▶ จะคำนวณจากวันที่เก่าเมื่อกลับมา
        if (token.id === activeAttendanceLoadId) endAttendanceLoad_();
        // ★ ทิ้งคำตอบของคำขอที่ถูกแทนที่ไปแล้ว ไม่งั้นกด ◀ รัวๆ จอจะเด้งไปวันที่ครูไม่ได้ขอเป็นวันสุดท้าย
        if (!isActiveAttendanceLoad_(token)) return;
        state.attendance = data;
        state.currentDate = data.date;
        renderAttendancePage();
        setLoading(false);
      }, function (message, err) {
        if (token.id === activeAttendanceLoadId) endAttendanceLoad_();
        if (!isActiveAttendanceLoad_(token)) return;
        setLoading(false);
        state.currentDate = date || state.currentDate;
        // ★ แยกประเภทด้วย code ที่ serverCall ติดมาให้ ไม่ใช่ค้นคำไทยในข้อความ
        // `message` ที่ได้มาถูกถอด CODE| ออกแล้ว จึงเอาไปแสดงได้ตรงๆ
        if (err && err.__code === 'DATE_IS_HOLIDAY') {
          state.attendance = {
            date: state.currentDate,
            date_th: state.currentDate,
            is_holiday_blocked: true,
            blocked_message: String(message || '')
          };
          renderAttendancePage();
        }
      });
    }

    function recalcSummary_() {
      if (!state.attendance || !Array.isArray(state.attendance.students)) return;

      var summary = {
        present: 0,
        late: 0,
        absent: 0,
        sick_leave: 0,
        personal_leave: 0,
        unchecked: 0,
        total: state.attendance.students.length
      };

      state.attendance.students.forEach(function (st) {
        var code = st && st.attendance ? st.attendance.status_code : '';

        if (code === 'present') summary.present++;
        else if (code === 'late') summary.late++;
        else if (code === 'absent') summary.absent++;
        else if (code === 'sick_leave') summary.sick_leave++;
        else if (code === 'personal_leave') summary.personal_leave++;
        else summary.unchecked++;
      });

      state.attendance.summary = summary;

      var summaryEl = document.getElementById('attendance-summary-block');
      if (summaryEl) {
        summaryEl.innerHTML = summaryGridHtml_(summary);
      }
    }

    function refreshAttendanceList_() {
      var list = document.getElementById('attendance-list');
      if (!list || !state.attendance) return;

      var isConfirmed = state.attendance.day_status && state.attendance.day_status.status === 'confirmed';
      var filteredStudents = getFilteredAttendanceStudents_(state.attendance.students);
      var totalCount = (state.attendance.students || []).length;

      list.innerHTML = renderAttendanceListContent_(filteredStudents, isConfirmed);
      hydrateAttendanceGridPhotos_(list);

      var listCount = document.getElementById('attendance-list-count');
      if (listCount) {
        listCount.textContent = attendanceListCountText_(filteredStudents.length, totalCount);
      }

      var clearFiltersBtn = document.querySelector('.attendance-clear-filters');
      if (clearFiltersBtn) {
        clearFiltersBtn.style.display = hasAttendanceFilters_() ? '' : 'none';
      }
    }

    function refreshAttendanceHeroState_() {
      if (!state.attendance) return;
      var viewState = buildAttendanceViewState_(state.attendance);
      var subtitleEl = document.getElementById('attendance-subtitle');
      if (subtitleEl) subtitleEl.textContent = getAttendanceHeroText_(viewState);

      var metaEl = document.getElementById('attendance-hero-meta');
      if (metaEl) metaEl.innerHTML = renderAttendanceHeroMetaHtml_(viewState);

      var actionsEl = document.getElementById('attendance-hero-actions');
      if (actionsEl) actionsEl.innerHTML = renderAttendanceHeroActionsHtml_(state.attendance, viewState);

      var hintEl = document.getElementById('attendance-list-hint');
      if (hintEl) hintEl.textContent = getAttendanceViewHint_(viewState);
    }

    /**
     * ★★ อัปเดตเฉพาะแถวของนักเรียนคนเดียว แทนการวาด HTML ของทุกคนใหม่
     * แต่ละแถวมีปุ่มสถานะ 5 ปุ่ม แต่ละปุ่มฝัง SVG เต็มตัวจาก renderUiIcon และมี label 2 ชุด
     * (mobile/desktop) ห้องละ 40 คน = ทิ้งและสร้าง DOM ~200 ปุ่มใหม่ เพื่อเปลี่ยนสถานะคนเดียว
     *
     * คืน false เมื่อทำทางลัดไม่ได้ ให้ผู้เรียกวาดทั้งลิสต์แทน — ต้องคืน false ให้ครบทุกกรณี
     * ไม่งั้นจะเหลือแถวค้างที่ไม่ควรอยู่ ซึ่งเป็นความผิดที่มองไม่ออกจนกว่าจะเจอเอง
     */
    function refreshAttendanceStudentRow_(studentNumber) {
      // โหมดรูปวาดคนละโครงสร้าง (PhotoGrid) และต้อง hydrate รูปหลังวาด จึงไม่ใช้ทางลัด
      if (!state.attendance || state.viewMode === 'grid') return false;

      var list = document.getElementById('attendance-list');
      if (!list) return false;

      var row = document.getElementById('srow-' + studentNumber);
      if (!row || !row.parentNode) return false;

      var target = null;
      (state.attendance.students || []).forEach(function (s) {
        if (s && s.student_number === studentNumber) target = s;
      });
      if (!target) return false;

      // ★ ตัวกรองอาจทำให้แถวนี้ต้องหายไป (เช่นกรอง "ยังไม่เช็ค" แล้วเพิ่งเช็คคนนี้)
      // หรือทำให้จำนวนแถวที่ควรแสดงไม่ตรงกับที่มีอยู่จริง — ทั้งสองกรณีต้องวาดใหม่ทั้งลิสต์
      var filtered = getFilteredAttendanceStudents_(state.attendance.students);
      var stillListed = false;
      filtered.forEach(function (s) {
        if (s && s.student_number === studentNumber) stillListed = true;
      });
      if (!stillListed) return false;
      if (filtered.length !== list.querySelectorAll('.attendance-student-row').length) return false;

      var isConfirmed = state.attendance.day_status && state.attendance.day_status.status === 'confirmed';
      var holder = document.createElement('div');
      holder.innerHTML = renderStudentRows([target], isConfirmed);
      var nextRow = holder.firstElementChild;
      if (!nextRow) return false;

      row.parentNode.replaceChild(nextRow, row);
      return true;
    }

    function syncAttendanceViewAfterStateChange_() {
      recalcSummary_();
      refreshAttendanceHeroState_();
      refreshAttendanceList_();
    }

    /** ใช้เมื่อรู้แน่ว่ามีนักเรียนเปลี่ยนแค่คนเดียว (แตะสถานะ / ยกเลิกสถานะ) */
    function syncAttendanceViewAfterStudentChange_(studentNumber) {
      recalcSummary_();
      refreshAttendanceHeroState_();
      if (!refreshAttendanceStudentRow_(studentNumber)) refreshAttendanceList_();
    }

    function clearAttendanceFilters() {
      state.searchQuery = '';
      state.filterGroup = '';
      state.filterUnchecked = false;
      renderAttendancePage();
    }

    function markStatus(studentNumber, statusCode) {
      if (!state.attendance) return;

      var info = null;
      (state.attendance.statuses || []).forEach(function (st) {
        if (st.code === statusCode) info = st;
      });
      if (!info) return;

      var target = null;
      state.attendance.students.forEach(function (s) {
        if (s.student_number === studentNumber) target = s;
      });
      if (!target) return;

      var oldAttendance = target.attendance ? JSON.parse(JSON.stringify(target.attendance)) : null;

      // แตะสถานะเดิมซ้ำไม่ต้องทำอะไร กันไม่ให้เขียนประวัติเปล่าแบบ "สาย → สาย"
      // เปิดช่องได้ง่ายตั้งแต่ปุ่มสถานะแสดงตลอดแม้เช็คไปแล้ว
      if (oldAttendance && oldAttendance.status_code === statusCode) return;

      // optimistic UI
      var noteAllowed = ['late', 'absent', 'sick_leave', 'personal_leave'].indexOf(statusCode) >= 0;
        target.attendance = {
          status_code: statusCode,
          status_label: info.label,
          status_color: info.color,
          note: noteAllowed && oldAttendance && oldAttendance.note ? oldAttendance.note : ''
        };

        syncAttendanceViewAfterStudentChange_(studentNumber);

        serverCall('recordAttendance', [{
          student_number: studentNumber,
          date: state.currentDate,
          status_code: statusCode,
        note: target.attendance.note || ''
      }], function (result) {
          if (result && result.success) {
            toast(result.message, 'success');
          } else {
            target.attendance = oldAttendance;
            syncAttendanceViewAfterStudentChange_(studentNumber);
            toast((result && result.message) || 'บันทึกไม่สำเร็จ', 'error');
          }
        });
      }

    function undoStatus(studentNumber) {
      if (!state.attendance) return;

      var target = null;
      state.attendance.students.forEach(function (s) {
        if (s.student_number === studentNumber) target = s;
      });
      if (!target) return;

      var oldAttendance = target.attendance ? JSON.parse(JSON.stringify(target.attendance)) : null;
        if (!oldAttendance) return;

        // optimistic UI
        target.attendance = null;
        syncAttendanceViewAfterStudentChange_(studentNumber);

        serverCall('undoAttendance', [{
          student_number: studentNumber,
          date: state.currentDate
        }], function (result) {
          if (result && result.success) {
            toast('ยกเลิกแล้ว', 'success');
          } else {
            target.attendance = oldAttendance;
            syncAttendanceViewAfterStudentChange_(studentNumber);
            toast((result && result.message) || 'ยกเลิกไม่สำเร็จ', 'error');
          }
        });
      }

    function saveNote(studentNumber, note) {
      // Find current status
      var student = state.attendance.students.find(function (s) { return s.student_number === studentNumber; });
      if (!student || !student.attendance) return;
      var previousNote = student.attendance.note || '';
      var noteAllowed = ['late', 'absent', 'sick_leave', 'personal_leave'].indexOf(student.attendance.status_code) >= 0;
      var nextNote = noteAllowed ? note : '';
      student.attendance.note = nextNote;

      serverCall('recordAttendance', [{
        student_number: studentNumber,
        date: state.currentDate,
        status_code: student.attendance.status_code,
        note: nextNote
      }], function (result) {
        if (result && result.success) {
          toast('บันทึกหมายเหตุแล้ว', 'info');
        } else {
          student.attendance.note = previousNote;
          toast((result && result.message) || 'บันทึกหมายเหตุไม่สำเร็จ', 'error');
          loadAttendance(state.currentDate);
        }
      }, function (message) {
        student.attendance.note = previousNote;
        toast(message || 'บันทึกหมายเหตุไม่สำเร็จ', 'error');
        loadAttendance(state.currentDate);
      });
    }

    function bulkPresent() {
      if (!state.attendance || !Array.isArray(state.attendance.students)) return;
      var uncheckedCount = state.attendance.students.filter(function (student) {
        return !student || !student.attendance;
      }).length;

      if (uncheckedCount === 0) {
        toast('วันนี้เช็คครบแล้ว', 'info');
        return;
      }

      confirm_dialog('ต้องการเช็ค "มาเรียน" ให้ ' + uncheckedCount + ' คนที่ยังไม่มีสถานะหรือไม่?', function () {
        var previousStudents = JSON.parse(JSON.stringify(state.attendance.students));
        var previousBatch = state.attendance.active_batch ? JSON.parse(JSON.stringify(state.attendance.active_batch)) : null;

        var presentInfo = null;
        (state.attendance.statuses || []).forEach(function (st) {
          if (st.code === 'present') presentInfo = st;
        });
        if (!presentInfo) {
          toast('ไม่พบสถานะมาเรียน', 'error');
          return;
        }

        var changedCount = 0;

        // optimistic UI
        state.attendance.students.forEach(function (s) {
          if (!s.attendance) {
            s.attendance = {
              status_code: 'present',
              status_label: presentInfo.label,
              status_color: presentInfo.color,
              note: ''
            };
            changedCount++;
          }
        });

        // ยังไม่ให้ undo ได้ จนกว่าจะได้ batch_id จริง
        state.attendance.active_batch = {
          batch_id: '',
          count: changedCount,
          pending: true
        };

        syncAttendanceViewAfterStateChange_();

        serverCall('bulkMarkPresent', [state.currentDate], function (result) {
          if (result && result.success) {
            if (result.data && result.data.batch_id) {
              state.attendance.active_batch = {
                batch_id: result.data.batch_id,
                count: result.data.count || changedCount,
                pending: false
              };
            } else {
              state.attendance.active_batch = null;
            }

            syncAttendanceViewAfterStateChange_();
            toast(result.message, 'success');
          } else {
            state.attendance.students = previousStudents;
            state.attendance.active_batch = previousBatch;
            syncAttendanceViewAfterStateChange_();
            toast((result && result.message) || 'เช็คมาทั้งหมดไม่สำเร็จ', 'error');
          }
        });
      });
    }

    function undoBulk() {
      if (!state.attendance || !state.attendance.active_batch || !state.attendance.active_batch.batch_id) {
        toast('ยังไม่พร้อมยกเลิกรายการนี้ กรุณารอสักครู่แล้วลองอีกครั้ง', 'warning');
        return;
      }

      var batchId = state.attendance.active_batch.batch_id;

      confirm_dialog('ต้องการยกเลิกการเช็คมาทั้งหมดหรือไม่?', function () {
        serverCall('undoBulkPresent', [state.currentDate, batchId], function (result) {
          if (result && result.success) {
            toast(result.message, 'success');
            loadAttendance(state.currentDate);
          } else {
            toast((result && result.message) || 'ยกเลิกเช็คทั้งหมดไม่สำเร็จ', 'error');
          }
        });
      });
    }

    function confirmDay(buttonEl) {
      var confirmMessage = 'ยืนยันวันนี้? หลังยืนยัน ระบบจะล็อกวันนี้ไว้ก่อน และคุณยังยกเลิกการยืนยันเพื่อกลับมาแก้ไขได้อีกครั้ง';
      // เตือนซ้ำตรงนี้ด้วย เพราะเป็นจังหวะที่ครูตัดสินใจจริงว่าวันนี้ "เสร็จแล้ว"
      var calendarState = (state.attendance && state.attendance.calendar_state) || {};
      if (calendarState.needs_calendar_fix) {
        confirmMessage += '\n\n⚠️ วันนี้ยังไม่อยู่ในปฏิทินวันเรียน ยืนยันได้ตามปกติ แต่ข้อมูลจะยังไม่ถูกนับในรายงานและบนเอกสาร ปพ.6 จนกว่าจะกด "เพิ่มเป็นวันเรียน"';
      }
      confirm_dialog(confirmMessage, function () {
        // ต้องขึ้นสถานะกำลังทำงานเสมอ ไม่งั้นกล่องจะปิดไปเฉยๆ แล้วจอนิ่งจนครูคิดว่าพังและกดซ้ำ
        // (เดิมงานนี้ใช้เวลาราว 16 วินาทีเพราะอุ่น cache ในล็อก ตัดออกแล้ว แต่ยังต้องรอ server อยู่ดี)
        setActionButtonState(buttonEl, true, 'กำลังยืนยัน...');
        serverCall('confirmDay', [state.currentDate], function (result) {
          setActionButtonState(buttonEl, false);
          if (result.success) {
            state.attendance.day_status = state.attendance.day_status || {};
            state.attendance.day_status.status = 'confirmed';
            syncAttendanceViewAfterStateChange_();
            toast(result.message, 'success');
          } else {
            toast(result.message, 'error');
          }
        }, function () {
          setActionButtonState(buttonEl, false);
        });
      });
    }

    function unconfirmDay(buttonEl) {
      confirm_dialog('ยกเลิกการยืนยันวันนี้? ครูจะกลับมาแก้ไขสถานะและยืนยันใหม่ได้อีกครั้ง', function () {
        setActionButtonState(buttonEl, true, 'กำลังยกเลิกการยืนยัน...');
        serverCall('unconfirmDay', [state.currentDate], function (result) {
          setActionButtonState(buttonEl, false);
          if (result.success) {
            state.attendance.day_status = state.attendance.day_status || {};
            state.attendance.day_status.status = 'draft';
            syncAttendanceViewAfterStateChange_();
            toast(result.message, 'success');
          } else {
            toast(result.message, 'error');
          }
        }, function () {
          setActionButtonState(buttonEl, false);
        });
      });
    }

    // Students Page

    function getFilteredStudents(students) {
      var query = normalizeTextInput(state.studentsSearchQuery).toLowerCase();
      return (students || []).filter(function (s) {
        if (!matchesGroupFilter_(s, state.studentsFilterGroup)) return false;
        if (state.studentsFilterFlagged && !s.is_flagged) return false;
        if (query) {
          var name = String(s.full_name || '').toLowerCase();
          var nickname = String(s.nickname || '').toLowerCase();
          var studentNumber = String(s.student_number || '').toLowerCase();
          var groupName = String(s.group_name || '').toLowerCase();
          if (studentNumber.indexOf(query) === -1 && name.indexOf(query) === -1 && nickname.indexOf(query) === -1 && groupName.indexOf(query) === -1) return false;
        }
        return true;
      });
    }

    function renderStudentsMetric(icon, count, label, color, meta, onClickAction) {
      var inner = '<div class="students-metric-icon">' + renderUiIcon(icon) + '</div>' +
        '<div class="students-metric-value">' + esc(String(count || 0)) + '</div>' +
        '<div class="students-metric-label">' + esc(label) + '</div>' +
        '<div class="students-metric-meta">' + esc(meta || '') + '</div>';

      if (onClickAction) {
        return '<button type="button" class="students-metric students-metric-' + color + ' students-metric-action"' +
          ' onclick="' + onClickAction + '">' + inner + '</button>';
      }
      return '<article class="students-metric students-metric-' + color + '">' + inner + '</article>';

      var setupProgressPct = Math.round((coreSetupDone / 2) * 100);
      var essentialSteps = [

    function handleRestoreBackupFile(input) {
      if (!input || !input.files || !input.files.length) return;
      var file = input.files[0];
      if (!file || !/\.zip$/i.test(file.name || '')) {
        toast('เลือกได้เฉพาะไฟล์สำรอง .zip', 'error');
        return;
      }
      var reader = new FileReader();
      reader.onload = function (event) {
        serverCall('previewRestoreBackup', [String(event.target.result || ''), file.name], function (result) {
          if (!(result && result.success && result.data)) {
            toast((result && result.message) || 'ไม่สามารถอ่านไฟล์สำรองได้', 'error');
            return;
          }
          var data = result.data;
          // ★ ใช้ `data.note` จาก server ไม่ใช่เขียนประโยคของตัวเองซ้ำอีกชุด
          // เดิมมีคำสัญญา 2 ชุดที่ต้องแก้พร้อมกัน และชุดนี้ตกหล่นไปแล้วครั้งหนึ่ง

          var restoreNote = String(data.note || 'การกู้คืนนี้จะเขียนทับข้อมูลในชีตทั้งหมด (ไม่รวมรหัสครูและ PIN)');
          confirm_dialog(
            'กู้คืนข้อมูลจากไฟล์ "' + data.filename + '"\n' +
            '- นักเรียน: ' + data.students + ' แถว\n' +
            '- เช็คชื่อ: ' + data.attendance_records + ' แถว\n' +
            '- ภาคเรียน: ' + data.semesters + ' รายการ\n' +
            '- ปฏิทินวันเรียน: ' + data.school_calendar + ' รายการ\n' +
            '- ลิงก์ผู้ปกครอง: ' + (data.parent_links || 0) + ' รายการ\n\n' +
            restoreNote + '\n\nต้องการดำเนินการต่อหรือไม่?',
            function () {
              serverCall('restoreBackup', [data.preview_token], function (restoreResult) {
                if (restoreResult && restoreResult.success) {
                  toast(restoreResult.message || 'กู้คืนข้อมูลเรียบร้อย', 'success');
                  loadPage('settings');
                } else {
                  toast((restoreResult && restoreResult.message) || 'กู้คืนข้อมูลไม่สำเร็จ', 'error');
                }
              });
            }
          );
        });
      };
      reader.onerror = function () {
        toast('ไม่สามารถอ่านไฟล์สำรองนี้ได้', 'error');
      };
      reader.readAsDataURL(file);
      input.value = '';
    }

    var SCHOOL_CALENDAR_PAGE_SIZE = 20;

    function getSchoolCalendarFilter_() {
      if (!state.calendarFilter) {
        state.calendarFilter = { query: '', holidays_only: false, visible: SCHOOL_CALENDAR_PAGE_SIZE };
      }
      return state.calendarFilter;
    }

    /**
     * กรองรายการปฏิทินตามคำค้นและตัวกรองวันหยุด
     * ค้นได้ทั้งวันที่แบบ ISO (2026-08-15) วันที่ไทย (15 ส.ค. 2569) และรายละเอียดวัน
     */
    function filterSchoolCalendarEntries_(entries, filter) {
      var query = String(filter.query || '').trim().toLowerCase();
      return (entries || []).filter(function (entry) {
        if (filter.holidays_only && entry.type !== 'holiday') return false;
        if (!query) return true;
        var haystack = [
          String(entry.date || ''),
          String(entry.date_label || ''),
          String(entry.label || '')
        ].join(' ').toLowerCase();
        return haystack.indexOf(query) >= 0;
      });
    }

    function renderSchoolCalendarListItems_(entries) {
      var filter = getSchoolCalendarFilter_();
      var matched = filterSchoolCalendarEntries_(entries, filter);
      var total = (entries || []).length;

      if (!matched.length) {
        return '<div class="settings-note settings-note-stone">' + renderUiIcon('note')
          + '<span>ไม่พบวันที่ตรงกับที่ค้น จากทั้งหมด ' + total + ' รายการ</span></div>';
      }

      var visible = Math.min(matched.length, Math.max(SCHOOL_CALENDAR_PAGE_SIZE, filter.visible || SCHOOL_CALENDAR_PAGE_SIZE));
      var html = '';
      matched.slice(0, visible).forEach(function (entry) {
        var isHoliday = entry.type === 'holiday';
        var badgeText = isHoliday ? 'วันหยุด/งดเรียน' : 'วันเรียน';
        // แสดงวันที่แบบไทยถ้า server ส่งมา ถ้าเป็นข้อมูลจาก cache รุ่นเก่าค่อยตกกลับไปใช้ ISO
        var dateText = entry.date_label || entry.date || '';
        html += '<div class="settings-semester-item">';
        html += '<div class="settings-semester-copy">';

      });

      var scopeNote = matched.length === total
        ? ('แสดง ' + visible + ' จาก ' + total + ' รายการ')

    function showSettingsFieldError(inputId, message) {
      var input = document.getElementById(inputId);
      var errorEl = document.getElementById(inputId + '-error');
      if (input) {
        input.classList.add('settings-input-invalid');

    function validateSettingsField(inputId) {
      var input = document.getElementById(inputId);
      var value = input ? normalizeTextInput(input.value) : '';
      if (!input) return true;

      if (inputId === 'set-teacher') {
        if (!value) {
          showSettingsFieldError(inputId, 'กรุณากรอกชื่อครูผู้รับผิดชอบ');
          return false;
        }
        if (hasUnsafeTextInput(value)) {
          showSettingsFieldError(inputId, 'ห้ามใช้อักขระ < > หรือ `');
          return false;
        }
        clearSettingsFieldError(inputId);
        return true;
      }

      if (inputId === 'set-school') {
        if (!value) {
          showSettingsFieldError(inputId, 'กรุณากรอกชื่อโรงเรียน');
          return false;
        }
        if (hasUnsafeTextInput(value)) {
          showSettingsFieldError(inputId, 'ห้ามใช้อักขระ < > หรือ `');
          return false;
        }
        clearSettingsFieldError(inputId);
        return true;
      }

      if (inputId === 'set-class') {
        if (!value) {
          showSettingsFieldError(inputId, 'กรุณากรอกระดับชั้นเรียน');
          return false;
        }
        if (hasUnsafeTextInput(value)) {
          showSettingsFieldError(inputId, 'ห้ามใช้อักขระ < > หรือ `');
          return false;
        }
        clearSettingsFieldError(inputId);
        return true;
      }

      if (inputId === 'set-alert') {
        var alertNum = parseInt(value, 10);
        if (!value || isNaN(alertNum) || alertNum < 1 || alertNum > 30) {
          showSettingsFieldError(inputId, 'กำหนดได้ตั้งแต่ 1 ถึง 30 วัน');
          return false;
        }
        clearSettingsFieldError(inputId);
        return true;
      }

      if (inputId === 'set-attention-threshold') {
        var attentionNum = parseInt(value, 10);
        if (!value || isNaN(attentionNum) || attentionNum < 1 || attentionNum > 30) {
          showSettingsFieldError(inputId, 'กำหนดได้ตั้งแต่ 1 ถึง 30 วัน');
          return false;
        }
        clearSettingsFieldError(inputId);
        return true;
      }

      if (inputId === 'set-photo-folder') {
        if (value && value.indexOf('drive.google.com') === -1 && !/^[A-Za-z0-9_-]{20,}$/.test(value)) {
          showSettingsFieldError(inputId, 'วางลิงก์โฟลเดอร์ Google Drive หรือรหัสโฟลเดอร์ที่ถูกต้อง');
          return false;
        }
        clearSettingsFieldError(inputId);
        return true;
      }

      if (inputId === 'set-pin-timeout') {
        var timeoutNum = parseInt(value, 10);
        if (!value || isNaN(timeoutNum) || timeoutNum < 1 || timeoutNum > 60) {
          showSettingsFieldError(inputId, 'กำหนดได้ตั้งแต่ 1 ถึง 60 นาที');
          return false;
        }
        clearSettingsFieldError(inputId);
        return true;
      }

      if (inputId === 'set-parent-token-ttl') {
        var ttlNum = parseInt(value, 10);
        if (!value || isNaN(ttlNum) || ttlNum < 7 || ttlNum > 90) {
          showSettingsFieldError(inputId, 'กำหนดได้ตั้งแต่ 7 ถึง 90 วัน');
          return false;
        }
        clearSettingsFieldError(inputId);
        return true;
      }

      if (inputId === 'set-new-teacher-key') {
        if (!value) {
          clearSettingsFieldError(inputId);
          return true;
        }
        if (value.length < 12) {
          showSettingsFieldError(inputId, 'รหัสครูต้องยาวอย่างน้อย 12 ตัวอักษร');
          return false;
        }
        if (!/[A-Za-z]/.test(value) || !/[0-9]/.test(value)) {
          showSettingsFieldError(inputId, 'รหัสครูต้องมีทั้งตัวอักษรและตัวเลข');
          return false;
        }
        clearSettingsFieldError(inputId);
        return true;
      }

      clearSettingsFieldError(inputId);
      return true;
    }

    function validateStudentForm(mode, forceAll) {

      var fieldMap = mode === 'edit'
        ? { number: 'f-enum', name: 'f-ename', email: 'f-eemail', enrolled: 'f-eenrolled' }
        : { number: 'f-snum', name: 'f-sname', email: 'f-semail', enrolled: 'f-senrolled' };

          valid = false;
        } else {
          clearSettingsFieldError(fieldMap.number);
        }
      }

      var fullName = normalizeTextInput(document.getElementById(fieldMap.name) && document.getElementById(fieldMap.name).value);
      if (!fullName) {
        if (forceAll) {
          showSettingsFieldError(fieldMap.name, 'กรุณากรอกชื่อ-สกุลนักเรียน');
          valid = false;
        } else {
          clearSettingsFieldError(fieldMap.name);
        }
      } else if (hasUnsafeTextInput(fullName)) {

        valid = false;
      } else {
        clearSettingsFieldError(fieldMap.name);
      }

      if (fieldMap.enrolled) {
        var enrolledDate = normalizeTextInput(document.getElementById(fieldMap.enrolled) && document.getElementById(fieldMap.enrolled).value);
        if (!enrolledDate) {
          if (forceAll) {
            showSettingsFieldError(fieldMap.enrolled, 'กรุณาเลือกวันที่เริ่มอยู่ในห้อง');

            clearSettingsFieldError(fieldMap.enrolled);

          showSettingsFieldError(fieldMap.enrolled, 'รูปแบบวันที่ไม่ถูกต้อง');
          valid = false;

          showSettingsFieldError(fieldMap.enrolled, 'วันที่เริ่มอยู่ในห้องต้องไม่เกินวันนี้');

    function createBackup() {
      toast('กำลังสร้างไฟล์สำรอง...', 'info');
      var btn = document.getElementById('backup-btn');
      var backupLabel = renderUiIcon('download') + ' สร้างไฟล์สำรอง';
      if (btn) { btn.disabled = true; btn.innerHTML = renderUiIcon('download') + ' กำลังสร้าง...'; }

      serverCall('createBackup', [], function (result) {
        if (btn) { btn.disabled = false; btn.innerHTML = backupLabel; }
        if (result.success) {
          var backupMeta = writeBackupMeta_(result.filename || 'ไฟล์สำรอง');
          if (openDownloadWindow(result.url, 'เบราว์เซอร์บล็อกไฟล์ดาวน์โหลด กรุณาอนุญาต pop-up แล้วลองใหม่')) {
            toast('ดาวน์โหลด ' + result.filename, 'success');
          }
          var latestBackupEl = document.getElementById('settings-backup-latest-value');
          if (latestBackupEl) latestBackupEl.textContent = formatBackupMetaLabel_(backupMeta);

          if (result.file_id) {
            // ★ 5 นาที ไม่ใช่ 1 นาที เพราะถ้า pop-up ถูกบล็อก ครูต้องกดลิงก์ในกล่องเอง
            // ซึ่งใช้เวลาอ่านและตัดสินใจ · ของเดิม 60 วินาทีทำให้ไฟล์หายก่อนครูกดทัน
            // (`registerTempDriveFile_` ลงทะเบียนไว้ 1800 วินาที จึงยังอยู่ในขอบเขต)
            setTimeout(function () {
              serverCall('cleanupBackupFile', [result.file_id], function () {});
            }, 300000);
          }
        } else {
          toast('ไม่สามารถสร้างไฟล์สำรองได้', 'error');
        }
      }, function () {
        if (btn) { btn.disabled = false; btn.innerHTML = backupLabel; }
      });
    }

    /**
     * รายชื่อผู้รับในกล่องยืนยันส่งอีเมล
     * ★ เดิมกล่องนี้มีแต่ตัวนับ 4 ช่อง ครูจึงกดส่งโดยไม่เคยเห็นว่า
     *   ข้อมูลการมาโรงเรียนของเด็กจะไปถึงที่อยู่ไหน ถ้าอีเมลในชีตพิมพ์ผิด
     *   หรือเป็นของเก่า ไม่มีจังหวะไหนให้ครูทักท้วงเลย
     *   ข้อมูลชุดนี้ server ส่งมาให้ครบอยู่แล้ว แค่ไม่เคยถูกวาด
     * ★ กลุ่ม missing ตั้งใจไม่โชว์ช่องอีเมล เพราะไม่มีอยู่แล้วตามนิยาม
     *   แต่ต้องโชว์ "ใคร" เพราะข้อความเดิมบอกให้ไปเติมอีเมลโดยไม่บอกว่าใคร
     */
    function renderParentEmailRecipientList_(items, title, kind) {
      items = items || [];
      if (!items.length) return '';

      var html = '<div class="modal-section-label">' + esc(title) + ' (' + items.length + ')</div>';
      html += '<div class="email-recipient-list">';
      items.forEach(function (item) {
        var number = item.student_number === 0 || item.student_number ? String(item.student_number) : '';
        var nickname = item.nickname ? ' (' + item.nickname + ')' : '';
        html += '<div class="email-recipient-row email-recipient-row-' + esc(kind) + '">';
        html += '<div class="email-recipient-head">';
        if (number) html += '<span class="email-recipient-number">' + esc(number) + '</span>';
        html += '<span class="email-recipient-name">' + esc(String(item.full_name || '') + nickname) + '</span>';
        if (item.status_label) {
          html += '<span class="email-recipient-status">' + esc(item.status_label) + '</span>';
        }
        html += '</div>';
        if (kind === 'missing') {
          html += '<div class="email-recipient-missing">ยังไม่มีอีเมลผู้ปกครองในระบบ</div>';
        } else if (item.parent_email) {
          html += '<div class="email-recipient-mail">' + esc(item.parent_email) + '</div>';
        }
        // ★ ไม่โชว์ `item.note` ตรงนี้ เพราะอีเมลไม่ส่งหมายเหตุแล้วตั้งแต่ 21 ส.ค. 2569
        // ถ้าเอาหมายเหตุกลับเข้าอีเมลเมื่อไหร่ ต้องเอาบรรทัดนี้กลับมาพร้อมกัน
        // ไม่งั้นกล่องยืนยันจะโกหกครูว่าไม่ได้ส่ง ทั้งที่ส่ง · `DECISIONS.md` ข้อ 52
        html += '</div>';
      });
      html += '</div>';
      return html;
    }

    function sendEmails() {
      serverCall('previewParentEmails', [state.currentDate], function (result) {
        if (result && result.success === false) {
          toast(result.message || 'ไม่สามารถเตรียมรายการอีเมลได้', 'error');
          return;
        }
        var data = result && result.data ? result.data : (result || {});
        var readyCount = parseInt(data.recipient_count || data.total_recipients || data.eligible_count || data.ready_count || 0, 10) || 0;
        var alreadySentCount = parseInt(data.already_sent_count || 0, 10) || 0;
        var missingCount = parseInt(data.missing_email_count || data.no_email_count || 0, 10) || 0;
        var totalStudents = parseInt(data.student_count || data.total_students || 0, 10) || 0;
        var infoMessage = (result && result.message) || '';
        var isLegacyFullyNotified = !!(data.legacy_fully_notified || result.legacy_fully_notified);

        if (readyCount <= 0 && alreadySentCount <= 0 && missingCount <= 0 && !isLegacyFullyNotified) {
          toast(infoMessage || 'ยังไม่มีอีเมลผู้ปกครองที่พร้อมส่ง', 'info');
          return;
        }

        var body = '<div class="modal-body-shell">';
        body += '<div class="modal-section-label">พร้อมส่งสรุปหลังเช็คชื่อ</div>';
        body += '<p class="modal-lead">ระบบจะส่งสรุปการเช็คชื่อของวันที่ ' + esc(state.currentDate) + ' ไปยังผู้ปกครองที่มีอีเมลอยู่ในระบบ เพื่อใช้สื่อสารผลของวันนั้นได้ทันที</p>';
        body += '<div class="modal-meta-row">';
        body += '<div class="modal-chip-row">';
        body += '<span class="modal-chip">วันที่ ' + esc(state.currentDate) + '</span>';
        body += '<span class="modal-chip">สรุปการแจ้งผลหลังเช็คชื่อ</span>';
        body += '</div>';
        body += '</div>';
        body += '<div class="modal-stat-grid">';
        body += '<div class="modal-stat-card modal-stat-card-ready"><div class="modal-stat-eyebrow">พร้อมส่ง</div><div class="modal-stat-value">' + esc(String(readyCount)) + '</div><div class="modal-stat-label">ผู้ปกครองที่มีอีเมลพร้อมรับสรุป</div></div>';
        body += '<div class="modal-stat-card modal-stat-card-total"><div class="modal-stat-eyebrow">ส่งแล้ว</div><div class="modal-stat-value">' + esc(String(alreadySentCount)) + '</div><div class="modal-stat-label">รายการที่ส่งสำเร็จไปแล้วและไม่ต้องส่งซ้ำ</div></div>';
        body += '<div class="modal-stat-card modal-stat-card-warning"><div class="modal-stat-eyebrow">ยังขาดอีเมล</div><div class="modal-stat-value">' + esc(String(missingCount)) + '</div><div class="modal-stat-label">รายที่ควรเติมอีเมลในหน้านักเรียนก่อน</div></div>';
        body += '<div class="modal-stat-card modal-stat-card-total"><div class="modal-stat-eyebrow">นักเรียนทั้งหมด</div><div class="modal-stat-value">' + esc(String(totalStudents)) + '</div><div class="modal-stat-label">จำนวนรายชื่อที่อยู่ในห้องเรียนของวันนั้น</div></div>';
        body += '</div>';
        body += renderParentEmailRecipientList_(data.will_send, 'จะส่งถึงผู้ปกครองเหล่านี้', 'send');
        body += renderParentEmailRecipientList_(data.no_email, 'ยังขาดอีเมล จึงจะไม่ถูกส่ง', 'missing');
        body += renderParentEmailRecipientList_(data.already_sent, 'ส่งไปแล้ว ไม่ส่งซ้ำ', 'sent');
        body += '<div class="modal-story-note">' + esc(infoMessage || (readyCount > 0 ? 'ตรวจที่อยู่ปลายทางให้ครบก่อนกดส่ง ถ้ามีที่อยู่ผิดให้ไปแก้ในหน้านักเรียนก่อน' : 'วันนี้ไม่มีรายการคงค้างสำหรับการส่งเพิ่มเติม')) + '</div>';
        if (isLegacyFullyNotified) {
          body += '<div class="modal-story-note">พบข้อมูลการแจ้งผู้ปกครองแบบเก่าที่ไม่มีรายชื่อผู้รับรายคน เลือกย้ายสถานะเดิมหากต้องการเก็บประวัติเดิมไว้ หรือรีเซ็ตเพื่อส่งใหม่ทั้งชุด</div>';
        }
        body += '</div>';
        var buttons = [
          { label: readyCount > 0 || isLegacyFullyNotified ? 'ยกเลิก' : 'ปิด', class: 'btn btn-ghost', action: 'closeModal()' }
        ];
        if (isLegacyFullyNotified) {
          buttons.push({ label: 'ย้ายสถานะเดิม', class: 'btn btn-ghost', action: 'App.repairParentEmailNotifications(\'migrate\', this)' });
          buttons.push({ label: 'รีเซ็ตเพื่อส่งใหม่', class: 'btn btn-primary', action: 'App.repairParentEmailNotifications(\'reset\', this)' });
        } else if (readyCount > 0) {
          buttons.push({ label: 'ส่งอีเมล', class: 'btn btn-primary', action: 'App.doSendEmails(this)' });
        }
        showModal('ส่งอีเมลสรุปให้ผู้ปกครอง', body, buttons);

      });
    }

    function parseServerError_(message) {
      var text = String(message || '').trim();
      text = text.replace(/^(Exception|Error):\s*/i, '');
      text = text.replace(/^Server error:\s*/i, '');
      var pipeIndex = text.indexOf('|');
      if (pipeIndex > 0) {
        var candidate = text.substring(0, pipeIndex);
        // ★ ต้องตรวจรูปว่าเป็น code จริง ไม่ใช่เจอ `|` แล้วตัดหัวทันที
        // ข้อความปกติที่มี `|` อยู่ตามธรรมชาติจะถูกตัดหัวหายโดยไม่ได้ตั้งใจ
        // เกณฑ์เดียวกับ `splitErrorCode_` [Utils.js] ฝั่ง server
        if (/^[A-Z][A-Z0-9_]*$/.test(candidate)) {
          return { code: candidate, message: text.substring(pipeIndex + 1) };
        }
      }
      return { code: '', message: text };
    }

    // ─── ตัวช่วยร่วมของ 3 ทางเรียก server ───────────────────────────
    // ★ `serverCall` / `serverCallQuiet` / `fetchPageInitialData_` เคยก๊อปตรรกะ 3 ก้อนนี้
    // ไว้คนละชุด เพิ่ม error แบบใหม่ต้องแก้ 3 ที่ **ลืมที่ใดที่หนึ่ง = ข้อความดิบหลุดไปหาครู
    // เฉพาะบางเส้นทาง** ซึ่งหาสาเหตุยากเพราะอีกสองเส้นทางยังถูกอยู่
    // ส่วนหางที่ต่างกันจริง (toast / reject promise / เงียบ) ยังอยู่ที่เดิมของแต่ละตัว

    function isTeacherSessionExpiredCode_(code) {
      return code === 'AUTH_REQUIRED' || code === 'AUTH_EXPIRED';
    }

    /** ล้าง session ฝั่ง client แล้วพากลับไปหน้าเข้าสู่ระบบ */
    function handleTeacherSessionExpired_(parsedError) {
      clearTeacherAuth_();
      state.currentUser = null;
      hideAllPagePanels();
      resetPageLoadingState();
      loadTeacherLoginOptions_(function () {
        renderTeacherLoginState((parsedError && parsedError.message) || 'กรุณาเข้าสู่ระบบก่อนใช้งาน');
      });
    }

    /**
     * แปลง error ของ server ให้เป็นข้อความที่ครูอ่านรู้เรื่อง
     * ★ 3 เงื่อนไขล่างยังค้นคำอังกฤษ **และถูกต้องแล้ว** เพราะเป็นข้อความของ
     * Apps Script / Google เอง ไม่ใช่ของเรา จึงไม่มี `CODE|` ให้เทียบ
     * อย่า "แก้" ให้ไปเทียบ code เหมือนข้ออื่น — ดู `DECISIONS.md` ข้อ 29
     */
    function humanizeServerError_(parsedError, rawMsg) {
      var message = String((parsedError && parsedError.message) || rawMsg || '').trim();
      if (parsedError && parsedError.code === 'SHEET_MISSING') {
        return 'ระบบยังตั้งค่าไม่สมบูรณ์ กรุณาตรวจสอบการเชื่อมต่อข้อมูลครั้งแรก';
      }
      if (message.indexOf('permission') >= 0 || message.indexOf('Permission') >= 0) {
        return 'ไม่สามารถเข้าถึงข้อมูลได้ กรุณาลองใหม่ หรือติดต่อผู้ดูแลระบบ';
      }
      if (message.indexOf('Timeout') >= 0 || message.indexOf('timeout') >= 0) {
        return 'โหลดนานเกินไป กรุณาลองใหม่อีกครั้ง';
      }
      if (message.indexOf('quota') >= 0 || message.indexOf('Quota') >= 0) {
        return 'ใช้งานเกินโควต้า กรุณารอสักครู่แล้วลองใหม่';
      }
      return message;
    }

    /** เรียก onFailure โดยไม่ให้ error ใน callback ของผู้เรียกลามออกมา */
    function invokeFailureHandler_(onFailure, message, errorForHandler) {
      if (typeof onFailure !== 'function') return;
      try {
        onFailure(message, errorForHandler);
      } catch (callbackErr) {
        console.error('Failure handler error:', callbackErr);
      }
    }

    function serverCall(fnName, args, callback, onFailure) {
      var callArgs = (args || []).slice();
      if (fnName !== 'bootstrapTeacherSession') {
        callArgs.push(getTeacherAuth() || {});
      }
      var runner = google.script.run.withSuccessHandler(function (result) {
        try { callback(result); } catch (e) {
          console.error('Render error:', e);
          toast('เกิดข้อผิดพลาดในการแสดงผล: ' + e.message, 'error');
          setLoading(false);
        }
      }).withFailureHandler(function (err) {
        var rawMsg = String(err && err.message ? err.message : err || '');
        var parsedError = parseServerError_(rawMsg);
        if (isTeacherSessionExpiredCode_(parsedError.code)) {
          handleTeacherSessionExpired_(parsedError);
          invokeFailureHandler_(onFailure, parsedError.message || rawMsg, err);
          return;
        }
        if (parsedError.code === 'CSRF_INVALID') {
          toast(parsedError.message || 'คำขอไม่ถูกต้อง กรุณารีโหลดหน้าแล้วลองใหม่', 'error');
          window.location.reload();
          return;
        }
        var msg = humanizeServerError_(parsedError, rawMsg);
        // ★ พา code ไปกับ err ด้วย เพราะ onFailure ได้รับข้อความที่แปลงเป็นภาษาคนแล้ว
        // ผู้รับจึงแยกประเภทเองไม่ได้ถ้าไม่มี code (ดู loadAttendance)
        err = { message: msg, __code: parsedError.code || '' };

        toast(msg, 'error');
        setLoading(false);
        var loadingEl = document.getElementById('page-loading');
        if (loadingEl) loadingEl.style.display = 'none';
        invokeFailureHandler_(onFailure, msg, err);
      });
      runner[fnName].apply(runner, callArgs);
    }

    function serverCallQuiet(fnName, args, callback, onFailure) {
      var callArgs = (args || []).slice();
      if (fnName !== 'bootstrapTeacherSession') {
        callArgs.push(getTeacherAuth() || {});
      }
      var runner = google.script.run.withSuccessHandler(function (result) {
        try { callback(result); } catch (e) {
          console.error('Render error:', e);
          invokeFailureHandler_(onFailure, e && e.message ? e.message : 'เกิดข้อผิดพลาดในการแสดงผล', e);
        }
      }).withFailureHandler(function (err) {
        var rawMsg = String(err && err.message ? err.message : err || '');
        var parsedError = parseServerError_(rawMsg);
        if (isTeacherSessionExpiredCode_(parsedError.code)) {
          handleTeacherSessionExpired_(parsedError);
          invokeFailureHandler_(onFailure, parsedError.message || rawMsg, err);
          return;
        }
        // ★ ต่างจาก serverCall ตรงนี้โดยเจตนา: ตัวเงียบไม่ toast ก่อนรีโหลด
        if (parsedError.code === 'CSRF_INVALID') {
          window.location.reload();
          return;
        }
        var msg = humanizeServerError_(parsedError, rawMsg);
        // พา code ไปด้วยเหมือน serverCall เพื่อให้ผู้รับแยกประเภทได้โดยไม่ต้องค้นคำไทย
        invokeFailureHandler_(onFailure, msg, { message: msg, __code: parsedError.code || '' });
      });
      runner[fnName].apply(runner, callArgs);
    }

    function getBangkokDateParts(date) {
      var formatter = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Bangkok',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      });
      var map = {};
      formatter.formatToParts(date || new Date()).forEach(function (part) {
        if (part.type !== 'literal') map[part.type] = part.value;
      });
      return {
        year: map.year || '1970',
        month: map.month || '01',
        day: map.day || '01'
      };
    }

    function formatLocalDate(date) {
      return date.getUTCFullYear() + '-' + ('0' + (date.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + date.getUTCDate()).slice(-2);
    }

    function shiftMonthString(monthStr, offset) {
      var match = String(monthStr == null ? '' : monthStr).match(/^(\d{4})-(\d{2})$/);
      if (!match) {
        return todayMonthStr();
      }
      var year = parseInt(match[1], 10);
      var month = parseInt(match[2], 10);
      var totalMonths = (year * 12) + (month - 1) + (parseInt(offset, 10) || 0);
      var newYear = Math.floor(totalMonths / 12);
      var newMonth = (totalMonths % 12) + 1;
      return newYear + '-' + ('0' + newMonth).slice(-2);
    }

    function todayStr() {
      var parts = getBangkokDateParts(new Date());
      return parts.year + '-' + parts.month + '-' + parts.day;
    }

    function todayMonthStr() {
      return String(todayStr() || '').slice(0, 7);
    }

    function parseLocalDateString(value) {
      var match = String(value == null ? '' : value).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (match) {
        return new Date(Date.UTC(parseInt(match[1], 10), parseInt(match[2], 10) - 1, parseInt(match[3], 10), 5, 0, 0));
      }
      return new Date(value);
    }

    function toast(message, type) {
      type = type || 'info';
      var container = document.getElementById('toast-container');
      if (!container) return;
      var el = document.createElement('div');
      el.className = 'toast toast-' + type;
      el.textContent = message;
      el.setAttribute('role', type === 'error' || type === 'warning' ? 'alert' : 'status');
      el.setAttribute('aria-live', type === 'error' || type === 'warning' ? 'assertive' : 'polite');
      el.setAttribute('aria-atomic', 'true');
      container.appendChild(el);
      var dur = type === 'error' ? 4500 : 2500;
      setTimeout(function () { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, dur);
      setTimeout(function () { if (el.parentNode === container) container.removeChild(el); }, dur + 500);
    }

    // เหมือนตัวใน JsReports / JsAnalytics / JsDashboard ทุกประการ
    // ★ ห้ามลดรูปเหลือ execCommand เปล่าๆ — มันคืน false ได้โดยไม่ throw
    // จุดที่เรียกจะเข้าใจว่าสำเร็จทั้งที่คลิปบอร์ดยังว่าง
    function copyTextToClipboard_(text, onSuccess, onError) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(onSuccess).catch(function () {
          fallbackCopyText_(text, onSuccess, onError);
        });
        return;
      }
      fallbackCopyText_(text, onSuccess, onError);
    }

    function fallbackCopyText_(text, onSuccess, onError) {
      try {
        var textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', 'readonly');
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        var copied = document.execCommand('copy');
        document.body.removeChild(textarea);
        if (copied) {
          onSuccess();
          return;
        }
      } catch (err) {}
      onError();
    }

    /**
     * ★★ เปิดหน้าต่างดาวน์โหลด และ**มีทางออกให้เสมอถ้าถูกบล็อก**
     *
     * `window.open` ถูกเรียกหลังจบ round-trip ของ `serverCall` แล้ว จึง**เสีย transient
     * user activation** เบราว์เซอร์จึงบล็อกได้ตามปกติ ไม่ใช่ความผิดของครู
     * เกิดจริง 18 ส.ค. 2569: กด "สร้างไฟล์สำรอง" สำเร็จฝั่ง server แต่ไฟล์ไม่ถึงเครื่องเลย
     * (ไม่มีในประวัติดาวน์โหลดของ Chrome และไม่มีแท็บใหม่)
     * เป็นปัญหาชนิดเดียวกับบั๊ก `execCommand('copy')` ของลิงก์ผู้ปกครอง
     *
     * ★ เดิมบอกแค่ "กรุณาอนุญาต pop-up แล้วลองใหม่" ซึ่งโยนงานกลับให้ครูไปตั้งค่าเบราว์เซอร์
     * และถ้าเป็นไฟล์สำรอง ไฟล์บน Drive จะถูกลบทิ้งก่อนครูกลับมาเสียด้วยซ้ำ
     * → เปลี่ยนเป็นเปิดกล่องที่มี**ลิงก์ให้กดเอง** การกดลิงก์คือ user gesture จริง
     * จึงไม่ถูกบล็อก ครูได้ไฟล์ในคลิกเดียวโดยไม่ต้องแตะการตั้งค่าใดๆ
     *
     * ใช้ร่วมกัน 3 ที่: ไฟล์สำรอง · CSV หน้ารายงาน · แม่แบบหน้านำเข้า
     */
    function openDownloadWindow(url, blockedMessage) {
      var win = window.open(url, '_blank', 'noopener');
      if (win) {
        try { win.opener = null; } catch (e) {}
        return true;
      }
      showBlockedDownloadModal_(url, blockedMessage);
      return false;
    }

    function showBlockedDownloadModal_(url, blockedMessage) {
      var safeUrl = String(url || '');
      if (!safeUrl) {
        if (blockedMessage) toast(blockedMessage, 'error');

      var body = '';
      body += '<p class="text-sm" style="margin-bottom:.75rem">เบราว์เซอร์บล็อกการเปิดหน้าต่างดาวน์โหลดอัตโนมัติ ' +
        '<strong>ไฟล์ถูกเตรียมไว้เรียบร้อยแล้ว</strong> กดปุ่มด้านล่างเพื่อดาวน์โหลดได้เลย</p>';
      body += '<a class="btn btn-primary" style="display:inline-flex;text-decoration:none" ' +
        'href="' + escAttr(safeUrl) + '" target="_blank" rel="noopener" download>' +
        renderUiIcon('download') + ' ดาวน์โหลดไฟล์</a>';
      body += '<div class="settings-note settings-note-stone" style="margin-top:.75rem">' + renderUiIcon('note') +
        '<span>ไฟล์นี้เตรียมไว้ชั่วคราวและจะถูกลบออกจาก Google Drive หลังจากนี้ไม่นาน ' +
        'ถ้ายังไม่ได้กดดาวน์โหลด ให้กดก่อนปิดหน้าต่างนี้</span></div>';

      showModal('ดาวน์โหลดไฟล์', body, [
        { label: 'ปิด', class: 'btn btn-ghost', action: 'closeModal()' }
      ], { initialFocusSelector: '#modal-body a' });
    }

    function getFocusableElements_(container) {
      if (!container) return [];
      return Array.prototype.slice.call(container.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')).filter(function (el) {
        return !el.disabled && el.getAttribute('aria-hidden') !== 'true' && el.offsetParent !== null;
      });
    }

    function handleActiveOverlayKeydown_(event) {
      if (!activeOverlayState || !activeOverlayState.dialogEl) return;

      if (event.key === 'Escape' && activeOverlayState.allowEscape) {
        event.preventDefault();
        if (typeof activeOverlayState.closeFn === 'function') activeOverlayState.closeFn();
        return;
      }

      if (event.key !== 'Tab') return;

      var focusable = getFocusableElements_(activeOverlayState.dialogEl);
      if (!focusable.length) {
        event.preventDefault();
        activeOverlayState.dialogEl.focus();
        return;
      }

      var first = focusable[0];
      var last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }

    function activateOverlayFocus_(overlay, dialogEl, closeFn, options) {
      options = options || {};
      if (activeOverlayState) deactivateOverlayFocus_(false);

      activeOverlayState = {
        overlay: overlay,
        dialogEl: dialogEl || overlay,
        closeFn: closeFn,
        allowEscape: options.allowEscape !== false,
        restoreFocusEl: document.activeElement && typeof document.activeElement.focus === 'function' ? document.activeElement : null
      };

      if (overlay) overlay.setAttribute('aria-hidden', 'false');
      document.addEventListener('keydown', handleActiveOverlayKeydown_, true);

      window.setTimeout(function () {
        if (!activeOverlayState || activeOverlayState.overlay !== overlay) return;
        var target = null;
        if (options.initialFocusSelector && dialogEl && dialogEl.querySelector) {
          target = dialogEl.querySelector(options.initialFocusSelector);
        }
        if (!target) {
          var focusable = getFocusableElements_(dialogEl || overlay);
          target = focusable.length ? focusable[0] : (dialogEl || overlay);
        }
        if (target && typeof target.focus === 'function') target.focus();
      }, 0);
    }

    function deactivateOverlayFocus_(restoreFocus) {
      if (!activeOverlayState) return;
      var prevState = activeOverlayState;
      activeOverlayState = null;
      document.removeEventListener('keydown', handleActiveOverlayKeydown_, true);
      if (prevState.overlay) prevState.overlay.setAttribute('aria-hidden', 'true');
      if (restoreFocus !== false && prevState.restoreFocusEl && typeof prevState.restoreFocusEl.focus === 'function') {
        window.setTimeout(function () {
          try {
            prevState.restoreFocusEl.focus();
          } catch (e) {}
        }, 0);
      }
    }

    function showModal(title, bodyHtml, buttons, options) {
      var overlay = document.getElementById('modal-overlay');
      var dialogEl = document.getElementById('modal-box');
      var titleEl = document.getElementById('modal-title');
      var bodyEl = document.getElementById('modal-body');
      var footerEl = document.getElementById('modal-footer');
      var closeBtn = document.getElementById('modal-close');
      options = options || {};
      if (!overlay || !titleEl || !bodyEl || !footerEl) return;

      titleEl.textContent = title || '';
      bodyEl.innerHTML = bodyHtml || '';
      footerEl.innerHTML = '';
      (buttons || []).forEach(function (btn) {
        var button = document.createElement('button');
        button.className = String(btn.class || 'btn btn-ghost');
        button.type = 'button';
        button.textContent = btn.label || 'ตกลง';
        if (typeof btn.onClick === 'function') {
          button.onclick = function () {
            btn.onClick(button);
          };
        } else {
          button.setAttribute('onclick', String(btn.action || 'closeModal()'));
        }
        footerEl.appendChild(button);
      });

      if (closeBtn) closeBtn.onclick = closeModal;
      overlay.style.display = 'flex';
      overlay.onclick = function (e) {
        if (e.target === overlay && options.closeOnBackdrop !== false) closeModal();
      };
      activateOverlayFocus_(overlay, dialogEl, closeModal, {
        allowEscape: options.allowEscape !== false,
        initialFocusSelector: options.initialFocusSelector || '#modal-body input, #modal-body select, #modal-body textarea, #modal-footer button, #modal-close'
      });
    }

    function closeModal() {
      var overlay = document.getElementById('modal-overlay');
      var titleEl = document.getElementById('modal-title');
      var bodyEl = document.getElementById('modal-body');
      var footerEl = document.getElementById('modal-footer');
      if (!overlay) return;
      overlay.style.display = 'none';
      overlay.onclick = null;
      if (titleEl) titleEl.textContent = '';
      if (bodyEl) bodyEl.innerHTML = '';
      if (footerEl) footerEl.innerHTML = '';
      deactivateOverlayFocus_(true);
    }

    function confirm_dialog(message, onOk) {
      var overlay = document.getElementById('confirm-overlay');
      var dialogEl = document.getElementById('confirm-box');
      var messageEl = document.getElementById('confirm-message');
      var okBtn = document.getElementById('confirm-ok');
      var cancelBtn = document.getElementById('confirm-cancel');
      if (!overlay || !messageEl || !okBtn || !cancelBtn) return;

      messageEl.textContent = message || '';
      overlay.style.display = 'flex';

      function cleanup() {
        overlay.style.display = 'none';
        overlay.onclick = null;
        okBtn.onclick = null;
        cancelBtn.onclick = null;
        deactivateOverlayFocus_(true);
      }

      cancelBtn.onclick = cleanup;
      okBtn.onclick = function () {
        cleanup();
        if (typeof onOk === 'function') onOk();
      };
      overlay.onclick = function (e) {
        if (e.target === overlay) return;
      };
      activateOverlayFocus_(overlay, dialogEl, cleanup, {
        allowEscape: true,
        initialFocusSelector: '#confirm-cancel'
      });
    }

        var d = parseLocalDateString(currentAttendanceDateForNav_());

      // ★ การ์ดสรุปอยู่ **ท้ายหน้า** ส่วนรายการอยู่เหนือมัน

      // (ชิปกลุ่มไม่ต้องเลื่อน เพราะอยู่ติดกับรายการอยู่แล้ว จึงแยกเป็นอีกฟังก์ชัน)
