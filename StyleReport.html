<style>
/* ═══════════════════════════════════════════════════
   Report & Dashboard Styles — StyleReport.html
   ═══════════════════════════════════════════════════ */

/* ─── Grids ────────────────────────────────────── */

.rpt-grid-2 {
  display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;
}

/* ─── Big Numbers ──────────────────────────────── */

.rpt-big-num {
  font-size: 2rem; font-weight: 800; color: var(--stone-800); line-height: 1.2;
}

/* ─── Coverage Today ───────────────────────────── */

.rpt-coverage-today {
  background: linear-gradient(135deg, var(--green-50), #f0fdf8);
  border-color: var(--green-100);
}

/* ─── Delta Badges ─────────────────────────────── */

.rpt-delta {
  display: inline-block; font-size: .65rem; font-weight: 700;
  padding: .125rem .5rem; border-radius: 1rem; margin-top: .25rem;
}
.rpt-delta-up { background: var(--red-50); color: var(--red-700); }
.rpt-delta-down { background: var(--green-50); color: var(--green-700); }
.rpt-delta-same { background: var(--stone-100); color: var(--stone-500); }

/* reversed for present (up = good) */
.summary-green .rpt-delta-up { background: var(--green-50); color: var(--green-700); }
.summary-green .rpt-delta-down { background: var(--red-50); color: var(--red-700); }

/* ─── MoM Grid ─────────────────────────────────── */

.rpt-mom-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: .5rem;
}
.rpt-mom-item {
  padding: .75rem; border-radius: var(--radius);
  border: 1px solid var(--stone-200); background: var(--stone-50);
}

/* ─── Report Tabs ──────────────────────────────── */

.rpt-tabs {
  display: inline-flex;
  gap: .35rem;
  width: fit-content;
  padding: .28rem;
  border-radius: 999px;
  border: 1px solid rgba(91,74,63,.08);
  background: linear-gradient(180deg, rgba(255,255,255,.82), rgba(246,240,233,.88));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.78);
}
.rpt-tab {
  padding: .55rem 1rem;
  border-radius: 999px;
  border: 1px solid transparent;
  background: transparent;
  font-family: inherit;
  font-size: .8rem;
  font-weight: 700;
  color: var(--stone-600);
  cursor: pointer;
  transition: all .18s ease;
}
.rpt-tab:hover {
  background: rgba(255,255,255,.74);
  color: var(--stone-700);
}
.rpt-tab.active {
  background: var(--brown-700);
  color: #fff;
  border-color: rgba(91,74,63,.18);
  box-shadow: 0 10px 20px rgba(91,74,63,.14);
}

/* ─── Totals Bar ───────────────────────────────── */

.rpt-totals-bar {
  display: flex; flex-wrap: wrap; gap: .75rem;
  justify-content: space-around; text-align: center;
}
.rpt-total-item {
  display: flex; flex-direction: column; align-items: center; gap: .125rem;
}
.rpt-total-item .font-bold { font-size: 1.25rem; }
.rpt-total-highlight {
  background: var(--brown-100); padding: .375rem .75rem;
  border-radius: var(--radius); color: var(--brown-800);
}

/* ─── Table ────────────────────────────────────── */

.rpt-table-wrap {
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  border-radius: .75rem; border: 1px solid var(--stone-200);
}
.rpt-table {
  width: 100%; border-collapse: collapse; font-size: .8rem;
}
.rpt-table th {
  background: var(--brown-50); color: var(--brown-800);
  font-weight: 700; font-size: .7rem; text-transform: uppercase;
  padding: .5rem .625rem; text-align: left; white-space: nowrap;
  border-bottom: 2px solid var(--brown-200); position: sticky; top: 0; z-index: 2;
}
.rpt-table td {
  padding: .5rem .625rem; border-bottom: 1px solid var(--stone-100);
  white-space: nowrap;
}
.rpt-table th:first-child,
.rpt-table td:first-child {
  position: sticky;
  left: 0;
  z-index: 3;
  background: #fff;
  box-shadow: 1px 0 0 var(--stone-200);
}
.rpt-table thead th:first-child {
  background: var(--brown-50);
  z-index: 4;
}
.rpt-table tbody tr:hover { background: var(--stone-50); }
.rpt-table tbody tr:hover td:first-child { background: var(--stone-50); }
.rpt-row-warning { background: var(--red-50) !important; }
.rpt-row-warning:hover { background: #fde8e8 !important; }
.rpt-row-warning td:first-child { background: var(--red-50); }
.rpt-row-warning:hover td:first-child { background: #fde8e8; }

.rpt-holiday {
  background: #eef2ff !important;
  color: var(--indigo-800);
}

/* เช็คแล้วแต่ยังไม่ยืนยัน — ต้องไม่หน้าตาเหมือนช่องที่ไม่มีข้อมูลเลย */
.rpt-draft {
  background: var(--amber-50);
  color: var(--amber-700, #b45309);
  font-weight: 700;
}

.rpt-legend {
  display: flex;
  flex-wrap: wrap;
  gap: .5rem 1.1rem;
  margin-top: .75rem;
  font-size: .8rem;
  color: var(--stone-600, #57534e);
}
.rpt-legend-item {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
}
.rpt-legend-key {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 1.4rem;
  height: 1.4rem;
  border-radius: .4rem;
  background: var(--stone-100, #f5f5f4);
  font-weight: 700;
}
.rpt-legend-key-draft {
  background: var(--amber-50);
  color: var(--amber-700, #b45309);
}

/* รายชื่อวันที่ยังไม่ได้ยืนยัน ในการ์ดแจ้งเตือนปฏิทิน */
.reports-missing-confirmed {
  margin-top: 1rem;
  padding: .85rem .95rem;
  border-radius: .9rem;
  background: var(--stone-50, #fafaf9);
  border: 1px solid rgba(91,74,63,.08);
}
.reports-missing-confirmed-title {
  font-weight: 700;
  margin-bottom: .3rem;
}
.reports-missing-confirmed-list {
  font-size: .88rem;
  line-height: 1.65;
}
.reports-missing-confirmed-note {
  margin-top: .45rem;
  font-size: .82rem;
  color: var(--stone-600, #57534e);
  line-height: 1.6;
}

.reports-holiday-conflict-actions {
  display: flex;
  flex-wrap: wrap;
  gap: .45rem;
}

.reports-day-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: .15rem .45rem;
  border-radius: 999px;
  background: var(--indigo-50);
  color: var(--indigo-700);
  font-size: .62rem;
  font-weight: 700;
  line-height: 1.2;
  white-space: nowrap;
}

.reports-holiday-alert {
  border: 1px solid var(--amber-200);
  background: linear-gradient(180deg, #fffdf7, #fffaf0);
}

.reports-section .alert {
  display: flex;
  align-items: flex-start;
  gap: .55rem;
}

.reports-section .alert svg {
  width: 1rem;
  height: 1rem;
  min-width: 1rem;
  min-height: 1rem;
  margin-top: .1rem;
  display: block;
  flex: 0 0 auto;
}

.reports-section .alert span {
  min-width: 0;
  flex: 1 1 auto;
}

.reports-empty-state {
  max-width: 100%;
  padding: 1.5rem 1.25rem;
}

.reports-empty-state .empty-icon {
  width: 4.25rem;
  height: 4.25rem;
  margin-inline: auto;
  margin-bottom: .9rem;
  overflow: hidden;
  flex: 0 0 auto;
}

.reports-empty-state .empty-icon svg {
  width: 2rem;
  height: 2rem;
  max-width: 2rem;
  max-height: 2rem;
  display: block;
  flex: 0 0 auto;
}

.reports-empty-state .empty-title {
  font-size: 1rem;
}

.reports-empty-state .empty-desc {
  max-width: 32rem;
}

.reports-holiday-conflicts {
  display: flex;
  flex-direction: column;
  gap: .75rem;
}

.reports-holiday-conflict-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: .85rem 1rem;
  border-radius: .9rem;
  background: rgba(255,255,255,.9);
  border: 1px solid var(--stone-200);
}

.reports-holiday-conflict-date {
  font-weight: 800;
  color: var(--stone-800);
}

.reports-holiday-conflict-meta {
  margin-top: .2rem;
  font-size: .82rem;
  color: var(--stone-600);
}

/* ─── Inline Bar ───────────────────────────────── */

.rpt-bar-inline {
  display: inline-block; width: 60px; height: 6px;
  background: var(--stone-200); border-radius: 3px; position: relative;
  vertical-align: middle;
}
.rpt-bar-inline::after {
  content: ''; position: absolute; left: 0; top: 0; height: 100%;
  width: var(--pct, 0%); background: var(--green-500); border-radius: 3px;
}
.rpt-row-warning .rpt-bar-inline::after { background: var(--red-500); }

/* ─── Chart Wrap ───────────────────────────────── */

.rpt-chart-wrap { position: relative; height: 280px; }

.reports-shell {
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}
.reports-hero {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(320px, .9fr);
  gap: 1.25rem;
  align-items: center;
  padding: clamp(1.4rem, 3vw, 2rem);
  border-radius: 2rem;
  overflow: hidden;
  isolation: isolate;
  border: 1px solid rgba(91,74,63,.1);
  background:
    radial-gradient(circle at top right, rgba(255,255,255,.86), rgba(255,255,255,0) 35%),
    radial-gradient(circle at left bottom, rgba(168,142,114,.18), rgba(168,142,114,0) 32%),
    linear-gradient(135deg, #f7efe7 0%, #efe1d3 48%, #e2d2c0 100%);
  box-shadow: 0 18px 36px rgba(91,74,63,.12);
}
.reports-hero::before {
  content: '';
  position: absolute;
  inset: 1px;
  border-radius: calc(2rem - 1px);
  background: linear-gradient(180deg, rgba(255,255,255,.24), rgba(255,255,255,0));
  pointer-events: none;
}
.reports-hero::after {
  content: '';
  position: absolute;
  inset: auto -10% -35% auto;
  width: 320px;
  height: 320px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(122,98,79,.1), rgba(122,98,79,0) 68%);
  pointer-events: none;
}
.reports-hero-copy,
.reports-hero-side {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: .8rem;
}
.reports-kicker {
  font-size: .8rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--brown-700);
}
.reports-title {
  font-size: clamp(2rem, 5vw, 3.8rem);
  line-height: .95;
  font-weight: 800;
  color: var(--brown-900);
}
.reports-subtitle {
  font-size: .96rem;
  line-height: 1.58;
  color: var(--stone-700);
  max-width: 40ch;
}
.reports-context {
  display: inline-flex;
  align-items: center;
  width: fit-content;
  max-width: 100%;
  min-height: 2rem;
  padding: .4rem .78rem;
  border-radius: 999px;
  background: rgba(255,255,255,.58);
  border: 1px solid rgba(91,74,63,.08);
  font-size: .82rem;
  font-weight: 700;
  color: var(--stone-600);
}
.reports-hero-meta {
  display: flex;
  flex-direction: column;
  gap: .55rem;
}
.reports-role-badge {
  display: inline-flex;
  align-items: center;
  width: fit-content;
  max-width: 44ch;
  padding: .48rem .72rem;
  border-radius: 999px;
  background: rgba(255,255,255,.74);
  border: 1px solid rgba(91,74,63,.1);
  font-size: .77rem;
  font-weight: 700;
  line-height: 1.45;
  color: var(--brown-800);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.72);
}
.reports-tab-shell {
  display: flex;
  align-items: flex-start;
}
.reports-tabs {
  flex-wrap: wrap;
}
.reports-control-panel,
.reports-surface {
  background: rgba(255,255,255,.84);
  border: 1px solid rgba(91,74,63,.08);
  box-shadow: var(--shadow);
}
.reports-control-panel {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  display: flex;
  flex-direction: column;
  gap: .95rem;
  border-radius: 1.5rem;
  padding: 1.05rem 1.05rem 1rem;
}
.reports-control-panel::before,
.reports-surface::before,
.dashboard-panel::before,
.dashboard-metric-panel::before,
.dashboard-mom-panel::before,
.dashboard-surface::before {
  content: '';
  position: absolute;
  inset: 1px 1px auto 1px;
  height: 64px;
  border-radius: inherit;
  background: linear-gradient(180deg, rgba(255,255,255,.32), rgba(255,255,255,0));
  pointer-events: none;
}
.reports-control-head,
.reports-section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
}
.reports-control-kicker {
  font-size: .74rem;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--stone-500);
}
.reports-control-title {
  margin-top: .2rem;
  font-size: 1rem;
  font-weight: 800;
  color: var(--stone-800);
}
.reports-control-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  gap: .65rem;
  align-items: center;
}
.reports-control-row .date-input {
  width: 100%;
}
.reports-range-sep {
  font-size: .8rem;
  font-weight: 700;
  color: var(--stone-500);
}
.reports-control-actions {
  display: flex;
  flex-wrap: wrap;
  gap: .5rem;
  padding-top: .85rem;
  border-top: 1px solid rgba(91,74,63,.08);
}
.reports-control-actions-primary {
  padding-top: 0;
  border-top: none;
}
.reports-control-actions-secondary {
  padding-top: .85rem;
}
.reports-control-hint {
  font-size: .82rem;
  line-height: 1.55;
  color: var(--stone-500);
}
.reports-range-note {
  font-size: .82rem;
  font-weight: 600;
  line-height: 1.6;
  max-width: 46ch;
  color: var(--stone-500);
}
.reports-spotlight {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  padding: .9rem 1rem;
  border-radius: 1.35rem;
  border: 1px solid rgba(91,74,63,.08);
  background: linear-gradient(135deg, rgba(255,255,255,.94), rgba(247,241,235,.9));
  box-shadow: 0 12px 22px rgba(91,74,63,.06);
}
.reports-spotlight::before,
.reports-metric-card::before {
  content: '';
  position: absolute;
  inset: 1px 1px auto 1px;
  height: 56px;
  border-radius: inherit;
  background: linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,0));
  pointer-events: none;
}
.reports-spotlight-summary {
  background: linear-gradient(135deg, #fffaf4, #ffffff 72%);
}
.reports-spotlight-daily {
  background: linear-gradient(135deg, #f8fbff, #ffffff 72%);
}
.reports-spotlight-kicker {
  font-size: .72rem;
  font-weight: 800;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--brown-700);
}
.reports-spotlight-title {
  margin-top: .3rem;
  font-size: 1.05rem;
  font-weight: 800;
  color: var(--stone-800);
}
.reports-spotlight-text {
  margin-top: .28rem;
  font-size: .86rem;
  line-height: 1.5;
  color: var(--stone-700);
}
.reports-spotlight-meta {
  margin-top: .28rem;
  font-size: .8rem;
  line-height: 1.5;
  color: var(--stone-500);
}
.reports-section {
  display: flex;
  flex-direction: column;
  gap: .9rem;
}
.reports-section-title {
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--stone-800);
}
.reports-section-text {
  margin-top: .2rem;
  font-size: .86rem;
  color: var(--stone-500);
  max-width: 60ch;
}
.reports-metric-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 1rem;
}
.reports-metric-card {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  min-height: 110px;
  padding: 1.05rem;
  border-radius: 1.35rem;
  border: 1px solid rgba(91,74,63,.08);
  transition: transform .18s ease, box-shadow .18s ease;
}
.reports-metric-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}
.reports-metric-icon {
  width: 2.4rem;
  height: 2.4rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: .9rem;
  background: rgba(255,255,255,.72);
}
.reports-metric-icon svg {
  width: 1.2rem;
  height: 1.2rem;
}
.reports-metric-value {
  margin-top: .85rem;
  font-size: 1.7rem;
  line-height: 1;
  font-weight: 800;
  color: var(--stone-800);
}
.reports-metric-label {
  margin-top: .35rem;
  font-size: .8rem;
  font-weight: 700;
  color: var(--stone-600);
}
.reports-metric-green { background: linear-gradient(135deg, var(--green-50), #fbfffc); }
.reports-metric-amber { background: linear-gradient(135deg, var(--amber-50), #fffdf7); }
.reports-metric-red { background: linear-gradient(135deg, var(--red-50), #fffafa); }
.reports-metric-blue { background: linear-gradient(135deg, var(--blue-50), #fbfdff); }
.reports-metric-indigo { background: linear-gradient(135deg, var(--indigo-50), #fbfbff); }
.reports-metric-stone { background: linear-gradient(135deg, var(--stone-100), #ffffff); }
.reports-surface {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  border-radius: 1.5rem;
  box-shadow: 0 16px 28px rgba(91,74,63,.08);
}
.reports-watch-empty {
  padding: 1rem 1.1rem;
}
.reports-watch-empty-title {
  font-size: 1rem;
  font-weight: 800;
  color: var(--stone-800);
}
.reports-split-grid > .reports-surface {
  height: 100%;
}
.reports-empty-note {
  font-size: .82rem;
  color: var(--stone-500);
  line-height: 1.7;
}
.reports-spotlight,
.reports-control-panel,
.reports-surface {
  backdrop-filter: blur(10px);
}
.reports-daily-metrics .reports-metric-value {
  font-size: 1.35rem;
}

.reports-summary-brief {
  display: grid;
  grid-template-columns: minmax(0, 1.3fr) auto;
  gap: 1rem;
  align-items: center;
  padding: 1.1rem 1.15rem;
  border-radius: 1.5rem;
  border: 1px solid rgba(91,74,63,.08);
  box-shadow: 0 18px 36px rgba(91,74,63,.08);
}

.reports-summary-brief-red {
  background: linear-gradient(135deg, #fff7f7, #ffffff 72%);
}

.reports-summary-brief-amber {
  background: linear-gradient(135deg, #fffaf1, #ffffff 72%);
}

.reports-summary-brief-green {
  background: linear-gradient(135deg, #f4fbf6, #ffffff 72%);
}

.reports-summary-brief-copy {
  display: flex;
  flex-direction: column;
  gap: .6rem;
}

.reports-summary-brief-kicker {
  margin: 0;
  font-size: .78rem;
  font-weight: 800;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--brown-700);
}

.reports-summary-brief-title {
  margin: 0;
  font-size: 1.2rem;
  line-height: 1.35;
  font-weight: 800;
  color: var(--stone-900);
}

.reports-summary-brief-text {
  margin: 0;
  font-size: .96rem;
  line-height: 1.7;
  color: var(--stone-700);
  max-width: 68ch;
}

.reports-summary-brief-tags {
  display: flex;
  flex-wrap: wrap;
  gap: .5rem;
}

.reports-summary-tag {
  display: inline-flex;
  align-items: center;
  min-height: 2rem;
  padding: .4rem .72rem;
  border-radius: 999px;
  background: rgba(255,255,255,.88);
  border: 1px solid rgba(91,74,63,.08);
  font-size: .8rem;
  font-weight: 700;
  color: var(--stone-700);
}

.reports-summary-brief-actions {
  display: flex;
  flex-direction: column;
  gap: .55rem;
  align-items: stretch;
}

.reports-summary-empty-card {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 1rem;
  align-items: center;
  padding: 1rem 1.1rem;
}

.reports-summary-empty-copy {
  display: flex;
  flex-direction: column;
  gap: .5rem;
}

.reports-summary-empty-title {
  font-size: 1.05rem;
  font-weight: 800;
  color: var(--stone-800);
}

.reports-summary-empty-text {
  margin: 0;
  font-size: .9rem;
  line-height: 1.6;
  color: var(--stone-600);
  max-width: 52ch;
}

.reports-summary-empty-meta {
  display: flex;
  flex-wrap: wrap;
  gap: .45rem;
}

.reports-summary-empty-pill {
  display: inline-flex;
  align-items: center;
  min-height: 2rem;
  padding: .35rem .7rem;
  border-radius: 999px;
  background: rgba(255,255,255,.88);
  border: 1px solid rgba(91,74,63,.08);
  font-size: .8rem;
  font-weight: 700;
  color: var(--stone-700);
}

.reports-summary-empty-actions {
  display: flex;
  flex-direction: column;
  gap: .55rem;
}

.reports-print-hints {
  display: flex;
  flex-direction: column;
  gap: .55rem;
  margin-top: .75rem;
}

.reports-print-hints .alert {

.dashboard-panel,
.dashboard-metric-panel,
.dashboard-mom-panel,

.dashboard-mom-item:hover,
.dashboard-setup-item:hover,
.dashboard-panel:hover,

.dashboard-stat-icon {

  height: 2.5rem;
  border-radius: .9rem;

  justify-content: center;
  background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.72));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.78), 0 10px 18px rgba(91,74,63,.08);

}
.dashboard-stat-count {

.dashboard-stat-label {

}
.dashboard-stat-green { background: linear-gradient(135deg, var(--green-50), #f7fff9); }
.dashboard-stat-amber { background: linear-gradient(135deg, var(--amber-50), #fffaf0); }
.dashboard-stat-red { background: linear-gradient(135deg, var(--red-50), #fff6f6); }
.dashboard-stat-blue { background: linear-gradient(135deg, var(--blue-50), #f7fbff); }
.dashboard-stat-indigo { background: linear-gradient(135deg, var(--indigo-50), #f7f7ff); }
.dashboard-stat-stone { background: linear-gradient(135deg, var(--stone-100), #fbfbfa); }
.dashboard-side-stack,
.dashboard-stack {

  flex-direction: column;
  gap: 1rem;
}
.dashboard-zero-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1rem;
}
.dashboard-zero-panel {

  flex-direction: column;
  gap: .7rem;
  min-height: 210px;
  padding: 1.15rem;

  border: 1px solid rgba(91,74,63,.08);
  background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(248,244,239,.92));

.dashboard-zero-icon,
.dashboard-surface-empty-icon {

  height: 2.8rem;

  align-items: center;
  justify-content: center;
  border-radius: .95rem;
  background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(248,244,239,.92));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.76), 0 10px 18px rgba(91,74,63,.08);

.dashboard-zero-icon svg,
.dashboard-surface-empty-icon svg {

}
.dashboard-zero-kicker {

  font-weight: 800;

  text-transform: uppercase;
  color: var(--brown-700);
}
.dashboard-zero-title,
.dashboard-surface-empty-title {
  font-size: 1.02rem;
  line-height: 1.3;
  font-weight: 800;
  color: var(--stone-800);
}
.dashboard-zero-text,
.dashboard-surface-empty-text {
  font-size: .87rem;
  line-height: 1.6;
  color: var(--stone-600);
}
.dashboard-zero-actions {
  margin-top: auto;
}
.dashboard-surface-empty {
  display: flex;
  flex-direction: column;
  gap: .65rem;
  align-items: flex-start;
  justify-content: center;
  min-height: 200px;
}
.dashboard-metric-panel {
  border-radius: 1.5rem;
  padding: 1.1rem 1.1rem 1rem;
}
.dashboard-metric-good {
  background: linear-gradient(135deg, #eefbf2, #ffffff 76%);
}
.dashboard-metric-kicker {
  font-size: .75rem;
  font-weight: 700;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--stone-500);
}
.dashboard-metric-value {
  margin-top: .25rem;
  font-size: 2rem;
  line-height: 1;
  font-weight: 800;
  color: var(--stone-800);
}
.dashboard-metric-text {
  margin-top: .75rem;
  font-size: .85rem;
  color: var(--stone-600);
}
.dashboard-month-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.3fr) minmax(280px, .9fr);
  gap: 1rem;
}
.dashboard-kpi-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: .75rem;
}
.dashboard-kpi-card {
  position: relative;
  overflow: hidden;
  padding: 1rem;
  border-radius: 1.35rem;
  border: 1px solid rgba(91,74,63,.08);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.72);
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.dashboard-kpi-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .5rem;
}
.dashboard-kpi-category {
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--stone-500);
}
.dashboard-kpi-icon {
  font-size: 1.15rem;
}
.dashboard-kpi-count {
  margin-top: .85rem;
  font-size: 1.8rem;
  line-height: 1;
  font-weight: 800;

}
.dashboard-kpi-label {
  margin-top: .35rem;
  font-size: .82rem;
  font-weight: 700;
  color: var(--stone-600);
}
.dashboard-kpi-green { background: linear-gradient(135deg, var(--green-50), #fbfffc); }
.dashboard-kpi-amber { background: linear-gradient(135deg, var(--amber-50), #fffdf7); }
.dashboard-kpi-red { background: linear-gradient(135deg, var(--red-50), #fffafa); }
.dashboard-kpi-blue { background: linear-gradient(135deg, var(--blue-50), #fbfdff); }
.dashboard-kpi-indigo { background: linear-gradient(135deg, var(--indigo-50), #fbfbff); }
.dashboard-kpi-stone { background: linear-gradient(135deg, #f5f3f0, #ffffff 72%); }
.dashboard-mom-panel {
  border-radius: 1.5rem;
  padding: 1rem;
}
.dashboard-mom-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: .75rem;
  margin-top: .75rem;
}
.dashboard-mom-item {
  padding: .85rem;
  border-radius: 1rem;
  background: linear-gradient(180deg, rgba(255,255,255,.94), rgba(248,244,239,.92));
  border: 1px solid rgba(91,74,63,.08);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.72);
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.dashboard-mom-label {
  font-size: .78rem;
  font-weight: 700;
  color: var(--stone-500);
}
.dashboard-mom-value {
  margin-top: .35rem;
  font-size: 1.35rem;
  line-height: 1;
  font-weight: 800;
  color: var(--stone-800);
}
.dashboard-mom-prev {
  margin-top: .3rem;
  font-size: .75rem;
  color: var(--stone-400);
}
.dashboard-surface {
  border-radius: 1.5rem;
}

@keyframes dashboardFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

/* ─── Compact List ─────────────────────────────── */

.rpt-compact-list { display: flex; flex-direction: column; gap: .375rem; }
.rpt-compact-item {
  display: flex; align-items: center; gap: .5rem;
  padding: .5rem .75rem; border-radius: .75rem;
  border: 1px solid var(--stone-200); background: white;
}
.rpt-compact-medal { font-size: 1.1rem; flex-shrink: 0; }
.rpt-compact-rank {
  width: 1.5rem; height: 1.5rem; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--stone-100); border-radius: .375rem;
  font-size: .7rem; font-weight: 800; color: var(--stone-600);
}
.rpt-compact-info { flex: 1; min-width: 0; font-size: .8rem; }
.rpt-compact-badge {
  padding: .2rem .5rem; border-radius: .5rem;
  font-size: .7rem; font-weight: 700; white-space: nowrap; flex-shrink: 0;
}

/* ─── Reasons ──────────────────────────────────── */

.rpt-reasons { display: flex; flex-wrap: wrap; gap: .375rem; }
.rpt-reason {
  display: inline-flex; align-items: center; gap: .25rem;
  padding: .25rem .625rem; border-radius: 2rem;
  font-size: .7rem; font-weight: 600;
}

/* ─── Daily Grid ───────────────────────────────── */

.rpt-daily-scroll { max-height: 70vh; overflow: auto; }

/* position: sticky บนเซลล์ตารางใช้ร่วมกับ border-collapse: collapse ไม่ได้
   เบราว์เซอร์วาดพื้นหลังของเซลล์ที่ตรึงไว้ไม่ครบ เนื้อหาที่เลื่อนผ่านจึงทะลุขึ้นมา
   เห็นเป็นแถบคั่นระหว่างคอลัมน์ "เลขที่" กับ "ชื่อ" ทั้งในหัวตารางและแถวข้อมูล
   (เลขที่ | .ค | ชื่อ  และ  1 | - | ด.ช.กิตติพงศ์ ใจดี)
   ตั้งเฉพาะตารางรายวันซึ่งเป็นตารางเดียวที่มีคอลัมน์ตรึง ตารางอื่นไม่ต้องแตะ */
.rpt-daily-table {
  border-collapse: separate;
  border-spacing: 0;
}

.rpt-daily-table th, .rpt-daily-table td { text-align: center; padding: .375rem .5rem; min-width: 2.5rem; }
.rpt-sticky-col {
  position: sticky; left: 0; z-index: 3;
  background: white; min-width: 3rem; border-right: 1px solid var(--stone-200);
}
.rpt-sticky-col2 {
  position: sticky; left: 3rem; z-index: 3;
  background: white; min-width: 80px; border-right: 1px solid var(--stone-200);
}
/* ต้องอยู่เหนือหัวคอลัมน์วันที่ที่เลื่อนลอดไปด้านหลัง ไม่งั้นข้อความวันที่โผล่ทับ
   ("เลขที่ . 1" และ "2569" ลอยอยู่ระหว่างคอลัมน์ชื่อกับคอลัมน์วันแรก) */
thead .rpt-sticky-col, thead .rpt-sticky-col2 {
  background: var(--brown-50);
  z-index: 6;
}
/* กันข้อความวันที่ล้นออกนอกเซลล์ตัวเองไปทับคอลัมน์ที่ตรึงไว้ */
.rpt-day-header {
  font-size: .6rem;
  white-space: nowrap;
  overflow: hidden;
}
.rpt-day-cell {
  font-size: .85rem;
}
.rpt-day-cell svg {
  width: 1rem;
  height: 1rem;
  vertical-align: middle;
}
.rpt-day-green { background: var(--green-50); }
.rpt-day-amber { background: var(--amber-50); }
.rpt-day-red { background: var(--red-50); }
.rpt-day-blue { background: var(--blue-50); }
.rpt-day-indigo { background: var(--indigo-50); }
.rpt-weekend { background: var(--stone-50); color: var(--stone-400); }

/* ─── Print ────────────────────────────────────── */

@media print {
  .nav-bar, .mobile-bottom-nav, .rpt-tabs, .date-nav, .btn,
  .toast-container, .modal-overlay { display: none !important; }
  .main-content { padding: 0; max-width: none; }
  .card { break-inside: avoid; box-shadow: none; border: 1px solid #ddd; }
  .rpt-chart-wrap { height: 200px; }
  body { background: white; }
}
