<script>
  (function () {
    'use strict';

    var analyticsMonth = '';
    var analyticsData = {};
    var analyticsLoadStatus = {};
    var S, E;

    function init(state) {
      S = state || window.AppState || {};
      E = window.AppShared || {};
    }

    function safeArray(items) {
      return Array.isArray(items) ? items : [];
    }

    function getWeekdayRatesData(data) {
      return safeArray(data && (data.weekday_absence_rates || data.weekdayRates || data.weekday_rates));
    }

    function getDefaultAnalyticsMonth() {
      if (analyticsMonth) return analyticsMonth;
      if (S && S.analyticsMonth) return S.analyticsMonth;
      if (S && S.reportMonth) return S.reportMonth;
      if (E && typeof E.todayMonthStr === 'function') return String(E.todayMonthStr() || '');
      if (E && typeof E.todayStr === 'function') return String(E.todayStr() || '').slice(0, 7);
      return '';
    }

    function renderLoadingState(message) {
      return '<div class="analytics-shell"><div class="card analytics-surface analytics-loading"><div class="analytics-loading-icon">' + renderAnalyticsIcon('chart') + '</div><div class="analytics-loading-title">กำลังสรุปแนวโน้มของห้องเรียน</div><p class="analytics-empty-note"><span>' + esc(message || 'กำลังเตรียมข้อมูลล่าสุด...') + '</span></p></div></div>';
    }

    function renderLoading() {
      init();
      var panel = document.getElementById('page-analytics');
      if (!panel) return;
      panel.innerHTML = '<div class="skeleton-page">' +
        '<div class="skeleton-hero">' +
        '<div class="skeleton-line" style="width:120px"></div>' +
        '<div class="skeleton-line skeleton-line-xl" style="width:44%"></div>' +
        '<div class="skeleton-line skeleton-line-lg" style="width:72%"></div>' +
        '<div class="empty-next-step" data-page-loading-note="true" hidden><div class="empty-next-step-title">กำลังโหลด</div><div class="empty-next-step-text">กำลังสรุปแนวโน้ม ความเสี่ยง และรูปแบบการขาดของเดือนนี้</div></div>' +
        '</div>' +
        '<div class="skeleton-grid">' +
        '<div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>' +
        '</div>' +
        '<div class="skeleton-grid">' +
        '<div class="skeleton-card skeleton-card-wide"></div><div class="skeleton-card skeleton-card-wide"></div><div class="skeleton-card skeleton-card-wide"></div>' +
        '</div>' +
        '</div>';
    }

    // ★ ต้องเช็ค null/undefined ไม่ใช่ `if (!str)` — ไม่งั้นเลข 0 จะกลายเป็นสตริงว่าง
    // และต้อง escape " กับ ' ด้วย เพราะทุกที่ในโปรเจกต์ยัดค่าลง attribute ด้วย string concat
    function esc(str) {
    if (str === null || str === undefined) return '';
    var div = document.createElement('div');
    div.textContent = String(str);
    return div.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function getPercentValue(value) {
      if (value === null || value === undefined || value === '') return null;
      var num = Number(value);
      return isFinite(num) ? num : null;
    }

    function formatPercentNumber(value) {
      var pct = getPercentValue(value);
      if (pct === null) return null;
      var rounded = Math.round(pct * 10) / 10;
      return Math.abs(rounded - Math.round(rounded)) < 0.05 ? String(Math.round(rounded)) : rounded.toFixed(1);
    }

    function formatPercentLabel(value) {
      var pct = formatPercentNumber(value);
      return pct === null ? '-' : pct + '%';
    }

    function formatSignedPercentDelta(value) {
      var pct = getPercentValue(value);
      if (pct === null) return '0%';
      var sign = pct > 0 ? '+' : (pct < 0 ? '-' : '');
      var absText = formatPercentNumber(Math.abs(pct));
      return sign + (absText || '0') + '%';
    }

    function renderAnalyticsIcon(kind) {
      var svg = '';
      if (kind === 'target') {
        svg = '<circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="4"></circle><path d="M12 4v2"></path><path d="M12 18v2"></path><path d="M4 12h2"></path><path d="M18 12h2"></path>';
      } else if (kind === 'trend-up') {
        svg = '<path d="M3 17h18"></path><path d="m6 14 4-4 3 3 5-6"></path><path d="M15 7h3v3"></path>';
      } else if (kind === 'trend-down') {
        svg = '<path d="M3 17h18"></path><path d="m6 9 4 4 3-3 5 6"></path><path d="M15 16h3v-3"></path>';
      } else if (kind === 'calendar') {
        svg = '<path d="M8 2v4"></path><path d="M16 2v4"></path><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M3 10h18"></path>';
      } else if (kind === 'balance') {
        svg = '<path d="M12 3v18"></path><path d="M6 7h12"></path><path d="m7.5 7-3 6h6l-3-6z"></path><path d="m16.5 7-3 6h6l-3-6z"></path><path d="M9 21h6"></path>';
      } else if (kind === 'success') {
        svg = '<circle cx="12" cy="12" r="9"></circle><path d="m8.5 12 2.5 2.5 4.5-5"></path>';
      } else if (kind === 'flag') {
        svg = '<path d="M4 21V4"></path><path d="M4 4h12l-2.5 4L16 12H4"></path>';
      } else if (kind === 'chart') {
        svg = '<path d="M3 3v18h18"></path><path d="M8 14v4"></path><path d="M12 10v8"></path><path d="M16 6v12"></path>';
      } else if (kind === 'search') {
        svg = '<circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path>';
      } else if (kind === 'chain') {
        svg = '<path d="M10 13a5 5 0 0 1 0-7l1.5-1.5a5 5 0 0 1 7 7L17 13"></path><path d="M14 11a5 5 0 0 1 0 7L12.5 19.5a5 5 0 0 1-7-7L7 11"></path>';
      } else if (kind === 'male') {
        svg = '<circle cx="10" cy="14" r="5"></circle><path d="M14 10 20 4"></path><path d="M15 4h5v5"></path>';
      } else if (kind === 'female') {
        svg = '<circle cx="12" cy="10" r="5"></circle><path d="M12 15v7"></path><path d="M9 19h6"></path>';
      }
      if (!svg) return '';
      return '<span class="inline-ui-icon" aria-hidden="true"><svg viewBox="0 0 24 24">' + svg + '</svg></span>';
    }

    function renderAnalyticsLoadAlert() {
      var failedKeys = Object.keys(analyticsLoadStatus).filter(function (key) {
        return analyticsLoadStatus[key] === false;
      });
      if (!failedKeys.length) return '';

      var labels = {
        risk: 'ดัชนีความเสี่ยง',
        trend: 'เทียบกับเดือนก่อน',
        patterns: 'รูปแบบการขาด',
        gender: 'วิเคราะห์ตามเพศ'
      };
      var failedLabels = failedKeys.map(function (key) {
        return labels[key] || key;
      });
      return '<div class="alert alert-warning" style="margin-bottom:1rem">' +
        '<strong>ยังโหลดข้อมูลวิเคราะห์บางส่วนไม่สำเร็จ</strong> ตอนนี้ส่วนที่ยังไม่พร้อมคือ ' + esc(failedLabels.join(', ')) + ' และผลวิเคราะห์บางบล็อกอาจยังไม่ครบ' +
        '<div class="empty-next-step" style="margin-top:.75rem">' +
        '<div class="empty-next-step-title">สิ่งที่ควรทำต่อ</div>' +
        '<div class="empty-next-step-text">ลองโหลดหน้าใหม่อีกครั้ง ถ้ายังไม่ขึ้น ให้กลับไปยืนยันวันเช็คชื่อของเดือนนี้เพิ่มก่อน แล้วค่อยกลับมาดูการวิเคราะห์ใหม่</div>' +
        '</div>' +
        '</div>';
    }

    function normalizePayload(d) {
      if (!d) return {};
      if (d.success === true && d.data) return d.data;
      return d;
    }

    function hasWeekdayMeasurementData(data) {
      return getWeekdayRatesData(data).some(function (item) {
        return Number(item.total || 0) > 0;
      });
    }

    function hasTrendMeasurementData(data) {
      return safeArray(data && data.all).some(function (item) {
        return Number(item.cur_total || 0) > 0 || Number(item.prev_total || 0) > 0;
      });
    }

    function hasGenderMeasurementData(data) {
      var male = data && data.male ? data.male : {};
      var female = data && data.female ? data.female : {};
      var unspecified = data && data.unspecified ? data.unspecified : {};
      var maleTotal = Number(male.stats && male.stats.total || 0);
      var femaleTotal = Number(female.stats && female.stats.total || 0);
      var unspecifiedTotal = Number(unspecified.stats && unspecified.stats.total || 0);
      return (maleTotal + femaleTotal + unspecifiedTotal) > 0;
    }

    function hasAnalyticsMeasurementData_() {
      var trend = normalizePayload(analyticsData.trend);
      var patterns = normalizePayload(analyticsData.patterns);
      var gender = normalizePayload(analyticsData.gender);
      return hasTrendMeasurementData(trend) || hasWeekdayMeasurementData(patterns) || hasGenderMeasurementData(gender);
    }

    // ★★ ฝั่ง server ตัดรายการก่อนส่ง (RISK_LIST_LIMIT / TREND_LIST_LIMIT / PATTERN_LIST_LIMIT)
    // "จำนวนคน" ต้องอ่านจากฟิลด์ *_total เท่านั้น ห้ามใช้ list.length เพราะจะได้เพดานไม่ใช่ข้อเท็จจริง
    function totalCountOf_(payload, totalKey, list) {
      var raw = payload ? payload[totalKey] : null;
      if (raw === 0 || (raw && isFinite(Number(raw)))) return Number(raw);
      return safeArray(list).length;
    }

    // "แสดง 15 จาก 21 คน" — ขึ้นเฉพาะตอนที่ถูกตัดจริง
    function renderTruncationNote_(shown, total) {
      if (!(total > shown)) return '';
      return '<p class="analytics-section-text">แสดง ' + shown + ' จาก ' + total + ' คน · เรียงจากที่ควรดูก่อน</p>';
    }

    function getAnalyticsSalesContext_() {
      var risk = normalizePayload(analyticsData.risk);
      var trend = normalizePayload(analyticsData.trend);
      var patterns = normalizePayload(analyticsData.patterns);
      var gender = normalizePayload(analyticsData.gender);
      var riskItems = safeArray(risk.items);
      var improved = safeArray(trend.improved);
      var declined = safeArray(trend.declined);
      var weekdayRates = getWeekdayRatesData(patterns);
      var monFri = safeArray(patterns.mon_fri_pattern || patterns.mon_fri_students);
      var streaks = safeArray(patterns.consecutive_streaks || patterns.streaks);
      var peakDay = null;
      var highRiskCount = 0;

      weekdayRates.forEach(function (item) {
        if (!peakDay || Number(item.rate || 0) > Number(peakDay.rate || 0)) peakDay = item;
      });
      riskItems.forEach(function (item) {
        if ((item.risk_color || '') === 'red') highRiskCount += 1;
      });

      return {
        risk: risk,
        trend: trend,
        patterns: patterns,
        gender: gender,
        monthLabel: risk.month_th || trend.month_th || patterns.month_th || gender.month_th || analyticsMonth,
        rangeFromTh: risk.from_th || trend.from_th || patterns.from_th || gender.from_th || '',
        rangeToTh: risk.to_th || trend.to_th || patterns.to_th || gender.to_th || '',
        riskItems: riskItems,
        riskTotal: totalCountOf_(risk, 'total_count', riskItems),
        monFriTotal: totalCountOf_(patterns, 'mon_fri_pattern_total', monFri),
        streaksTotal: totalCountOf_(patterns, 'consecutive_streaks_total', streaks),
        improvedTotal: totalCountOf_(trend, 'improved_total', improved),
        declinedTotal: totalCountOf_(trend, 'declined_total', declined),
        measurementDays: Number(risk.measurement_days || trend.cur_measurement_days || 0),
        prevMeasurementDays: Number(trend.prev_measurement_days || 0),
        improved: improved,
        declined: declined,
        weekdayRates: weekdayRates,
        monFri: monFri,
        streaks: streaks,
        peakDay: peakDay,
        highRiskCount: highRiskCount
      };
    }

    function isAnalyticsOutOfSemester_() {
      return ['risk', 'trend', 'patterns', 'gender'].some(function (key) {
        return !!normalizePayload(analyticsData[key]).out_of_semester;
      });
    }

    function hasAnalyticsLoadFailures_() {
      return Object.keys(analyticsLoadStatus).some(function (key) {
        return analyticsLoadStatus[key] === false;
      });
    }

    function renderAnalyticsNoDataState(monthLabel) {
      var isOutOfSemester = isAnalyticsOutOfSemester_();
      var title = isOutOfSemester
        ? 'เดือนนี้อยู่นอกภาคเรียนที่กำลังใช้งาน'
        : 'ยังไม่มีข้อมูลพอสำหรับวิเคราะห์เดือนนี้';
      var description = isOutOfSemester
        ? 'ลองเลือกเดือนที่อยู่ในภาคเรียนปัจจุบัน เพื่อให้ระบบสรุปแนวโน้ม ความเสี่ยง และรูปแบบการขาดได้ถูกต้อง'
        : 'ยังไม่พบวันเช็คชื่อที่ยืนยันแล้วมากพอในเดือน ' + esc(monthLabel || analyticsMonth || '-') + ' จึงยังวิเคราะห์แนวโน้มให้ไม่ได้';
      var helper = isOutOfSemester
        ? 'เมื่อเลือกเดือนที่มีข้อมูลในภาคเรียน ระบบจะสรุปนักเรียนเสี่ยง เทียบเดือนก่อน และวิเคราะห์ตามเพศให้อัตโนมัติ'
        : 'ยืนยันการเช็คชื่อให้ครบก่อน แล้วกลับมาเปิดหน้าวิเคราะห์อีกครั้ง';
      var nextStep = isOutOfSemester
        ? 'กลับไปเลือกเดือนที่อยู่ในภาคเรียนปัจจุบัน หรือไปตรวจภาคเรียนในหน้าตั้งค่าก่อน'
        : 'เริ่มจากเช็กชื่อและยืนยันวันของเดือนนี้ให้ครบก่อน แล้วระบบจะคำนวณแนวโน้มและดัชนีความเสี่ยงให้เอง';

      var html = '<section class="analytics-section">';
      html += '<div class="card analytics-surface analytics-empty-panel">';
      html += '<div class="analytics-empty-state-icon">' + renderAnalyticsIcon('calendar') + '</div>';
      html += '<div class="analytics-empty-state-title">' + title + '</div>';
      html += '<p class="analytics-empty-state-text">' + description + '</p>';
      html += '<p class="analytics-empty-state-meta">' + helper + '</p>';
      html += '<div class="empty-next-step"><div class="empty-next-step-title">สิ่งที่ควรทำต่อ</div><div class="empty-next-step-text">' + esc(nextStep) + '</div></div>';
      html += '<div class="analytics-empty-actions">';
      html += '<button class="btn btn-primary btn-sm" onclick="window.AppShared.loadPage(\'' + (isOutOfSemester ? 'settings' : 'attendance') + '\')">' + (isOutOfSemester ? 'ไปหน้าตั้งค่า' : 'ไปหน้าเช็คชื่อ') + '</button>';
      html += '<button class="btn btn-ghost btn-sm" onclick="window.AppShared.loadPage(\'' + (isOutOfSemester ? 'reports' : 'attendance') + '\')">' + (isOutOfSemester ? 'กลับไปดูรายงาน' : 'กลับไปยืนยันวันก่อน') + '</button>';
      html += '</div></div></section>';
      return html;
    }

    function getOverviewMetrics() {
      var risk = normalizePayload(analyticsData.risk);
      var trend = normalizePayload(analyticsData.trend);
      var patterns = normalizePayload(analyticsData.patterns);
      var gender = normalizePayload(analyticsData.gender);
      var items = safeArray(risk.items);
      var improved = safeArray(trend.improved);
      var declined = safeArray(trend.declined);
      var weekdayRates = getWeekdayRatesData(patterns);
      var riskTotal = totalCountOf_(risk, 'total_count', items);
      var improvedTotal = totalCountOf_(trend, 'improved_total', improved);
      var declinedTotal = totalCountOf_(trend, 'declined_total', declined);
      var measurementDays = Number(risk.measurement_days || trend.cur_measurement_days || 0);
      var highRisk = items.filter(function (item) {
        return (item.risk_color || '') === 'red';
      }).length;
      var peakDay = null;
      weekdayRates.forEach(function (item) {
        if (!peakDay || Number(item.rate || 0) > Number(peakDay.rate || 0)) peakDay = item;
      });
      var unspecified = gender.unspecified || { count: 0, attendance_pct: null, stats: { total: 0 } };
      var unspecifiedCount = Number(unspecified.count || 0);
      return [
        {
          icon: 'target',
          value: String(riskTotal),
          label: 'นักเรียนเสี่ยง',
          tone: riskTotal > 0 ? 'red' : 'stone',
          meta: measurementDays > 0
            ? ((highRisk > 0 ? 'เสี่ยงสูง ' + highRisk + ' คน · ' : '') + 'จากวันเรียนที่มีข้อมูล ' + measurementDays + ' วัน')
            : 'ยังไม่มีวันเรียนที่มีข้อมูล'
        },
        {
          icon: 'trend-up',
          value: String(improvedTotal),
          label: 'ดีขึ้นจากเดือนก่อน',
          tone: improvedTotal > 0 ? 'green' : 'stone',
          meta: improvedTotal > 0 ? 'มีสัญญาณบวกที่ควรต่อยอด' : 'ยังไม่มีข้อมูลเปรียบเทียบ'
        },
        {
          icon: 'trend-down',
          value: String(declinedTotal),
          label: 'ต้องเฝ้าระวังเพิ่ม',
          tone: declinedTotal > 0 ? 'amber' : 'stone',
          meta: declinedTotal > 0 ? 'มีนักเรียนที่แนวโน้มแย่ลง' : 'ยังไม่พบแนวโน้มแย่ลง'
        },
        {
          icon: 'calendar',
          value: peakDay ? (peakDay.day || '-') + ' ' + formatPercentLabel(peakDay.rate || 0) : '—',
          label: 'วันขาดสูงสุด',
          tone: peakDay && Number(peakDay.rate || 0) >= 15 ? 'red' : (peakDay && Number(peakDay.rate || 0) >= 8 ? 'amber' : 'blue'),
          meta: peakDay ? 'อ้างอิงจากอัตราขาดรายวัน' : 'ยังไม่มีข้อมูลวันเรียน'
        },
        {
          icon: 'balance',
          value: unspecifiedCount > 0 ? String(unspecifiedCount) : 'ครบ',
          label: 'ข้อมูลเพศที่ยังไม่ระบุ',
          tone: unspecifiedCount > 0 ? 'amber' : 'stone',
          meta: unspecifiedCount > 0 ? 'ควรตรวจรายชื่อก่อนใช้เทียบตามเพศ' : 'ข้อมูลเพศถูกระบุครบในรายการนักเรียน'
        }
      ];
    }

    function analyticsMetric(icon, value, label, tone, meta) {
      var html = '';
      html += '<div class="analytics-metric-card analytics-metric-' + esc(tone || 'stone') + '">';
      html += '<div class="analytics-metric-icon">' + renderAnalyticsIcon(icon) + '</div>';
      html += '<div class="analytics-metric-value">' + esc(value) + '</div>';
      html += '<div class="analytics-metric-label">' + esc(label) + '</div>';
      if (meta) {
        html += '<div class="analytics-metric-meta">' + esc(meta) + '</div>';
      }
      html += '</div>';
      return html;
    }

    function renderRiskScores() {
      if (analyticsLoadStatus.risk === false) {
        return '<section class="analytics-section"><div class="card analytics-surface"><div class="alert alert-warning">ยังโหลดข้อมูลดัชนีความเสี่ยงไม่สำเร็จ กรุณาลองใหม่</div></div></section>';
      }
      var d = normalizePayload(analyticsData.risk);
      var items = safeArray(d.items);
      var weights = d.weights || { absent: 4, late: 2, recent_absent: 3 };
      var riskTotal = totalCountOf_(d, 'total_count', items);
      var threshold = Number(d.attention_threshold || 0);
      var measurementDays = Number(d.measurement_days || 0);
      var html = '';

      var criteriaText = 'คัดจากนักเรียนที่ขาดรวมกับสาย';
      criteriaText += threshold > 0 ? ' ตั้งแต่ ' + threshold + ' ครั้งขึ้นไปในเดือนนี้' : ' ในเดือนนี้';
      criteriaText += ' (เกณฑ์เดียวกับที่ตั้งไว้ในหน้าตั้งค่า) · ลาที่แจ้งแล้วไม่นับเป็นความเสี่ยง';
      if (measurementDays > 0) criteriaText += ' · อ้างอิงวันเรียนที่มีข้อมูล ' + measurementDays + ' วัน';

      html += '<section id="analytics-risk-section" class="analytics-section">';
      html += '<div class="analytics-section-head">';
      html += '<div><h2 class="analytics-section-title">ดัชนีความเสี่ยง</h2><p class="analytics-section-text">' + esc(criteriaText) + '</p>';
      html += renderTruncationNote_(items.length, riskTotal);
      html += '</div>';
      html += '</div>';
      html += '<div class="card analytics-surface">';

      if (items.length === 0) {
        html += '<p class="analytics-empty-note">' + renderAnalyticsIcon('success') + '<span>เดือนนี้ยังไม่พบรายชื่อที่มีความเสี่ยงเด่น</span></p>';
        html += '</div></section>';
        return html;
      }

      html += '<p class="analytics-formula">';
      html += 'สูตร: ขาดทั่วไป×' + weights.absent + ' + สาย×' + weights.late + ' + ขาดล่าสุดให้น้ำหนักเพิ่มอีก ×' + weights.recent_absent;
      html += ' · คะแนน 100% = ขาดทุกวันเรียน ไม่ได้เทียบกับคนแย่ที่สุดในห้อง';
      html += ' · ตั้งแต่ 20% ขึ้นไปถือว่าสูง เพราะเท่ากับมาเรียนต่ำกว่า 80% ซึ่งเป็นเกณฑ์เดียวกับ ปพ.6';
      html += '</p>';

          html += '<div class="rpt-compact-item">';

    function renderAnalyticsSpotlight(sales) {
      var title = '';

      var tone = 'stone';
      var targetId = 'analytics-overview-section';
      var targetLabel = 'ดูภาพใหญ่ของเดือนนี้';
      var html = '';

      if (sales.riskTotal > 0) {
        title = 'เดือนนี้มีรายชื่อที่ควรตามก่อนเป็นอันดับแรก';
        tone = 'red';
        targetId = 'analytics-risk-section';
        targetLabel = 'เปิดดัชนีความเสี่ยง';
      } else if (sales.declinedTotal > 0) {
        title = 'มีนักเรียนที่แนวโน้มเริ่มแผ่วลง';
        tone = 'amber';
        targetId = 'analytics-trend-section';
        targetLabel = 'ดูเทียบกับเดือนก่อน';
      } else if (sales.improvedTotal > 0) {
        title = 'เดือนนี้เริ่มเห็นสัญญาณบวกชัดขึ้น';

        targetId = 'analytics-trend-section';

      } else if (sales.peakDay) {

        targetId = 'analytics-patterns-section';
        targetLabel = 'ดูรูปแบบการขาด';
      } else {
        title = 'ภาพรวมเดือนนี้พร้อมใช้ติดตามต่อได้ทันที';

      html += '<div class="analytics-spotlight-copy">';
      html += '<div class="analytics-spotlight-kicker">สรุปให้อ่านจบใน 5 วินาที</div>';
      html += '<div class="analytics-spotlight-title">' + title + '</div>';
      html += '<div class="analytics-spotlight-text">' + esc(text) + '</div>';
      html += '<div class="analytics-spotlight-meta">' + meta + '</div>';
      html += '<div class="analytics-spotlight-tags">';
      html += renderAnalyticsSpotlightTag_('เสี่ยง ' + String(sales.riskTotal) + ' คน');
      html += renderAnalyticsSpotlightTag_('แย่ลง ' + String(sales.declinedTotal) + ' คน');
      html += renderAnalyticsSpotlightTag_('ดีขึ้น ' + String(sales.improvedTotal) + ' คน');
      if (sales.peakDay) html += renderAnalyticsSpotlightTag_('วันขาดสูงสุด ' + String(sales.peakDay.day || '-') + ' ' + formatPercentLabel(sales.peakDay.rate || 0));
      html += '</div>';
      html += '</div>';
      html += '<div class="analytics-spotlight-actions">';
      html += '<button class="btn btn-primary btn-sm" type="button" onclick="AnalyticsPage.copySummarySnippet()">คัดลอกข้อความสรุป</button>';
      html += '<button class="btn btn-ghost btn-sm" type="button" onclick="AnalyticsPage.scrollToSection(\'' + targetId + '\')">' + esc(targetLabel) + '</button>';
      html += '</div>';
      html += '</section>';
      return html;
    }

    function renderAnalyticsSpotlightTag_(label) {
      return '<span class="analytics-spotlight-tag">' + esc(label) + '</span>';
    }

    function buildAnalyticsSummarySnippet_(sales) {
      var parts = [];
      var monthLabel = sales && sales.monthLabel ? sales.monthLabel : (analyticsMonth || '-');
      parts.push('เดือน ' + monthLabel + ' มีนักเรียนเสี่ยง ' + String(sales.riskTotal) + ' คน');
      if (sales.declinedTotal > 0) parts.push('แนวโน้มแย่ลง ' + String(sales.declinedTotal) + ' คน');
      else if (sales.improvedTotal > 0) parts.push('แนวโน้มดีขึ้น ' + String(sales.improvedTotal) + ' คน');
      if (sales.peakDay) parts.push('วันขาดสูงสุดคือ ' + String(sales.peakDay.day || '-') + ' ที่ ' + formatPercentLabel(sales.peakDay.rate || 0));
      if (sales.monFriTotal > 0) parts.push('พบรูปแบบขาดวันจันทร์/ศุกร์ ' + String(sales.monFriTotal) + ' คน');
      else if (sales.streaksTotal > 0) parts.push('มีการขาดติดต่อกัน ' + String(sales.streaksTotal) + ' คน');
      return parts.join(' · ');
    }

    function loadAll() {
      var panel = document.getElementById('page-analytics');
      if (!panel) return;
      if (!E || typeof E.serverCall !== 'function') {
        panel.innerHTML = renderLoadingState('ยังไม่พร้อมโหลดข้อมูลของเดือนนี้');
        return;
      }

      analyticsMonth = getDefaultAnalyticsMonth();
      analyticsData = {};
      analyticsLoadStatus = {};

      var jobs = [
        { key: 'risk', fn: 'getRiskScores' },
        { key: 'trend', fn: 'getTrendComparison' },
        { key: 'patterns', fn: 'getAbsencePatterns' },
        { key: 'gender', fn: 'getGenderAnalytics' }
      ];
      var pending = jobs.length;

      function finalize() {
        pending--;
        if (pending <= 0) {
          panel.innerHTML = buildAnalyticsPage();
        }
      }

      jobs.forEach(function (job) {
        E.serverCall(job.fn, [analyticsMonth], function (result) {
          analyticsData[job.key] = result || {};
          analyticsLoadStatus[job.key] = true;
          finalize();
        }, function () {
          analyticsData[job.key] = {};
          analyticsLoadStatus[job.key] = false;
          finalize();
        });
      });
    }

    function render(state) {
      init(state);
      analyticsMonth = getDefaultAnalyticsMonth();
      var panel = document.getElementById('page-analytics');
      if (!panel) return;
      panel.innerHTML = renderLoadingState('กำลังสรุปภาพรวมของเดือนนี้...');
      loadAll();
    }

    function shiftMonth(offset) {
      var baseMonth = analyticsMonth || getDefaultAnalyticsMonth();
      if (E && typeof E.shiftMonthString === 'function') {
        analyticsMonth = E.shiftMonthString(baseMonth, offset);
      } else {
        var parts = String(baseMonth || '').split('-');
        if (parts.length < 2) return;
        var year = parseInt(parts[0], 10);
        var month = parseInt(parts[1], 10);
        var totalMonths = (year * 12) + (month - 1) + (parseInt(offset, 10) || 0);
        analyticsMonth = Math.floor(totalMonths / 12) + '-' + ('0' + ((totalMonths % 12) + 1)).slice(-2);
      }

      var panel = document.getElementById('page-analytics');
      panel.innerHTML = renderLoadingState('กำลังสรุปภาพรวมของเดือนนี้...');
      loadAll();
    }

    function copyTextToClipboard_(text, onSuccess, onError) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(onSuccess).catch(function () {
          fallbackCopyText_(text, onSuccess, onError);
        });
        return;
      }
      fallbackCopyText_(text, onSuccess, onError);
    }

    function fallbackCopyText_(text, onSuccess, onError) {
      try {
        var textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', 'readonly');
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        var copied = document.execCommand('copy');
        document.body.removeChild(textarea);
        if (copied) {
          onSuccess();
          return;
        }
      } catch (err) {}
      onError();
    }
